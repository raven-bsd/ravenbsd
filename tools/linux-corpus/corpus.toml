# Initial Linux syscall corpus. Placeholders in argv/setup/env values: {work} = per-program scratch dir
# (created fresh, removed after the run), {corpus} = directory containing this file.
# Categories: static | dynamic | service | language | toolchain.

[[program]]
id = "hello-rust-musl"
category = "static"
requires = ["rustc"]
setup = [["rustc", "--target", "x86_64-unknown-linux-musl", "-O", "{corpus}/programs/hello.rs", "-o", "{work}/hello"]]
argv = ["{work}/hello"]
expect_exit = 0
timeout_secs = 120

