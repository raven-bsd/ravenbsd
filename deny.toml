#
# SC2: cargo-deny policy. The first-party utilities are `raven-tar`/`raven-time`; the former
# `tar`/`time` name collision is gone, so there are no advisory exceptions. Owner/reachability
# records and the fork register are in `audit.toml`, `docs/forks.md` and `docs/supply-chain.md`.

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
