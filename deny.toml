#
# SC1: cargo-deny policy. Every advisory exception below is the first-party workspace `tar`/`time`
# 0.1.0 name collision, not the upstream crate: no upstream `tar-rs`/`time` source is linked.
# The structured owner/reachability/expiry record is in `audit.toml` and `docs/supply-chain.md`.

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    "RUSTSEC-2018-0002",
    "RUSTSEC-2021-0080",
    "RUSTSEC-2026-0067",
    "RUSTSEC-2026-0068",
    "RUSTSEC-2020-0071",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
