# Cargo aliases. Per-target flags are set by xtask (architecture/10-build-and-release.md), not here,
# because the kernel and userland need different code models.
[alias]
xtask = "run --package xtask --"

# SC1: normal builds resolve from crates.io. The vendored release graph is opt-in: pass
# `--config .cargo/vendor.toml` (and, for nested xtask cargo builds, the matching
# CARGO_SOURCE_* environment) to `cargo --offline`. See docs/supply-chain.md.

# K19a: getrandom 0.4 selects its custom backend through this cfg. The
# `raven-getrandom` crate provides the matching `__getrandom_v03_custom`
# symbol; the kernel entropy primitive (G-7) currently reports UNSUPPORTED.
[target.'cfg(target_os = "ravenbsd")']
rustflags = ["--cfg", 'getrandom_backend="custom"']
