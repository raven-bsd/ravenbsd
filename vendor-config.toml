#
# SC1: opt-in vendored-source configuration for the offline release build.
#
# This file is deliberately NOT `.cargo/config.toml`: a normal build (and a clean checkout without
# the untracked `vendor/` tree) resolves from crates.io. Use this config only with a populated
# vendor snapshot:
#
#   cargo --offline --config vendor-config.toml xtask image --arch x86_64 --profile release ...
#
# xtask spawns nested `cargo build` processes for components; they do not inherit `--config`.
# Set the same source through environment config so the children see it:
#
#   CARGO_NET_OFFLINE=true \
#   CARGO_SOURCE_CRATES_IO_REPLACE_WITH=vendored-sources \
#   CARGO_SOURCE_VENDORED_SOURCES_DIRECTORY="$PWD/vendor" \
#   cargo --offline --config vendor-config.toml xtask image --arch x86_64 --profile release ...
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
