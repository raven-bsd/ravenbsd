# K235: the release command set for clean shutdown, reboot and poweroff.

[[initfs.programs]]
package = "raven-shutdown"
path = "/sbin/shutdown"

[[initfs.programs]]
package = "raven-reboot"
path = "/sbin/reboot"

[[initfs.programs]]
package = "raven-poweroff"
path = "/sbin/poweroff"
