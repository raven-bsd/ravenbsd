# K229: the base regular account `raven` (uid/gid 1000, /home/raven, /bin/rsh) is in the
# account files staged by login.toml. This fragment creates its home directory and installs a
# disabled console-autologin file; `raven config` rewrites that file on a save.
[[initfs.files]]
src = "profiles/release.d/home-raven.keep"
path = "/home/raven/.keep"
mode = 0o644

[[initfs.files]]
src = "profiles/release.d/autologin.conf"
path = "/etc/raven/autologin.toml"
mode = 0o644
