#
# K195: the demo password database for the SSH service. Both accounts use the documented demo
# credential; the image remains a root-recovery/demo system and must not face an untrusted
# network. This fragment sorts after the base `login.toml`, which stages the root-only shadow.

[[initfs.files]]
src = "profiles/ssh.d/shadow"
path = "/etc/shadow"
mode = 0o600
