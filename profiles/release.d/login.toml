#
# The release login fragment: REL1 installs the getty/login binaries; this
# fragment wires them to consd and installs the root account files.
#
# REL2a's release profile extends `shell` and consumes `profiles/release.d/`.

[[initfs.programs]]
package = "raven-getty"
path = "/bin/getty"

[[initfs.programs]]
package = "login"
path = "/bin/login"

[[initfs.files]]
src = "profiles/release.d/login.service.manifest"
path = "/etc/services.d/getty.toml"

[[initfs.files]]
src = "profiles/ssh.d/passwd"
path = "/etc/passwd"
mode = 0o644

[[initfs.files]]
src = "profiles/ssh.d/group"
path = "/etc/group"
mode = 0o644

[[initfs.files]]
src = "profiles/ssh.d/shadow"
path = "/etc/shadow"
mode = 0o600

[[initfs.files]]
src = "etc/profile"
path = "/etc/profile"
mode = 0o644

[[initfs.files]]
src = "etc/motd"
path = "/etc/motd"
mode = 0o644
