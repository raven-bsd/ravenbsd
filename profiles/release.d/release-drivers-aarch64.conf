#
# aarch64 release driver table for the QEMU `virt` machine. The first `-device virtio-net-device`
# is the first virtio-mmio slot (`virtio_mmio@a000000`, 0x200, GIC SPI 16/INTID 48); devd's
# platform launch grants that window, a DMA buffer and the IRQ, and the driver uses the
# virtio-mmio register transport (`transport=mmio`).

[[driver]]
name = "virtio-net"
compatible = "virtio,mmio"
exec = "/sbin/virtio-net"
args = ["transport=mmio", "bar=0", "resources=dma+irq", "serve"]
