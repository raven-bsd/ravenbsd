#
# The release network stack from profiles/server.toml. On x86_64 pcid finds the virtio-pci
# function and devd launches it in serve mode; on aarch64 there is no PCI scheme, so devd runs
# `dtb launch` against the staged QEMU `virt` tree and the driver binds the virtio-mmio window.
# netd publishes the static QEMU user-network address (10.0.2.15/24, gateway 10.0.2.2) once
# `nic:info` exists; resolvd follows the lease/static DNS, and the ifconfig/ping/route/netstat
# tools are available in the shell.

[[initfs.programs]]
package = "raven-pcid"
path = "/sbin/pcid"

[[initfs.programs]]
package = "raven-devd"
path = "/sbin/devd"

[[initfs.programs]]
package = "virtio-net"
path = "/sbin/virtio-net"

[[initfs.programs]]
package = "netd"
path = "/sbin/netd"

[[initfs.programs]]
package = "resolvd"
path = "/sbin/resolvd"

[[initfs.programs]]
package = "raven-ifconfig"
path = "/sbin/ifconfig"

[[initfs.programs]]
package = "raven-ping"
path = "/sbin/ping"

[[initfs.programs]]
package = "raven-route"
path = "/sbin/route"

[[initfs.programs]]
package = "raven-netstat"
path = "/sbin/netstat"

[[initfs.files]]
src = "build/fixtures/virt-dtb/{arch}/pcid.toml"
path = "/etc/services.d/pcid.toml"
generated = true

[[initfs.files]]
src = "build/fixtures/virt-dtb/{arch}/devd.manifest"
path = "/etc/services.d/devd.toml"
generated = true

[[initfs.files]]
src = "build/fixtures/virt-dtb/{arch}/drivers.conf"
path = "/etc/drivers.toml"
generated = true

[[initfs.files]]
src = "build/fixtures/virt-dtb/virt.dtb"
path = "/etc/pi4.dtb"
mode = 0o644
generated = true

[[initfs.files]]
src = "rootfs/server/etc/services.d/netd.toml"
path = "/etc/services.d/netd.toml"

[[initfs.files]]
src = "rootfs/server/etc/services.d/resolvd.toml"
path = "/etc/services.d/resolvd.toml"

[[initfs.files]]
src = "etc/resolv.conf"
path = "/etc/resolv.conf"
mode = 0o644
