# S98 guest disk tools: lsblk, newfs and gpart with their man pages, plus the scratch-disk stack.
# The virtio-blk driver entry lives in the shared drivers table; blockd/fsd-ufs are staged
# `enable = false` so a release boot without a scratch disk is unchanged and the qtest starts
# them after newfs.

[[initfs.programs]]
package = "lsblk"
path = "/bin/lsblk"

[[initfs.programs]]
package = "newfs"
path = "/sbin/newfs"

[[initfs.programs]]
package = "gpart"
path = "/sbin/gpart"

[[initfs.programs]]
package = "virtio-blk"
path = "/sbin/virtio-blk"

[[initfs.programs]]
package = "raven-blockd"
path = "/sbin/blockd"

[[initfs.programs]]
package = "fsd-ufs"
path = "/sbin/fsd-ufs"

[[initfs.files]]
src = "userland/bin/lsblk/release-blockd.manifest"
path = "/etc/services.d/blockd.toml"

[[initfs.files]]
src = "userland/bin/lsblk/release-fsd-ufs.manifest"
path = "/etc/services.d/fsd-ufs.toml"

[[initfs.files]]
src = "docs/man1/lsblk.1"
path = "/usr/share/man/man1/lsblk.1"

[[initfs.files]]
src = "docs/man8/newfs.8"
path = "/usr/share/man/man8/newfs.8"

[[initfs.files]]
src = "docs/man8/gpart.8"
path = "/usr/share/man/man8/gpart.8"
