# S98/S110 guest disk tools: lsblk, newfs and gpart with their man pages, plus the virtio-blk,
# blockd and fsd-ufs stack. The driver entry lives in the single shared `/etc/drivers.toml`
# staged by 20-net; this fragment does not stage a second table. blockd and fsd-ufs are
# `enable = false`, so a release image booted without a scratch disk is unchanged; the
# disk-tools qtest starts them through svcctl after login now that svcd grants the late scheme
# prefixes.

[[initfs.programs]]
package = "lsblk"
path = "/bin/lsblk"

[[initfs.programs]]
package = "newfs"
path = "/sbin/newfs"

[[initfs.programs]]
package = "gpart"
path = "/sbin/gpart"

[[initfs.programs]]
package = "virtio-blk"
path = "/sbin/virtio-blk"

[[initfs.programs]]
package = "raven-blockd"
path = "/sbin/blockd"

[[initfs.programs]]
package = "fsd-ufs"
path = "/sbin/fsd-ufs"

[[initfs.files]]
src = "userland/init/services/blockd.toml"
path = "/etc/services.d/blockd.toml"

[[initfs.files]]
src = "userland/init/services/fsd-ufs.toml"
path = "/etc/services.d/fsd-ufs.toml"

[[initfs.files]]
src = "docs/man1/lsblk.1"
path = "/usr/share/man/man1/lsblk.1"

[[initfs.files]]
src = "docs/man8/newfs.8"
path = "/usr/share/man/man8/newfs.8"

[[initfs.files]]
src = "docs/man8/gpart.8"
path = "/usr/share/man/man8/gpart.8"
