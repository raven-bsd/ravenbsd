#
# K434 S3 server-log evidence. sshd writes /tmp/sshd.log as root (mode 0600), and the post-exec
# command path is exactly what the matrix is measuring, so the log cannot be read back over SSH.
# This one-shot test service waits for the first auth then copies the log to the serial console,
# where the matrix reads the exact `Accepted password for raven` line. It never touches sshd.

[[initfs.files]]
src = "profiles/release.d/ssh-matrix-logdump.service.manifest"
path = "/etc/services.d/ssh-matrix-logdump.toml"
mode = 0o644
