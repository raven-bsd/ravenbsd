#
# The release session ends when getty exits (the brush login shell typed `exit`), so the QEMU gate
# can assert `init exited (0)`. The shell parent's rsh service is disabled by rc.conf; getty
# launches the root session shell chosen by login policy (brush).

[[initfs.files]]
src = "profiles/release.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/release.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644
