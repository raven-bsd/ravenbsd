# Release netd over the persistent `nic:` frame service. devd launches virtio-net in `serve`
# mode; the driver registers `nic:` before netd starts. `getty` is a deliberate boot-order
# dependency: the release image must print the login prompt without waiting for the DHCP lease
# and resolver, while netd/resolvd keep their normal readiness checks and required status.
name = "netd"
exec = "/sbin/netd"
args = ["netd", "nic"]
needs = ["getty", "logd", "scheme:nic"]
provides = ["scheme:net"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"
