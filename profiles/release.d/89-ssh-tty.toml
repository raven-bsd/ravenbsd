# K434 S8 test-only /bin/tty. The release profile has no tty utility; this stages the fixture built
# by tests/fixtures/ssh-tty/build.sh so `ssh -tt ... tty` can print /dev/pts/N. It is test tooling.

[[initfs.files]]
src = "build/fixtures/ssh-tty/tty"
path = "/bin/tty"
mode = 0o755
generated = true

# K495 rev166 test-only shell-step probe: posix_spawn/fork + waitpid with a SIGSEGV watchdog, used
# to separate a brush post-child fault from the libc/std process path.
[[initfs.files]]
src = "build/fixtures/ssh-tty/shellstep"
path = "/bin/shellstep"
mode = 0o755
generated = true
