#
# The release driver table. `devd` launches the first matching PCI function.
#
# virtio-net requests the BAR and DMA window but not the legacy IRQ: QEMU virt's PCIe INTx
# does not expose a routed GSI through the ACPI MCFG bundle, and the frame-service pump already
# has a 10 ms poll bound. The K396 IRQ test profile keeps its own table and still exercises the
# interrupt path; only the release image uses the poll-only grant.

# QEMU `virtio-blk-pci,drive=scratch,disable-legacy=on`: vendor 0x1af4, device 0x1042.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1

# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device 0x1041. `serve` keeps
# the frame service alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma", "serve"]
cycles = 1
