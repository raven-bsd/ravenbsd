# The hardware/root profile. Phase 1 starts only the storage bootstrap from the initfs
# (logd -> initfsd -> blockd -> fsd-ufs and the vfsd with the ufs dependency) plus the device
# servers. Phase 2 mounts the UFS root at /root and starts the services declared there.
#
# The qtest uses test-exit=1 and an exit-when-settled svcd.conf; a production image changes only
# those two test settings.

name = "hw"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-logd", path = "/sbin/logd" },
    { package = "raven-initfsd", path = "/sbin/initfsd" },
    { package = "raven-ramfsd", path = "/sbin/ramfsd" },
    { package = "raven-nulld", path = "/sbin/nulld" },
    { package = "raven-zerod", path = "/sbin/zerod" },
    { package = "raven-randd", path = "/sbin/randd" },
    { package = "raven-blockd", path = "/sbin/blockd" },
    { package = "fsd-ufs", path = "/sbin/fsd-ufs" },
    { package = "raven-vfsd", path = "/sbin/vfsd" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
]

files = [
    { src = "etc/services.d/logd.toml", path = "/etc/services.d/logd.toml" },
    { src = "etc/services.d/initfsd.toml", path = "/etc/services.d/initfsd.toml" },
    { src = "etc/services.d/ramfsd.toml", path = "/etc/services.d/ramfsd.toml" },
    { src = "etc/services.d/nulld.toml", path = "/etc/services.d/nulld.toml" },
    { src = "etc/services.d/zerod.toml", path = "/etc/services.d/zerod.toml" },
    { src = "etc/services.d/randd.toml", path = "/etc/services.d/randd.toml" },
    { src = "etc/services.d/blockd.toml", path = "/etc/services.d/blockd.toml" },
    { src = "etc/services.d/fsd-ufs.toml", path = "/etc/services.d/fsd-ufs.toml" },
    { src = "etc/services.d/pcid.toml", path = "/etc/services.d/pcid.toml" },
    { src = "etc/services.d/devd.toml", path = "/etc/services.d/devd.toml" },
    { src = "profiles/hw.d/vfsd.manifest", path = "/etc/services.d/vfsd.toml" },
    { src = "etc/mounts", path = "/etc/mounts" },
    { src = "profiles/hw.d/svcd.conf", path = "/etc/svcd.conf" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
