# QEMU `virtio-blk-pci,drive=d0,disable-legacy=on`: vendor 0x1af4, device 0x1042. The modern
# function keeps its registers in BAR4; the 1 GiB disk is attached as drive `d0`. The `test` token
# asks the driver for the qtest pattern self-test, and `cycles = 2` exercises the restart path.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq", "test"]
cycles = 2
