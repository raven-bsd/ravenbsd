# Pi 4 shell image variant: the generic shell initfs with the Pi 4 UART and the
# staged EMMC2/blockd service declarations.
name = "pi4-shell"
extends = "shell"

[boot]
cmdline = "console=ttyAMA0 loglevel=info"
log_level = "info"
