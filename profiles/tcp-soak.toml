# K285: the TCP soak image. It is the release image wiring (the shell service set plus the
# QEMU user-network stack, getty/login and the release rc policy) plus the `nc` tool and the
# guest TCP workload script staged at /etc/tcp-soak-workload.sh.
#
# `extends` is limited to one level and `release` already extends `shell`, so this profile
# extends `shell` and re-declares the release.d manifest entries in `profiles/tcp-soak.d/`
# against the same shared sources (no content is duplicated). It deliberately omits the
# release disk tools and the target-built `raven` admin client: generated artifacts the TCP
# soak does not use.
#
# `[image] release = true` gives the image the release provenance rule: it must embed the
# kernel built from the clean checkout at HEAD (see xtask/src/image.rs).
name = "tcp-soak"
extends = "shell"

[initfs]
release = true
dynamic = true

[image]
release = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
