#
# K176: the QEMU UFS-root payload. The profile stages the release userland into a
# UFS2 root disk; the separate qemu-ufs-boot profile stages only the bootstrap
# initfs (scheme servers, storage drivers, blockd/fsd-ufs/vfsd). The image builder
# pivots this payload to `/` after boot.

name = "qemu-ufs"
extends = "shell"

[initfs]
release = true

[image]
release = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
