# K78b: the modern admin profile. The shell base gives the boot-to-shell dialogue; the fragment
# installs the one-shot `svcd`/`rc.conf` pair and the target `raven` binary built by
# `tests/fixtures/modern-admin/build.sh`.

name = "raven-admin-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
