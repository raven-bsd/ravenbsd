# QEMU virtio-blk-pci attached as `d0` by the update-health qtest.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
