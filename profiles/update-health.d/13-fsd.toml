# fsd-ufs mounts partition 2 of the virtio-blk disk (partition 1 is the ESP with the A/B slots);
# vfsd attaches `ufs:` so init can mount the root at /root.

[[initfs.files]]
src = "profiles/update-health.d/fsd-ufs.manifest"
path = "/etc/services.d/fsd-ufs.toml"

[[initfs.files]]
src = "profiles/update-health.d/vfsd.manifest"
path = "/etc/services.d/vfsd.toml"
