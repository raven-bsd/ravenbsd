#
# The core-servers qtest exercises a one-shot client. K11's exit_when_settled mode does not wait
# for services whose restart policy is "never", so every long-running service inherited from the
# shell profile is overridden here; they still start and provide their schemes, but their worker
# threads return after readiness and svcd can exit when the coretest client finishes. The
# production manifests keep on-failure. ramfsd (K17) and initfsd (K62) were added to the shell
# profile later; without these two overrides the inherited on-failure services keep the
# core-servers case from ever reaching "init exited".

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
