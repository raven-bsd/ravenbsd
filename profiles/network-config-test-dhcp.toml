# K198 staging profile: the release image plus an explicit DHCP drop-in that also carries a
# sentinel static address. The sentinel must never reach the interface in DHCP mode.
name = "network-config-test-dhcp"
extends = "shell"

[initfs]
release = true
dynamic = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
