#
# The file-tools qtest is one-shot: every resident service is pinned to "never" so svcd can
# exit as soon as tooltest finishes.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
consd_restart="never"
initfsd_restart="never"
ramfsd_restart="never"
vfsd_restart="never"
