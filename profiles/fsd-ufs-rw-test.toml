# Standalone read-write UFS profile: the same core services as the K54
# profile, blockd over a RAM disk, fsd-ufs mounted read-write, and the RW
# probe plus guest fsck.

name = "fsd-ufs-rw-test"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
