# Test-only overlay on the real `server` image. Every product program, driver,
# service manifest and mount comes from `server`; this profile adds only the
# B70 end-to-end probe. The fixture build packs the probe, its service
# manifest, and a test-only `/etc/svcd.conf` that exits with the probe status.
#
# No network service is re-added here: virtio-net, netd, resolvd and the tools
# are the same binaries and manifests the production server image boots.

name = "hw-net"
extends = "server"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
