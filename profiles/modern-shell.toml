# The modern-shell profile: the shell service set with brush as the interactive login shell.
# It deliberately does not extend `shell`: the rescue `shell`/`shell-test` profile keeps
# `/bin/rsh` as the console owner, while this profile starts the `brush` service instead.

name = "modern-shell"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-uname", path = "/bin/uname" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
