# The file-tools integration profile. It inherits the shell profile, its services and the ten
# base file tools, then adds the one-shot tooltest client and its settled-exit settings.

name = "file-tools-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
