#
# K414: the 0.1.0 minimal-server product profile. It is the shell profile plus the
# release service set, a writable UFS2 root disk and a bootstrap initfs. The image
# builder selects the persistent-UFS path from the rootfs spec and the sibling
# 0.1.0-ufs-boot profile, not from a profile name.

name = "0.1.0-ufs"
extends = "shell"

[initfs]
release = true
dynamic = true

[image]
release = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
