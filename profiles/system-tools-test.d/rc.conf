#
# The one-shot tool services must be the only reason svcd stays alive; the long-running services
# inherited from the shell profile are overridden so they do not wait for a restart.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
vfsd_restart="never"
