# The qtest drives the only deliberate restart (resolvd) through svcctl; the
# supervisor must not race it.
logd_restart="never"
initfsd_restart="never"
ramfsd_restart="never"
vfsd_restart="never"
pcid_restart="never"
devd_restart="never"
netd_restart="never"
resolvd_restart="never"
b15_dnsd_restart="never"
b15_resolv_setup_restart="never"
b15_resolv_probe_restart="never"
b15_resolv_restart_restart="never"
b15_resolv_probe2_restart="never"
