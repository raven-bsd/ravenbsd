#
# One-shot session: the shell exits and svcd follows it via /etc/svcd.conf. Pin the resident
# services so they do not restart while the image is shutting down.

logd_restart = "never"
initfsd_restart = "never"
ramfsd_restart = "never"
nulld_restart = "never"
zerod_restart = "never"
randd_restart = "never"
vfsd_restart = "never"
consd_restart = "never"
