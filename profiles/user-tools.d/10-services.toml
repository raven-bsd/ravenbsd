#
# The console, filesystem and shell services the user-tools session needs. This mirrors the
# shell profile without the uutils slice, so the first-party `/bin/id` is not shadowed.

[[initfs.programs]]
package = "raven-logd"
path = "/sbin/logd"

[[initfs.programs]]
package = "raven-initfsd"
path = "/sbin/initfsd"

[[initfs.programs]]
package = "raven-ramfsd"
path = "/sbin/ramfsd"

[[initfs.programs]]
package = "raven-nulld"
path = "/sbin/nulld"

[[initfs.programs]]
package = "raven-zerod"
path = "/sbin/zerod"

[[initfs.programs]]
package = "raven-randd"
path = "/sbin/randd"

[[initfs.programs]]
package = "raven-vfsd"
path = "/sbin/vfsd"

[[initfs.programs]]
package = "raven-consd"
path = "/sbin/consd"

[[initfs.programs]]
package = "raven-rsh"
path = "/bin/rsh"

[[initfs.files]]
src = "build/brush"
path = "/bin/brush"
mode = 0o755
generated = true

[[initfs.files]]
src = "etc/services.d/logd.toml"
path = "/etc/services.d/logd.toml"

[[initfs.files]]
src = "etc/services.d/initfsd.toml"
path = "/etc/services.d/initfsd.toml"

[[initfs.files]]
src = "etc/services.d/ramfsd.toml"
path = "/etc/services.d/ramfsd.toml"

[[initfs.files]]
src = "etc/services.d/nulld.toml"
path = "/etc/services.d/nulld.toml"

[[initfs.files]]
src = "etc/services.d/zerod.toml"
path = "/etc/services.d/zerod.toml"

[[initfs.files]]
src = "etc/services.d/randd.toml"
path = "/etc/services.d/randd.toml"

[[initfs.files]]
src = "etc/services.d/vfsd.toml"
path = "/etc/services.d/vfsd.toml"

[[initfs.files]]
src = "etc/services.d/consd.toml"
path = "/etc/services.d/consd.toml"

[[initfs.files]]
src = "etc/services.d/rsh.toml"
path = "/etc/services.d/rsh.toml"

[[initfs.files]]
src = "etc/mounts"
path = "/etc/mounts"

[[initfs.files]]
src = "etc/svcd.conf"
path = "/etc/svcd.conf"
