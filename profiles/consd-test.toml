# The consd integration profile. It inherits the shell profile (console server and the core
# servers) and adds the one-shot probe that reads a line from `tty:console`.

name = "consd-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
