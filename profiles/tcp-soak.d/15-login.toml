#
# K285: the release login wiring (getty on the console, /bin/login, root account files).
# Mirrors profiles/release.d/login.toml, which the tcp-soak profile cannot consume through
# `extends` because extends is limited to one level.

[[initfs.programs]]
package = "raven-getty"
path = "/bin/getty"

[[initfs.programs]]
package = "login"
path = "/bin/login"

[[initfs.files]]
src = "profiles/release.d/login.service.manifest"
path = "/etc/services.d/getty.toml"

[[initfs.files]]
src = "etc/passwd"
path = "/etc/passwd"
mode = 0o644

[[initfs.files]]
src = "etc/group"
path = "/etc/group"
mode = 0o644

[[initfs.files]]
src = "etc/shadow"
path = "/etc/shadow"
mode = 0o600

[[initfs.files]]
src = "etc/profile"
path = "/etc/profile"
mode = 0o644

[[initfs.files]]
src = "etc/motd"
path = "/etc/motd"
mode = 0o644
