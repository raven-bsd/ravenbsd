#
# K285: the `raven` account home and the disabled console-autologin file, same as the
# release image (see profiles/release.d/86-users.toml).

[[initfs.files]]
src = "profiles/release.d/home-raven.keep"
path = "/home/raven/.keep"
mode = 0o644

[[initfs.files]]
src = "profiles/release.d/autologin.conf"
path = "/etc/raven/autologin.toml"
mode = 0o644
