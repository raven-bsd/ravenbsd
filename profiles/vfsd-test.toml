# The vfsd integration profile. It inherits the shell profile (including the core
# servers, initfsd, ramfsd and vfsd) and adds the one-shot probe.

name = "vfsd-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
