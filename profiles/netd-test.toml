# The netd qtest is deliberately standalone: init, logd, netd, svcctl and the one-shot probes.
# It does not need the shell profile or the block/filesystem servers, and keeping it small leaves
# room in the 64 MiB ESP for the debug binaries.

name = "netd-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-logd", path = "/sbin/logd" },
    { package = "netd", path = "/sbin/netd" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
