#
# Release service policy for the bootstrap: normal restarts, getty is the exit
# condition once the UFS service set is merged.

[[initfs.files]]
src = "profiles/qemu-ufs-boot.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/release.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644
