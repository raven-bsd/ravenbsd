#
# Bootstrap rc policy: every resident scheme service is one-shot for the preflight.
# The release rsh service is not staged in the bootstrap, so its key is omitted.

logd_restart = "never"
sysd_restart = "never"
randd_restart = "never"
zerod_restart = "never"
nulld_restart = "never"
ramfsd_restart = "never"
initfsd_restart = "never"
consd_restart = "never"
vfsd_restart = "never"
