#
# K11's exit_when_settled mode only skips waiting for services whose restart
# policy is "never". All long-running services inherited from the shell profile
# are overridden here so svcd can exit after the one-shot vfsd probe; the
# production manifests keep on-failure.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
