#
# One-shot session: every resident service the shell profile starts is pinned to "never" so
# `exit_when_exits = rsh` can end svcd as soon as the shell leaves; the shell itself already has
# `restart = "never"` in its manifest.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
