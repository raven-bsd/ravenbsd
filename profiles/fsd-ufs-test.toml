# Standalone read-only UFS profile: init, the initfs/ramfs core services vfsd
# needs, blockd over a RAM disk, fsd-ufs over block:0 partition 1, and the
# one-shot probe.  It deliberately does not extend `shell` so the image stays
# below the 64 MiB ESP limit with the 16 MiB UFS payload.

name = "fsd-ufs-test"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
