# K235: stage the power commands into the UFS-root payload at /sbin.

[[initfs.programs]]
package = "raven-shutdown"
path = "/sbin/shutdown"

[[initfs.programs]]
package = "raven-reboot"
path = "/sbin/reboot"

[[initfs.programs]]
package = "raven-poweroff"
path = "/sbin/poweroff"
