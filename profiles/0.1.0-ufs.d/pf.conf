#
# K414: default fail-closed policy for the UFS server. Loopback is trusted; DNS and
# ICMP are the only network flows allowed before the SSH service lands. Everything
# else is blocked by default.

pass quick on lo all
pass out quick on eth0 proto udp from any to any port 53 keep state
pass out quick on eth0 proto icmp from any to any keep state
pass in quick on eth0 proto icmp from any to any keep state
block all
