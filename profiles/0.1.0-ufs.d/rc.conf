#
# The release profile uses getty/login instead of the shell parent's rsh service.

rsh_enable = "NO"

# The QEMU gate exits when getty exits, so every resident shell service is one-shot.
logd_restart = "never"
sysd_restart = "never"
randd_restart = "never"
zerod_restart = "never"
nulld_restart = "never"
ramfsd_restart = "never"
initfsd_restart = "never"
consd_restart = "never"
vfsd_restart = "never"
