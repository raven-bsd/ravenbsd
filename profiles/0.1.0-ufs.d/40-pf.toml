#
# K414: stage the fail-closed pf ruleset and the first-party pfctl front-end. netd
# loads /etc/pf.conf at boot; a missing file would leave the filter off, so the file
# is part of the product image rather than a test fixture.

[[initfs.files]]
src = "profiles/0.1.0-ufs.d/pf.conf"
path = "/etc/pf.conf"
mode = 0o644

[[initfs.programs]]
package = "raven-pfctl"
path = "/sbin/pfctl"
