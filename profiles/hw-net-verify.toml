# Second B70 boot: the host-echo artifact from the first boot is verified by the case's pre
# step; the guest only proves a clean second boot with the same real service manager.
name = "hw-net-verify"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-logd", path = "/sbin/logd" },
    { package = "raven-echo", path = "/bin/echo" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
