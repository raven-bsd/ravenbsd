#
# K182: mark the Pi 4 SD boot as a live-pivot profile. svcd mounts the EMMC2
# partition tree `ufs:` at `/` instead of `/root` once blockd/fsd-ufs/vfsd are
# ready. The release policy files are staged here too so the UFS payload (which
# is built from this profile) carries the getty exit and restart rules.

[[initfs.files]]
src = "profiles/pi4-rootfs.d/root-mode"
path = "/etc/raven/root-mode"
mode = 0o644

[[initfs.files]]
src = "profiles/release.d/rc.conf"
path = "/etc/rc.conf"
mode = 0o644

[[initfs.files]]
src = "profiles/release.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644
