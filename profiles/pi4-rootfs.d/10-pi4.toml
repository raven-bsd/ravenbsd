# Pi 4 rootfs storage declaration. Unlike the release profile, this fragment
# deliberately does not stage blockd; 20-storage.toml owns the read-write UFS
# service set for the SD root image.

[[initfs.files]]
src = "profiles/pi4.d/emmc2.manifest"
path = "/etc/services.d/emmc2.toml"
