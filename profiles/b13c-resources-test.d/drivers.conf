# QEMU `-device edu`: vendor 0x1234, device 0x11e8, BAR0 is a 1 MiB memory BAR and the function
# has a legacy INTx line. `dma+irq` asks devd for the per-function DMA buffer and IRQ handle.
[[driver]]
name = "b13c"
vendor = 0x1234
device = 0x11e8
exec = "/sbin/b13c-resources"
args = ["bar=0", "resources=dma+irq"]
cycles = 2
