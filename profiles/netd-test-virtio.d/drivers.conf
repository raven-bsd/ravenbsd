# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device 0x1041.
# `serve` selects the persistent `nic:` frame service; one launch stays alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1
