#
# Network tools and services for the UFS payload. The bootstrap devd (K179) launches
# both virtio functions; netd/resolvd here consume the nic: scheme after the pivot.

[[initfs.programs]]
package = "virtio-net"
path = "/sbin/virtio-net"

[[initfs.programs]]
package = "netd"
path = "/sbin/netd"

[[initfs.programs]]
package = "resolvd"
path = "/sbin/resolvd"

[[initfs.programs]]
package = "raven-ifconfig"
path = "/sbin/ifconfig"

[[initfs.programs]]
package = "raven-ping"
path = "/sbin/ping"

[[initfs.programs]]
package = "raven-route"
path = "/sbin/route"

[[initfs.programs]]
package = "raven-netstat"
path = "/sbin/netstat"

[[initfs.files]]
src = "rootfs/server/etc/services.d/netd.toml"
path = "/etc/services.d/netd.toml"

[[initfs.files]]
src = "rootfs/server/etc/services.d/resolvd.toml"
path = "/etc/services.d/resolvd.toml"

[[initfs.files]]
src = "etc/resolv.conf"
path = "/etc/resolv.conf"
mode = 0o644
