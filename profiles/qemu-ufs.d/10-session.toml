#
# K234: UFS demo login/session entries. The getty service restarts on a normal
# shell exit and the demo svcd.conf has no exit_when_exits, so the console
# returns to `login:` instead of ending init. The release profile keeps its
# one-shot test-exit policy.

[[initfs.programs]]
package = "raven-getty"
path = "/bin/getty"

[[initfs.programs]]
package = "login"
path = "/bin/login"

[[initfs.programs]]
package = "raven-ptyd"
path = "/sbin/ptyd"

[[initfs.files]]
src = "profiles/qemu-ufs.d/getty.manifest"
path = "/etc/services.d/getty.toml"

[[initfs.files]]
src = "profiles/ssh.d/ptyd.service.manifest"
path = "/etc/services.d/ptyd.toml"
mode = 0o644

[[initfs.files]]
src = "etc/passwd"
path = "/etc/passwd"
mode = 0o644

[[initfs.files]]
src = "etc/group"
path = "/etc/group"
mode = 0o644

[[initfs.files]]
src = "etc/shadow"
path = "/etc/shadow"
mode = 0o600

[[initfs.files]]
src = "etc/profile"
path = "/etc/profile"
mode = 0o644

[[initfs.files]]
src = "etc/motd"
path = "/etc/motd"
mode = 0o644

[[initfs.files]]
src = "profiles/release.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/qemu-ufs.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644
