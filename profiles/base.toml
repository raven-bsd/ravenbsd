name = "base"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-uname", path = "/bin/uname" },
    { package = "raven-echo", path = "/bin/echo" },
]

[boot]
cmdline = "console=ttyS0 test-exit=1"
log_level = "info"

[[initfs.files]]
src = "etc/raven/raven.toml"
path = "/etc/raven/raven.toml"

[[initfs.files]]
src = "etc/raven/profiles/base.toml"
path = "/etc/raven/profiles/base.toml"

[[initfs.files]]
src = "etc/raven/profiles/tiny.toml"
path = "/etc/raven/profiles/tiny.toml"

[[initfs.files]]
src = "etc/raven/profiles/server.toml"
path = "/etc/raven/profiles/server.toml"
