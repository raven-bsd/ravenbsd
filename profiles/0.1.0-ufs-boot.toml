#
# K414: bootstrap initfs for the 0.1.0-ufs image. It stages the scheme servers, the
# virtio storage/network driver stack, blockd/fsd-ufs/vfsd and the pivot marker; the
# release userland lives on the UFS root disk built from the 0.1.0-ufs payload.

name = "0.1.0-ufs-boot"
extends = "base"

[initfs]
release = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"

[[initfs.programs]]
package = "raven-logd"
path = "/sbin/logd"

[[initfs.programs]]
package = "raven-sysd"
path = "/sbin/sysd"

[[initfs.programs]]
package = "raven-randd"
path = "/sbin/randd"

[[initfs.programs]]
package = "raven-zerod"
path = "/sbin/zerod"

[[initfs.programs]]
package = "raven-nulld"
path = "/sbin/nulld"

[[initfs.programs]]
package = "raven-consd"
path = "/sbin/consd"

[[initfs.programs]]
package = "raven-initfsd"
path = "/sbin/initfsd"

[[initfs.programs]]
package = "raven-ramfsd"
path = "/sbin/ramfsd"

[[initfs.programs]]
package = "raven-vfsd"
path = "/sbin/vfsd"

[[initfs.programs]]
package = "raven-pcid"
path = "/sbin/pcid"

[[initfs.programs]]
package = "raven-devd"
path = "/sbin/devd"

[[initfs.programs]]
package = "virtio-blk"
path = "/sbin/virtio-blk"

[[initfs.programs]]
package = "virtio-net"
path = "/sbin/virtio-net"

[[initfs.programs]]
package = "raven-blockd"
path = "/sbin/blockd"

[[initfs.programs]]
package = "fsd-ufs"
path = "/sbin/fsd-ufs"

[[initfs.files]]
src = "etc/services.d/logd.toml"
path = "/etc/services.d/logd.toml"

[[initfs.files]]
src = "etc/services.d/sysd.toml"
path = "/etc/services.d/sysd.toml"

[[initfs.files]]
src = "etc/services.d/randd.toml"
path = "/etc/services.d/randd.toml"

[[initfs.files]]
src = "etc/services.d/zerod.toml"
path = "/etc/services.d/zerod.toml"

[[initfs.files]]
src = "etc/services.d/nulld.toml"
path = "/etc/services.d/nulld.toml"

[[initfs.files]]
src = "etc/services.d/consd.toml"
path = "/etc/services.d/consd.toml"

[[initfs.files]]
src = "etc/services.d/initfsd.toml"
path = "/etc/services.d/initfsd.toml"

[[initfs.files]]
src = "etc/services.d/ramfsd.toml"
path = "/etc/services.d/ramfsd.toml"

[[initfs.files]]
src = "etc/services.d/pcid.toml"
path = "/etc/services.d/pcid.toml"

[[initfs.files]]
src = "profiles/qemu-ufs-boot.d/vfsd.manifest"
path = "/etc/services.d/vfsd.toml"

[[initfs.files]]
src = "profiles/ufs-demo.d/devd.manifest"
path = "/etc/services.d/devd.toml"

[[initfs.files]]
src = "profiles/ufs-demo.d/blockd.manifest"
path = "/etc/services.d/blockd.toml"

[[initfs.files]]
src = "etc/services.d/fsd-ufs.toml"
path = "/etc/services.d/fsd-ufs.toml"

[[initfs.files]]
src = "profiles/ufs-demo.d/drivers.conf"
path = "/etc/drivers.toml"

[[initfs.files]]
src = "profiles/qemu-ufs.d/root-mode"
path = "/etc/raven/root-mode"
mode = 0o644

[[initfs.files]]
src = "profiles/qemu-ufs-boot.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/qemu-ufs.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644

[[initfs.files]]
src = "etc/mounts"
path = "/etc/mounts"
