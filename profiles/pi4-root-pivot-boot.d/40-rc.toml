#
# Bootstrap rc policy: resident scheme services are one-shot for the proof. The
# UFS payload's release rc/svcd policy is merged after the pivot and starts getty.

[[initfs.files]]
src = "profiles/qemu-ufs-boot.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/release.d/svcd.conf"
path = "/etc/svcd.conf"
mode = 0o644
