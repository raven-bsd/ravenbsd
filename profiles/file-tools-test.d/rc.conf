#
# The file-tools qtest runs one one-shot client. K11's exit_when_settled mode only skips waiting
# for services whose restart policy is "never", so every long-running service inherited from the
# shell profile is overridden here; they still start and provide their schemes.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
vfsd_restart="never"
consd_restart="never"
