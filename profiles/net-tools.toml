# Network inspection/connectivity tools over the loopback netd. The shell profile does not include
# these tools yet; this profile keeps the image small and packages ifconfig/nc with netd.
name = "net-tools"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-logd", path = "/sbin/logd" },
    { package = "netd", path = "/sbin/netd" },
    { package = "raven-ifconfig", path = "/sbin/ifconfig" },
    { package = "raven-nc", path = "/sbin/nc" },
]

files = [
    { src = "etc/services.d/logd.toml", path = "/etc/services.d/logd.toml" },
    { src = "etc/services.d/netd.toml", path = "/etc/services.d/netd.toml" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
