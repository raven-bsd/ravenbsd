# The audio-restart profile: the shell-test session plus audiod and the one-shot client binary,
# driven from the shell so the server can be restarted between two client runs.

name = "audio-restart-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
