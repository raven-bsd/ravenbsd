# QEMU `intel-hda` is 8086:2668, PCI class 0x0403; BAR0 is the 16 KiB MMIO window. The driver
# needs one 64 KiB DMA buffer (ring + CORB/RIRB/BDL) and the legacy INTx line.
[[driver]]
name = "hda"
vendor = 0x8086
device = 0x2668
exec = "/sbin/hda-driver"
args = ["bar=0", "resources=dma+irq"]
cycles = 1
