#
# K274: the shell-test session files, re-declared for the pfctl profile.
# `extends` is one level and profiles/pfctl.toml extends `shell` directly, so the
# svcd policy and rc.conf that make the console root shell a one-shot session
# (see profiles/shell-test.d/) are staged here from the same shared sources.

[[initfs.files]]
src = "etc/svcd.conf"
path = "/etc/svcd.conf"

[[initfs.files]]
src = "profiles/shell-test.d/rc.conf"
path = "/etc/rc.conf"
