# Pi 4 hardware staging profile for the 7.5-inch E-Ink panel. It extends the Pi boot profile and
# stages the einkd executable/manifest; the manifest stays `enable = false` so no panel access
# happens before E4. The full release/network stack is the `pi4-release` profile; this staging
# profile is the hardware hand-off point, not the x86 dry-run qtest image.
name = "pi4-eink"
extends = "pi4"

[boot]
cmdline = "console=ttyAMA0 loglevel=info"
log_level = "info"
