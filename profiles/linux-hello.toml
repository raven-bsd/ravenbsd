# B20 test profile: the production layout puts linuxd in /sbin (documented by the man page), while
# the qtest packs the same binary as /init through its own initfs image.

name = "linux-hello"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "linuxd", path = "/sbin/linuxd" },
]

[boot]
cmdline = "console=ttyS0 test-exit=1"
log_level = "info"
