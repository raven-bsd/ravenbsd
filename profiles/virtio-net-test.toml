# The B13b virtio-net qtest profile: init, the console service manager, pcid, devd in test mode
# and the virtio-net driver. QEMU provides one `virtio-net-pci` function with user-mode networking.

name = "virtio-net-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
    { package = "virtio-net", path = "/sbin/virtio-net" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
