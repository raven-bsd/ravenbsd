# The B13c driver-resource qtest profile. Standalone like `b13a-driver-test`: init, the console
# service manager, pcid, devd in test mode and the fixture driver (`build.sh` under `tests/`).
# QEMU adds `-device edu`.

name = "b13c-resources-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
