# Release session composition: login on the console, the release rc/svcd
# policies, and the account files.

[[initfs.programs]]
package = "raven-getty"
path = "/bin/getty"

[[initfs.programs]]
package = "login"
path = "/bin/login"

[[initfs.files]]
src = "profiles/ufs-demo.d/getty.manifest"
path = "/etc/services.d/getty.toml"

[[initfs.files]]
src = "etc/passwd"
path = "/etc/passwd"
mode = 0o644

[[initfs.files]]
src = "etc/group"
path = "/etc/group"
mode = 0o644

[[initfs.files]]
src = "etc/shadow"
path = "/etc/shadow"
mode = 0o600

[[initfs.files]]
src = "etc/profile"
path = "/etc/profile"
mode = 0o644

[[initfs.files]]
src = "etc/motd"
path = "/etc/motd"
mode = 0o644

[[initfs.files]]
src = "profiles/ufs-demo.d/rc.conf"
path = "/etc/rc.conf"

[[initfs.files]]
src = "profiles/ufs-demo.d/svcd.conf"
path = "/etc/svcd.conf"
