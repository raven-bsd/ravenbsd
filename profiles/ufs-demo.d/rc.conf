#
# UFS demo session: getty ends the boot, rsh stays disabled, and every resident
# service is one-shot so the qtest can observe init exiting.

rsh_enable = "NO"
vfsd_enable = "NO"
netd_enable = "NO"
resolvd_enable = "NO"

logd_restart = "never"
sysd_restart = "never"
randd_restart = "never"
zerod_restart = "never"
nulld_restart = "never"
ramfsd_restart = "never"
initfsd_restart = "never"
consd_restart = "never"
vfsd_restart = "never"
pcid_restart = "never"
devd_restart = "never"
blockd_restart = "never"
fsd_ufs_restart = "never"
netd_restart = "never"
resolvd_restart = "never"
getty_restart = "never"
