# QEMU virtio functions used by the UFS demo:
#   virtio-blk-pci,drive=ufs,disable-legacy=on  -> 1af4:1042, BAR4
#   virtio-net-pci,netdev=n0,disable-legacy=on  -> 1af4:1041, BAR4
# devd launches every matched function in one boot: blockd consumes disk: and netd (when the
# pivot profile enables it) consumes nic:. The network services stay disabled in this demo's
# rc.conf; the multi-driver qtest starts netd explicitly to prove both drivers coexist.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1

[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1
