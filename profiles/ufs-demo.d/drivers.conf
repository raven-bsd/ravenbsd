# QEMU virtio functions used by the UFS demo:
#   virtio-blk-pci,drive=ufs,disable-legacy=on  -> 1af4:1042, BAR4
# The release network driver is staged in the profile but not launched in the
# demo: devd currently matches one PCI function per boot, and the UFS disk is
# the demo's hardware dependency. release-login remains the network gate.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
