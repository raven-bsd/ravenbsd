# The ramfsd integration profile. It inherits the shell profile (including the core servers and
# ramfsd) and adds the one-shot probe.

name = "ramfsd-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
