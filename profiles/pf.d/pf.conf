# K273 pf qtest ruleset. The allowed UDP flow (47001) is stateful; the blocked flow
# (47002) is a quick log rule, so the hook prints the drop on the serial console.
set default pass

block quick out on eth0 proto udp from any to any port 47002 log
pass out on eth0 proto udp from any to any port 47001 keep state
pass out on eth0 proto udp from any to any port 47004 keep state

# K296 NAT acceptance flow: the outbound 47004 flow is source-NATed to the guest address
# with a proxy port. The host NAT echo replies with the source port it observed, so the
# probe can prove the translation and the state reverse-translation.
nat on eth0 proto udp from any to 10.0.2.2 port 47004 -> 10.0.2.15
