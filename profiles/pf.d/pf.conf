# K273 pf qtest ruleset. The allowed UDP flow (47001) is stateful; the blocked flow
# (47002) is a quick log rule, so the hook prints the drop on the serial console.
set default pass

block quick out on eth0 proto udp from any to any port 47002 log
pass out on eth0 proto udp from any to any port 47001 keep state
