# Pi 4 release platform driver table. This is the P8 table plus the P12 platd
# entry; the P8b multi-window launcher is required before devd can create and
# transfer the four platd handles. The handle numbers are illustrative until
# P8b defines the transfer order.
[[driver]]
name = "genet"
compatible = "brcm,bcm2711-genet-v5"
exec = "/sbin/genet"
args = ["bar=0", "resources=dma+irq", "serve", "slots=platform"]

[[driver]]
name = "emmc2"
compatible = "brcm,bcm2711-emmc2"
exec = "/sbin/emmc2"

[[driver]]
name = "pwm1"
compatible = "brcm,bcm2835-pwm"
exec = "/sbin/pwm"

[[driver]]
name = "rng200"
compatible = "brcm,bcm2711-rng200"
exec = "/sbin/rng200"

[[driver]]
name = "platd"
compatible = "raven,pi4-platform"
exec = "/sbin/platd"
args = ["bar=0", "bar=1", "bar=2", "resources=dma", "dma_size=256", "mailbox=3:64", "gpio=4:180", "rng=5:40", "dma=6:256"]
