# Pi 4 storage declarations; the same files the `pi4` profile installs. They
# stay disabled until the EMMC2 launcher and the J5 root mount are wired.
[[initfs.files]]
src = "profiles/pi4.d/emmc2.manifest"
path = "/etc/services.d/emmc2.toml"

[[initfs.files]]
src = "profiles/pi4.d/blockd.manifest"
path = "/etc/services.d/blockd.toml"
