# Release service and tool set: the shell services, network stack and platform
# service, plus the REL1c getty/login accounts. Paths already supplied by `base`
# (`/init`, `/bin/uname`, `/bin/echo`, the `/etc/raven` files) are not repeated.
[[initfs.programs]]
package = "raven-svcctl"
path = "/bin/svcctl"

[[initfs.programs]]
package = "raven-logd"
path = "/sbin/logd"

[[initfs.programs]]
