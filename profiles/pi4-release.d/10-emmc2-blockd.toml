# Stage the EMMC2/blockd declarations for the J5 root path. They stay disabled
# until the platform launcher passes the MMIO/DMA/IRQ grants and the root mount
# is wired.
[[initfs.files]]
src = "profiles/pi4.d/emmc2.manifest"
path = "/etc/services.d/emmc2.toml"

[[initfs.files]]
src = "profiles/pi4.d/blockd.manifest"
path = "/etc/services.d/blockd.toml"
