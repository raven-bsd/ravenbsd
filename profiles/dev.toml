# Development profile. CONTRACTS C1's base profile already contains `echo`, so this
# profile has the same program set; it exists as a stable name for developers.

name = "dev"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-uname", path = "/bin/uname" },
    { package = "raven-echo", path = "/bin/echo" },
]

[boot]
cmdline = "console=ttyS0 test-exit=1"
log_level = "info"
