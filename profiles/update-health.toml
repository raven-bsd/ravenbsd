# K27a init-marker profile: the normal shell service set plus the virtio-blk driver, blockd on
# `disk:0` and a scratch GPT disk. `init` writes the health marker after all services are up.

name = "update-health"

extends = "base"

[initfs]
programs = [
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
    { package = "virtio-blk", path = "/sbin/virtio-blk" },
    { package = "raven-blockd", path = "/sbin/blockd" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
