# Resolver test profile: two phases in one boot.
#
# Phase 1 uses a static `nameserver 127.0.0.1` override and the loopback DNS
# fixture, proving A/AAAA/CNAME/NXDOMAIN through `resolv:`.
#
# Phase 2 clears the override and restarts resolvd.  virtio-net gets a real
# QEMU user-mode DHCP lease (10.0.2.15/24, DNS 10.0.2.3); resolvd writes the
# lease DNS to `/etc/resolv.conf` and queries it through netd.

name = "resolv-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-logd", path = "/sbin/logd" },
    { package = "raven-initfsd", path = "/sbin/initfsd" },
    { package = "raven-ramfsd", path = "/sbin/ramfsd" },
    { package = "raven-vfsd", path = "/sbin/vfsd" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
    { package = "virtio-net", path = "/sbin/virtio-net" },
    { package = "netd", path = "/sbin/netd" },
    { package = "resolvd", path = "/sbin/resolvd" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
