#
# One-shot blockd profile: every resident service the shell profile starts is
# pinned to "never" so svcd can exit after the probe; blockd itself is resident
# but has no work after the probe.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
blockd_restart="never"
