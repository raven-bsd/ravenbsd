# QEMU `virtio-net-pci,disable-legacy=on`: vendor 0x1af4, device 0x1041. The modern function
# keeps its registers in BAR4 (64-bit, 16 KiB); `resources=dma+irq` asks devd for the 64 KiB queue
# memory and the function's legacy IRQ.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq"]
cycles = 2
