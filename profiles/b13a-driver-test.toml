# The B13a driver qtest profile. Standalone, like `devd-test`: init, the console service manager,
# pcid, devd in test mode and the fixture driver. QEMU adds `-device edu`.

name = "b13a-driver-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
