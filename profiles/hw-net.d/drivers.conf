# QEMU `virtio-net-pci,disable-legacy=on`: vendor 0x1af4, device 0x1041. B12b turns this
# one-shot driver into the persistent frame service netd attaches to.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
