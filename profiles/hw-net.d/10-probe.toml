# The probe binary is built by tests/fixtures/b70-net/build.sh before the
# profile is packed, so it is a generated initfs file rather than a workspace
# package in the production profile.
[[initfs.files]]
src = "build/fixtures/b70-net/probe"
path = "/sbin/b70-net-probe"
mode = 0o755
generated = true

[[initfs.files]]
src = "profiles/hw-net.d/probe.manifest"
path = "/etc/services.d/b70-net-probe.toml"
