# The initfsd integration profile. It inherits the shell profile and adds the one-shot probe and
# the /etc/probe fixture it reads.

name = "initfsd-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
