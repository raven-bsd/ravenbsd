# QEMU `virtio-blk-pci,drive=d0,disable-legacy=on`: the root disk is the fixture's GPT disk.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
