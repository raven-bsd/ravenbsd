#
# The audio-null qtest runs one one-shot client. `exit_when_settled` only skips waiting for
# services whose restart policy is "never", so every inherited long-running service is pinned.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
vfsd_restart="never"
consd_restart="never"
audiod_restart="never"
