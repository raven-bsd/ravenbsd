#
# OpenSSH server. The one-shot ssh-hostkeys service creates /tmp/ssh/ssh_host_*; sshd runs as
# the real upstream binary.

name = "sshd"
exec = "/sbin/sshd"
args = ["/sbin/sshd", "-D", "-ddd", "-E", "tty:console", "-f", "/etc/ssh/sshd_config"]
needs = ["netd", "vfsd", "consd", "ptyd", "ssh-hostkeys"]
readiness = "none"
restart = "on-failure"
max_restarts = 3
required = false
