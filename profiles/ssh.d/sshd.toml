#
# OpenSSH server. svcd cannot execute a shebang script, so the first-party shell runs a bounded
# command: create /tmp/ssh, generate the per-type host keys, then exec the upstream sshd.

name = "sshd"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "mkdir -p /tmp/ssh /var/empty; rm -f /tmp/ssh/ssh_host_*; for t in rsa ecdsa ed25519; do ssh-keygen -q -t $t -N '' -f /tmp/ssh/ssh_host_${t}_key; done; /sbin/sshd -D -e -E /tmp/sshd.log -f /etc/ssh/sshd_config"]
needs = ["netd", "vfsd", "consd", "ptyd"]
readiness = "none"
restart = "on-failure"
max_restarts = 3
