#
# OpenSSH server. The one-shot keygen services above create /tmp/ssh/ssh_host_*; sshd runs as
# the real upstream binary, not through a shell wrapper.

name = "sshd"
exec = "/sbin/sshd"
args = ["/sbin/sshd", "-D", "-e", "-f", "/etc/ssh/sshd_config"]
needs = ["netd", "vfsd", "consd", "ptyd", "ssh-keygen-rsa", "ssh-keygen-ecdsa", "ssh-keygen-ed25519"]
readiness = "none"
restart = "on-failure"
max_restarts = 3
