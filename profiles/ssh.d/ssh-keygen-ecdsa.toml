name = "ssh-keygen-ecdsa"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "mkdir -p /tmp/ssh; rm -f /tmp/ssh/ssh_host_ecdsa_key; ssh-keygen -q -t ecdsa -N '' -f /tmp/ssh/ssh_host_ecdsa_key"]
needs = ["vfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
