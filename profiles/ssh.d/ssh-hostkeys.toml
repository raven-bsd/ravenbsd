#
# One-shot host-key generation. The initfs release uses /tmp/ssh; the keys are ephemeral. A UFS
# root (K193) can stage the same command against /etc/ssh for persistence.

name = "ssh-hostkeys"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "mkdir -p /tmp/ssh /var/empty; rm -f /tmp/ssh/ssh_host_rsa_key /tmp/ssh/ssh_host_ecdsa_key /tmp/ssh/ssh_host_ed25519_key; ssh-keygen -q -t rsa -N '' -f /tmp/ssh/ssh_host_rsa_key; ssh-keygen -q -t ecdsa -N '' -f /tmp/ssh/ssh_host_ecdsa_key; ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh/ssh_host_ed25519_key"]
needs = ["vfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
