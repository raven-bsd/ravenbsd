#
# One-shot host-key generation. The initfs release uses /tmp/ssh; the key is ephemeral. A UFS
# root (K193) can stage the same command against /etc/ssh for persistence. Ed25519 is the demo
# key; the host client negotiates it directly.

name = "ssh-hostkeys"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "mkdir -p /tmp/ssh /var/empty; rm -f /tmp/ssh/ssh_host_ed25519_key; ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh/ssh_host_ed25519_key"]
needs = ["vfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
