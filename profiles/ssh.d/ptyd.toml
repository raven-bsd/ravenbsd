# K196 pty scheme used by sshd for interactive sessions.

name = "ptyd"
exec = "/sbin/ptyd"
needs = ["logd"]
provides = ["scheme:pty"]
readiness = "scheme"
ready_timeout_ms = 30_000
restart = "never"
max_restarts = 0
