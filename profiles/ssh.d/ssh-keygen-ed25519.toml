name = "ssh-keygen-ed25519"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "mkdir -p /tmp/ssh; rm -f /tmp/ssh/ssh_host_ed25519_key; ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh/ssh_host_ed25519_key"]
needs = ["vfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
