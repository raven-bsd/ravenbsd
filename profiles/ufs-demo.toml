# S99 UFS demo: the release login/network composition plus the virtio-blk,
# blockd, fsd-ufs and read-write UFS mount stack. The disk is an external
# virtio-blk drive created by tools/ufs-mkfs; the normal release profile is not
# changed and still boots without a disk.

name = "ufs-demo"
extends = "shell"

[initfs]
release = true
dynamic = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
