# The target `raven` admin binary. `build.sh` stages it under `build/fixtures/modern-admin/`; the
# profile installs that artifact at `/usr/sbin/raven` (the K74 host/stub binary is never installed).

[[initfs.files]]
src = "build/fixtures/modern-admin/raven"
path = "/usr/sbin/raven"
mode = 0o755
generated = true

# The shell-test one-shot pair, repeated here because a profile can extend only one level:
# `exit_when_exits = rsh` in `/etc/svcd.conf` and the `*_restart="never"` pins in `rc.conf`.

[[initfs.files]]
src = "etc/svcd.conf"
path = "/etc/svcd.conf"

[[initfs.files]]
src = "tests/fixtures/modern-admin/rc.conf"
path = "/etc/rc.conf"
