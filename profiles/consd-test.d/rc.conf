# K11's exit_when_settled test mode only skips waiting for services whose restart policy is
# "never". Every resident service the shell profile starts is overridden here so svcd can exit
# after the one-shot probe finishes; production manifests keep on-failure. consd holds the
# console, so it must not keep the case open after the probe is done.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
