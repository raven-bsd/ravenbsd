# S98: the scratch-disk function comes first because devd launches one matching driver per
# instance. A release boot with only virtio-net falls through to the entry below; a boot with
# the scratch disk matches virtio-blk and blockd gets `disk:0`. QEMU attaches
# `virtio-blk-pci,drive=scratch,disable-legacy=on` (vendor 0x1af4/device 0x1042).
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1

# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device
# 0x1041. `serve` keeps the frame service alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1
