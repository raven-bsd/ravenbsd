# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device
# 0x1041. `serve` keeps the frame service alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1

# S98: QEMU `virtio-blk-pci,drive=scratch,disable-legacy=on` (vendor 0x1af4/device 0x1042).
# devd launches it only when the qtest attaches the scratch disk; a release boot without the
# disk is unchanged. The driver serves `disk:` for blockd.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
