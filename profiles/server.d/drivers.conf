# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device
# 0x1041. `serve` keeps the frame service alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1

# S110: QEMU `virtio-blk-pci,drive=scratch,disable-legacy=on` (vendor 0x1af4/device 0x1042).
# devd launches the first matching PCI function, so a boot with the scratch disk gets `disk:0`
# for blockd and a boot without it falls through to virtio-net. This is the same table 20-net
# stages at `/etc/drivers.toml`; 75-disk-tools does not stage a duplicate.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1
