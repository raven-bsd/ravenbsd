# K274: the pfctl qtest image. The shell test session (serial console root shell
# with one-shot services) plus raven-pfctl at /sbin/pfctl. Profile fragments are
# keyed by the profile name, so this base file pairs with profiles/pfctl.d/.
name = "pfctl"
extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
