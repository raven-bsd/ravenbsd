# The devd/pcid qtest profile. It is deliberately standalone: init, the console service manager,
# pcid, devd and a one-shot `svcctl list` client. The QEMU machine adds `-device edu`.
name = "devd-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
