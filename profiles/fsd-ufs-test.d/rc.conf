#
# One-shot fsd-ufs profile: every resident service is pinned to "never" so
# svcd can exit after the probe; blockd and fsd-ufs are resident but idle after
# the probe.

logd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
vfsd_restart="never"
blockd_restart="never"
fsd_ufs_restart="never"
