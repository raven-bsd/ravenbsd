#
# K25a: the uutils coreutils slice built for the Raven std target. The staging tree
# is produced by `cargo xtask build uutils --arch <arch>`; `{arch}` resolves to the
# image target (K153), so the aarch64 release never stages x86_64 binaries. This
# first image carries the base-tools subset (the rest stay staged until the initfs
# budget follow-up).

[[initfs.files]]
src = "build/{arch}/uutils/ls"
path = "/bin/ls"
mode = 0o755
generated = true

