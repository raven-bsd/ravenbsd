# QEMU `-device edu`: vendor 0x1234, device 0x11e8, BAR0 is a 1 MiB memory BAR.
# `bar = 0` is the default; it is spelled out so the selector is visible.
[[driver]]
name = "b13a"
vendor = 0x1234
device = 0x11e8
exec = "/sbin/b13a-driver"
args = ["bar=0"]
cycles = 1
