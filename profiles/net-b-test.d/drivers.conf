# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device 0x1041. The `test`
# token makes `nic:quit` available; the production table has no token.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "test"]
cycles = 2
