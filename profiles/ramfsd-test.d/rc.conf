#
# K11's exit_when_settled test mode only skips waiting for services whose restart policy is
# "never". The long-running shell services keep their production on-failure manifests; this
# test profile overrides them so svcd can exit after the one-shot probe finishes.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
