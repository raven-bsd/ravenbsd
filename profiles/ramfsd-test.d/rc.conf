# K11's exit_when_settled test mode only skips waiting for services whose restart policy is
# "never". The long-running shell services keep their production on-failure manifests; this
# test profile overrides every service the shell profile starts, so svcd can exit after the
# one-shot probe finishes. initfsd was added to the shell profile by K62; without this override
# the inherited on-failure service keeps this case from reaching "init exited".

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
