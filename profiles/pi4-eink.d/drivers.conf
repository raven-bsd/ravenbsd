# Pi 4 release platform driver table. This is the P8 table plus the P12 platd
# entry; the P8b multi-window launcher is required before devd can create and
# transfer the four platd handles. The handle numbers are illustrative until
# P8b defines the transfer order.
[[driver]]
name = "genet"
compatible = "brcm,bcm2711-genet-v5"
exec = "/sbin/genet"
args = ["bar=0", "resources=dma+irq", "serve", "slots=platform"]

[[driver]]
name = "emmc2"
compatible = "brcm,bcm2711-emmc2"
exec = "/sbin/emmc2"

[[driver]]
name = "pwm1"
compatible = "brcm,bcm2835-pwm"
exec = "/sbin/pwm"

[[driver]]
name = "rng200"
compatible = "brcm,bcm2711-rng200"
exec = "/sbin/rng200"

[[driver]]
name = "platd"
compatible = "raven,pi4-platform"
exec = "/sbin/platd"
args = ["bar=0", "bar=1", "bar=2", "resources=dma", "dma_size=256", "mailbox=3:64", "gpio=4:180", "rng=5:40", "dma=6:256"]

# Pi 4 VL805 USB 3 host function on the BCM2711 PCIe bridge. `usb-xhci` runs `devd test` as a
# bounded boot-time probe: it matches this PCI ID, hands the BAR/config/DMA/IRQ handles to
# `pi4-xhci`, and the driver pushes decoded boot-keyboard bytes to the `kbd:` queue. The board
# BAR/IRQ routing and continuous typing remain UI1 evidence; no hardware result is claimed here.
[[driver]]
name = "pi4-xhci"
vendor = 0x1106
device = 0x3483
exec = "/sbin/pi4-xhci"
args = ["bar=0", "resources=dma+irq"]
cycles = 1

# SPI0 owner for the E-Ink panel. devd grants the SPI0 reg window and launches spi0d; spi0d
# registers the `spi:` scheme and einkd writes commands/data to it. The panel DC/RST/BUSY lines
# stay in einkd through platd, so this driver never waits on BUSY.
[[driver]]
name = "spi0d"
compatible = "brcm,bcm2835-spi"
exec = "/sbin/spi0d"
args = []
