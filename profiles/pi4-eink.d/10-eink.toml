# E1e hardware staging: the binary is built by the separate ravenbsd-rpi BSP repo and staged
# from its build output; the manifest is disabled until the SPI/GPIO adapter and the panel are
# wired (E4). No panel access at boot.
[[initfs.files]]
src = "../ravenbsd-rpi/build/aarch64/einkd"
path = "/sbin/einkd"
mode = 0o755
generated = true

[[initfs.files]]
src = "userland/init/services/einkd.toml"
path = "/etc/services.d/einkd.toml"
