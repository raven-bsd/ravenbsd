# K198 staging profile: the release image plus an explicit static network drop-in.
# The final release/UFS fragment is a one-line profile inclusion after K191/K193 merge;
# this profile keeps the test off their active paths.
name = "network-config-test"
extends = "shell"

[initfs]
release = true
dynamic = true

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
