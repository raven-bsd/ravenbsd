# The net-b profile: init/svcd, pcid, devd in test mode, the virtio-net frame service and the
# two-cycle ring probe. The driver serves `nic:`; the probe maps the B39 ring and exchanges an ARP
# frame, then the driver quits for the next devd cycle.

name = "net-b-test"

[initfs]
programs = [
    { package = "raven-init", path = "/init" },
    { package = "raven-svcctl", path = "/bin/svcctl" },
    { package = "raven-pcid", path = "/sbin/pcid" },
    { package = "raven-devd", path = "/sbin/devd" },
    { package = "virtio-net", path = "/sbin/virtio-net" },
]

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
