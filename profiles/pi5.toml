# The Raspberry Pi 5 image profile. It inherits the base initfs and selects the proposed Pi UART
# command line. R8's manifest/evidence kit targets the FAT `kernel_2712.img` layout; the board
# UART name and the firmware kernel selection remain UNVERIFIED until a Pi 5 log exists.
name = "pi5"
extends = "base"

[boot]
cmdline = "console=ttyAMA0 loglevel=info"
log_level = "info"
