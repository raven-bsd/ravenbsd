# The shell-session profile: the shell profile plus the `/etc/svcd.conf` that ends svcd when the
# shell exits. The qtest case drives the dialogue over the serial console.

name = "shell-test"

extends = "shell"

[boot]
cmdline = "console=ttyS0 loglevel=info"
log_level = "info"
