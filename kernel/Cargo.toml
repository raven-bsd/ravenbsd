[package]
name = "raven-kernel"
version = "0.1.0"
description = "RavenBSD microkernel."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "raven-kernel"
path = "src/main.rs"

[features]
# L5 lockstat probes: per-object turnstile counters compiled into the kernel. On by default so
# every kernel build and qtest carries the diagnostic surface; `--no-default-features` drops the
# counters and the `sync::lockstat()` / `selftest=lockstat` entries. The included pure model reads
# this same cfg, so no second feature flag is needed.
default = ["lockstat"]
lockstat = []

[dependencies]
raven-abi = { path = "../crates/raven-abi" }
raven-bootinfo = { path = "../crates/raven-bootinfo" }
raven-elf = { path = "../crates/raven-elf" }
raven-esr = { path = "../crates/raven-esr" }
raven-handles = { path = "../crates/raven-handles" }
raven-initfs = { path = "../crates/raven-initfs" }
raven-ipiq = { path = "../crates/raven-ipiq" }
raven-kmem = { path = "../crates/raven-kmem" }
raven-pager = { path = "../crates/raven-pager" }
raven-pci = { path = "../crates/raven-pci" }
raven-proto-linux = { path = "../crates/raven-proto-linux" }
raven-rmm = { path = "../crates/raven-rmm" }
raven-sched-core = { path = "../crates/raven-sched-core" }
raven-usercopy = { path = "../crates/raven-usercopy" }
raven-vma = { path = "../crates/raven-vma" }
raven-vmem = { path = "../crates/raven-vmem" }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }

# `raven-mem` exports the C `memcpy` family for x86-64. On aarch64 the same export makes the
# debug build recurse (core's `write_unaligned` calls `memcpy`, which is `raven_mem::memcpy`),
# so aarch64 uses the compiler-builtins routines instead.
[target.'cfg(target_arch = "aarch64")'.dependencies]
raven-mem = { path = "../crates/raven-mem" }

# Everything below is used by the x86-64 modules only (ACPI and the TSC scale).
[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = { version = "5.2.0", default-features = false }
raven-iommu = { path = "../crates/raven-iommu" }
raven-mem = { path = "../crates/raven-mem", features = ["export-symbols"] }
raven-timemath = { path = "../crates/raven-timemath" }

[build-dependencies]
raven-abi = { path = "../crates/raven-abi" }

# A crate cannot combine `workspace = true` with extra lints: copy the workspace tables and add
# the two kernel-specific ones.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
