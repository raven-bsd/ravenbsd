[package]
name = "raven-kernel"
version = "0.1.0"
description = "RavenBSD microkernel."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "raven-kernel"
path = "src/main.rs"

[dependencies]
acpi = { version = "5.2.0", default-features = false }
linked_list_allocator = { version = "0.10", default-features = false }
raven-abi = { path = "../crates/raven-abi" }
raven-bootinfo = { path = "../crates/raven-bootinfo" }
raven-elf = { path = "../crates/raven-elf" }
raven-handles = { path = "../crates/raven-handles" }
raven-initfs = { path = "../crates/raven-initfs" }
raven-mem = { path = "../crates/raven-mem", features = ["export-symbols"] }
raven-rmm = { path = "../crates/raven-rmm" }
raven-sched-core = { path = "../crates/raven-sched-core" }
raven-timemath = { path = "../crates/raven-timemath" }
raven-usercopy = { path = "../crates/raven-usercopy" }
raven-vma = { path = "../crates/raven-vma" }
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }

[build-dependencies]
raven-abi = { path = "../crates/raven-abi" }

# A crate cannot combine `workspace = true` with extra lints: copy the workspace tables and add
# the two kernel-specific ones.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
