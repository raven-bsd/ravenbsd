# cargo-audit exceptions. SC2 renamed the first-party utilities to
# `raven-tar`/`raven-time`, so the old `tar`/`time` 0.1.0 name collision is gone and there is
# no exception to suppress here. A future exception needs an owner, reachability evidence and
# an expiry in `docs/forks.md`; no blanket ignore.

[advisories]
ignore = []
