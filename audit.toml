# Reviewed advisory exceptions (DR-64). The list is empty as of SC2: the first-party utilities
# `userland/bin/tar` and `userland/bin/time` are now the packages `raven-tar`/`raven-time`
# (`publish = false`), so the advisory database no longer matches them by package name, and the
# five former false positives (RUSTSEC-2018-0002, -2021-0080, -2026-0067, -2026-0068,
# -2020-0071) were removed. No upstream `tar-rs` or `time` crate source is linked or shipped.
#
# Keep this file as the reviewed-exception mechanism: every future entry needs an advisory ID,
# an owner, a reason/reachability note and an expiry date. No blanket ignore.
# Weekly audit: `sh scripts/deps-audit.sh`; decision queue and metrics:
# `docs/dependency-dashboard.md` and `metrics/deps.json`.

[advisories]
ignore = []
