#
# The C names of ticket C67 6.9 for the Solaris personality. `rust` is the logic entry;
# `header` is the installed declaration; `errno` chooses the POSIX error convention.
# `raven-libc-thread` is merged: every export has a real body. The remaining kernel gaps
# (PG-2 thread create, PG-4 shared futex, PG-7 kick) are returned by the C57 seams, never
# hidden by a fake success.

