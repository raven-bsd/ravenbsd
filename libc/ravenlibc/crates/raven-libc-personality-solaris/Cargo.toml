[package]
name = "raven-libc-personality-solaris"
version = "0.1.0"
description = "ravenlibc Solaris/illumos personality: event ports, getexecname/getisax and the Solaris-named thread wrappers."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
std = []

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi", default-features = false }
raven-libc-sys = { path = "../raven-libc-sys", default-features = false }
raven-libc-platform = { path = "../raven-libc-platform", default-features = false }
