[package]
name = "raven-libc-stdio"
version = "0.1.0"
description = "ravenlibc FILE layer: buffers, locks, open-file list, memory and cookie streams, wide stdio, glue to the fmt engines"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
raven-libc-ctype = { path = "../raven-libc-ctype" }
raven-libc-fmt = { path = "../raven-libc-fmt" }
