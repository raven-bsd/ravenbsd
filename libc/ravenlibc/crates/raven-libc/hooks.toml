#
# The weak-hook table of this ticket (normative names: donor-map/16 3.A.4.3). C54's shipped
# mechanism is the function-pointer cell (spike S-1), so the strong symbol is `__rl_<hook>_impl`
# in the file named below; the weak cell lives in the caller file.

[[hook]]
name = "__rl_funcs_on_exit"
dummy = "nothing"
strong_symbol = "__rl_funcs_on_exit_impl"
strong_file = "src/hooks/funcs_on_exit.rs"
pulled_by = ["atexit", "__cxa_atexit", "on_exit", "exit"]
weak_side = "src/stdlib/exit.rs"

[[hook]]
name = "__rl_stdio_exit"
dummy = "nothing"
strong_symbol = "__rl_stdio_exit_impl"
strong_file = "src/hooks/stdio_exit.rs"
pulled_by = ["exit"]
weak_side = "src/stdlib/exit.rs"

[[hook]]
name = "__rl_fmt_float"
dummy = "prints *float*"
strong_symbol = "__rl_fmt_float_impl"
strong_file = "src/hooks/fmt_float.rs"
pulled_by = ["-u __rl_fmt_float_impl", "strfromd", "strfromf", "strfroml", "fcvt", "ecvt", "gcvt"]
weak_side = "src/stdio/vprintf.rs"

[[hook]]
