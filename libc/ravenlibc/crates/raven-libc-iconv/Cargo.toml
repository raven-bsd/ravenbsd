[package]
name = "raven-libc-iconv"
version = "0.1.0"
description = "ravenlibc iconv converters (UTF, ASCII, legacy 8-bit, optional CJK)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
cjk = ["dep:raven-libc-iconv-cjk"]

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
raven-libc-ctype = { path = "../raven-libc-ctype" }
raven-libc-iconv-cjk = { path = "../raven-libc-iconv-cjk", optional = true }
