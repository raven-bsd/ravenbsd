[package]
name = "raven-libc-dtoa"
version = "0.1.0"
description = "ravenlibc float/decimal conversion: correctly rounded strtod family and dtoa digit generators (gdtoa port)"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
alloc = []            # arena spill to alloc::vec::Vec for pathological inputs (RD-30); without it DtoaError::NoMemory

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
