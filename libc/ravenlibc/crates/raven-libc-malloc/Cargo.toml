[package]
name = "raven-libc-malloc"
version = "0.1.0"
description = "ravenlibc allocator core: hardened OpenBSD-derived and tiny picolibc-derived backends"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["hardened", "tiny"]
hardened = []
tiny = []
debug = []
hardened-malloc = ["hardened"]
tiny-malloc = ["tiny"]
debug-malloc = ["debug"]
std = []

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }

[dev-dependencies]
