[package]
name = "raven-libc-personality-linux"
version = "0.1.0"
description = "ravenlibc Linux personality: epoll, eventfd, timerfd, signalfd, inotify, prctl, error, sysinfo, sendfile and the *64 aliases."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
std = []

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi", default-features = false }
raven-libc-sys = { path = "../raven-libc-sys", default-features = false }
raven-libc-platform = { path = "../raven-libc-platform", default-features = false }
