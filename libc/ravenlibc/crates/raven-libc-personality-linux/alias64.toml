#
# The `*64` alias seed of ticket C66 5.F. `status`:
#   active   - the shell emits one `.set` alias, both names resolve to the same address
#   existing - the 64-bit spelling is already a separate C60 export (no C66 alias)
#   pending  - the base symbol does not exist on this branch; no export

[[alias]]
alias = "stat64"
base = "stat"
status = "active"
header = "sys/stat.h"

[[alias]]
alias = "fstat64"
base = "fstat"
status = "active"
header = "sys/stat.h"

