[package]
name = "raven-libc-m"
version = "0.1.0"
description = "ravenlibc libm: double/float/long double math, complex, fenv, classification, soft-float profile."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
soft-float = []        # backend selector: software fenv state, no arch/ hardware wrappers

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
