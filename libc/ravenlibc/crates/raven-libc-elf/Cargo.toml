[package]
name = "raven-libc-elf"
version = "0.1.0"
description = "ravenlibc ELF64 object view, symbol lookup, versioning and relocation decision tables (pure logic for ld-elf.so.1)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
std = []          # tests and host tools only; never in a shipped build

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
