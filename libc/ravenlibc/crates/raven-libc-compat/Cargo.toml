[package]
name = "raven-libc-compat"
version = "0.1.0"
description = "ravenlibc BSD/GNU extras: vis, stringlist, humanize_number, crypt, uuid, getcap, setmode, pty glue."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
std = []

[dependencies]
raven-libc-abi = { path = "../raven-libc-abi" }
raven-libc-ctype = { path = "../raven-libc-ctype" }
raven-libc-str = { path = "../raven-libc-str" }
raven-libc-stdlib = { path = "../raven-libc-stdlib" }
