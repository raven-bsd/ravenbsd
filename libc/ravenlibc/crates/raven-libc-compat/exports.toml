#
# The C65 export table (ticket section 6.9). One [[export]] per C symbol; `rust` names the
# crate path that the shell file of the same name calls. The shell lives in
# `crates/raven-libc/src/compat/<name>.rs`. `Symbol.map` does not exist in this base (C60 owns
# it), so the version node is recorded here and the map is DEFERRED (see the C65 report).

