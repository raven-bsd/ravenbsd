#
# The stub-library table of ticket C66 5.D / `17-crate-layout.md` 7.3.
#
# For every `name` the generator writes exactly two files in the output directory:
#   libNAME.a  = the 8 bytes `!<arch>\n` (a valid archive with no members)
#   libNAME.so = the text `INPUT(libc.so.1)\n` (a linker script)
# Nothing else: no `libNAME.so.N`, no `.pc` file, no symbol. `libmd`, `libuuid` and
# `libc_heap_tiny` are not stubs and must not appear in the output.
#
# `alias_soname` is informational: the loader's built-in alias table resolves it to the loaded
# `libc.so.1`; the generator does not create a file for it.

[[stub]]
name = "bsd"
ring = 2
content = "the native libbsd names (strlcpy, strlcat, vis, ...); <bsd/*.h> are forwarders"
alias_soname = "libbsd.so.0"
note = "libbsd overlay; no separate library"

