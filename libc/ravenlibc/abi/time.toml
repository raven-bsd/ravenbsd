#
# RavenBSD: native clock IDs and timer selectors transcribed from
# freebsd:sys/sys/_clock_id.h, freebsd:include/time.h and freebsd:sys/sys/time.h @
# 133344405f532bd54ff3629a77d4c4e062f01fdb (BSD-3-Clause, tier A, DR-69). Linux-only clock
# IDs stay as explicit extensions above CLOCK_TAI.

schema = 1
group = "time"
c_header = "bits/abi_time.h"
guard = "_RAVEN_BITS_ABI_TIME_H"
rust_type = "i32"
base = "dec"
source = ["freebsd:sys/sys/_clock_id.h", "freebsd:include/time.h", "freebsd:sys/sys/time.h"]
donor = { name = "freebsd", revision = "133344405f532bd54ff3629a77d4c4e062f01fdb", license = "BSD-3-Clause" }
donor_absent = "Linux-only clock IDs stay as explicit Raven extensions above CLOCK_TAI"
prefixes = ["CLOCK_", "TIMER_", "TIME_", "ITIMER_", "CLOCKS_PER_SEC"]

consts = [
  { name = "CLOCKS_PER_SEC", value = 128, suffix = "L" },
  { name = "TIME_UTC", value = 1 },
  { name = "CLOCK_REALTIME", value = 0 },
  { name = "CLOCK_VIRTUAL", value = 1, visible = "bsd" },
  { name = "CLOCK_PROF", value = 2, visible = "bsd" },
  { name = "CLOCK_MONOTONIC", value = 4 },
  { name = "CLOCK_UPTIME", value = 5, visible = "bsd" },
  { name = "CLOCK_UPTIME_PRECISE", value = 7, visible = "bsd" },
  { name = "CLOCK_UPTIME_FAST", value = 8, visible = "bsd" },
  { name = "CLOCK_REALTIME_PRECISE", value = 9, visible = "bsd" },
  { name = "CLOCK_REALTIME_FAST", value = 10, visible = "bsd" },
  { name = "CLOCK_MONOTONIC_PRECISE", value = 11, visible = "bsd" },
  { name = "CLOCK_MONOTONIC_FAST", value = 12, visible = "bsd" },
  { name = "CLOCK_SECOND", value = 13, visible = "bsd" },
  { name = "CLOCK_THREAD_CPUTIME_ID", value = 14 },
  { name = "CLOCK_PROCESS_CPUTIME_ID", value = 15 },
  { name = "CLOCK_TAI", value = 16 },
  { name = "CLOCK_BOOTTIME", alias = "CLOCK_MONOTONIC" },
  { name = "CLOCK_REALTIME_COARSE", alias = "CLOCK_REALTIME_FAST" },
  { name = "CLOCK_MONOTONIC_COARSE", alias = "CLOCK_MONOTONIC_FAST" },
  { name = "CLOCK_MONOTONIC_RAW", value = 17, doc = "Raven extension: no FreeBSD equivalent" },
  { name = "CLOCK_REALTIME_ALARM", value = 18, doc = "Raven extension: no FreeBSD equivalent" },
  { name = "CLOCK_BOOTTIME_ALARM", value = 19, doc = "Raven extension: no FreeBSD equivalent" },
  { name = "CLOCK_SGI_CYCLE", value = 20, doc = "Raven extension: no FreeBSD equivalent" },
  { name = "TIMER_RELTIME", value = 0 },
  { name = "TIMER_ABSTIME", value = 1 },
  { name = "ITIMER_REAL", value = 0 },
  { name = "ITIMER_VIRTUAL", value = 1 },
  { name = "ITIMER_PROF", value = 2 },
]
