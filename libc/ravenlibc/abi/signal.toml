schema = 1
group = "signal"
c_header = "bits/signum.h"
guard = "_RAVEN_BITS_SIGNUM_H"
rust_type = "i32"
base = "dec"
source = ["freebsd:sys/sys/signal.h", "freebsd:sys/sys/_sigaltstack.h", "freebsd:sys/x86/include/_limits.h", "freebsd:sys/arm64/include/_limits.h"]
donor = { name = "freebsd", revision = "133344405f532bd54ff3629a77d4c4e062f01fdb", license = "BSD-3-Clause" }
prefixes = ["SIG", "SA_", "SS_", "SI_", "ILL_", "FPE_", "SEGV_", "BUS_", "TRAP_", "CLD_", "POLL_", "MINSIGSTKSZ", "NSIG", "_NSIG"]

omit = [
  { name = "SIG_DFL", reason = "pointer expression ((void (*)(int)) 0); C37's signal.h text, not an object-like constant" },
  { name = "SIG_IGN", reason = "pointer expression ((void (*)(int)) 1); C37's signal.h text" },
  { name = "SIG_ERR", reason = "pointer expression ((void (*)(int)) -1); C37's signal.h text" },
  { name = "SIG_HOLD", reason = "pointer expression ((void (*)(int)) 2); C37's signal.h text" },
]

