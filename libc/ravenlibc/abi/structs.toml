# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026, Bo Maryniuk and RavenBSD contributors
#
# First-party data: the field lists are doc 14 3.A.3 and 3.A.3a plus the clang measurement of
# the musl tree (`hdrgen verify`). `deviates` records the musl measurement where it differs;
# the probe in `hdrgen verify` asserts those values.
#
# `musl_field = ""` marks a named padding field that musl expresses only as implicit padding;
# the musl probe skips such a field. Records with `deviates` are compared by size/align only.

schema = 1

[[record]]
