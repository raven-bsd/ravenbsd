#
# BSD-only reservation ledger (view of C36's abi/*.toml data).

[errno]
# Native errors are the FreeBSD set (DR-69); the values live in abi/errno.toml. This ledger names
# the errors that FreeBSD defines and the Linux UAPI does not, so a Linux-personality conversion
# has an explicit destination at the boundary (raven-linux-abi::errno).
range = [1, 97]
EPROCLIM = 67
EBADRPC = 72
ERPCMISMATCH = 73
EPROGUNAVAIL = 74
EPROGMISMATCH = 75
EPROCUNAVAIL = 76
EFTYPE = 79
EAUTH = 80
ENEEDAUTH = 81
ENOATTR = 87
EDOOFUS = 88
ENOTCAPABLE = 93
ECAPMODE = 94
EINTEGRITY = 97

[open]
bits = [28, 29, 30]

[af]
min = 128
AF_ROUTE = 128
AF_LINK = 129

[at]
flags = ["AT_RESOLVE_BENEATH=0x10000"]

[map]
min = 0x10000000
MAP_NOCORE = 0x10000000
MAP_NOSYNC = 0x20000000
MAP_PREFAULT_READ = 0x40000000

[rlimit]
range = [16, 21]
RLIMIT_SBSIZE = 16
RLIMIT_PIPEBUF = 21

[ipproto]
extra = ["IPPROTO_CARP=112", "IPPROTO_PFSYNC=240", "IPPROTO_DIVERT=258"]

[tcp]
alias = ["TCP_NOPUSH=TCP_CORK"]
