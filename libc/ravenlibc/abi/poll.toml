# RavenBSD: native poll bits transcribed from freebsd:sys/sys/poll.h @
# 133344405f532bd54ff3629a77d4c4e062f01fdb (BSD-3-Clause, tier A, DR-69). Constants are
# transcribed to TOML and generated, not copied.

schema = 1
group = "poll"
c_header = "bits/abi_poll.h"
guard = "_RAVEN_BITS_ABI_POLL_H"
rust_type = "i32"
base = "hex"
source = ["freebsd:sys/sys/poll.h"]
donor = { name = "freebsd", revision = "133344405f532bd54ff3629a77d4c4e062f01fdb", license = "BSD-3-Clause" }
donor_absent = "POLLMSG has no FreeBSD equivalent; kept as an explicit Raven extension"
prefixes = ["POLL"]

consts = [
  { name = "POLLIN", value = 0x001 },
  { name = "POLLPRI", value = 0x002 },
  { name = "POLLOUT", value = 0x004 },
  { name = "POLLERR", value = 0x008 },
  { name = "POLLHUP", value = 0x010 },
  { name = "POLLNVAL", value = 0x020 },
  { name = "POLLRDNORM", value = 0x040 },
  { name = "POLLRDBAND", value = 0x080 },
  { name = "POLLWRNORM", alias = "POLLOUT" },
  { name = "POLLWRBAND", value = 0x100 },
  { name = "POLLMSG", value = 0x400 },
  { name = "POLLINIGNEOF", value = 0x2000 },
  { name = "POLLRDHUP", value = 0x4000 },
  { name = "POLLSTANDARD", value = 0x1ff, base = "hex" },
]
