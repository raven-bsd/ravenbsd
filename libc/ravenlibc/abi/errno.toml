# 133344405f532bd54ff3629a77d4c4e062f01fdb (BSD-2-Clause, tier A, DR-69). Constants are
# transcribed to TOML and generated, not copied. Linux numbers live in raven-linux-abi.

schema = 1
group = "errno"
c_header = "bits/errno.h"
guard = "_RAVEN_BITS_ERRNO_H"
rust_type = "i32"
base = "dec"
source = ["freebsd:sys/sys/errno.h"]
prefixes = ["E"]

# FreeBSD numbers 1..97 (`ELAST` is 97 and is not an error itself). `EWOULDBLOCK`, `ENOTSUP`
# and `EDEADLOCK` are donor aliases; they are emitted with their donor number so the C header,
# the Rust tables and the target module agree without relying on macro expansion.

