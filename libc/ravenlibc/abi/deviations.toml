#
# The complete deviation register. `hdrgen verify` computes the actual difference set against
# the musl measurement and against raven-linux-abi and fails when a row is missing or stale.
# `theirs` is a scalar or a table; an architecture missing from the table has no difference.

schema = 1

# --- Against the musl measurement (doc 14 3.A.3) -------------------------------------------

[[deviation]]
name = "UTIME_NOW"
against = "musl"
ours = -1
theirs = 1073741823
reason = "FreeBSD stat.h defines UTIME_NOW as -1; musl uses (1<<30)-1. The stat record is FreeBSD-valued."

[[deviation]]
name = "UTIME_OMIT"
against = "musl"
ours = -2
theirs = 1073741822
reason = "FreeBSD stat.h defines UTIME_OMIT as -2; musl uses (1<<30)-2. The stat record is FreeBSD-valued."

[[deviation]]
name = "statvfs"
against = "musl"
ours = "88/8"
theirs = { x86_64 = "112/8", aarch64 = "112/8", riscv64 = "112/8" }
reason = "DR-69: the public struct statvfs is the FreeBSD 133344405 field order (88 bytes); musl's 112-byte order is the Linux one and stays confined to linuxd"

[[deviation]]
name = "nlink_t"
against = "musl"
ours = "4/4"
theirs = { x86_64 = "8/8" }
reason = "DV1: nlink_t is 32 bits everywhere so struct stat has one layout; musl x86_64 uses 64 bits"

[[deviation]]
name = "blksize_t"
against = "musl"
ours = "4/4"
theirs = { x86_64 = "8/8" }
reason = "DV1: blksize_t is 32 bits everywhere; musl x86_64 uses 64 bits"

[[deviation]]
name = "jmp_buf"
against = "musl"
ours = "392/8"
theirs = { x86_64 = "200/8", aarch64 = "312/8", riscv64 = "344/8" }
reason = "DV3/RD-new: one 392-byte buffer on all arches for shadow-stack/PAC/BTI/GCS state; doc 14 wrote 392/16, but a 392-byte type cannot have alignment 16; clang measures 8"

[[deviation]]
name = "sigjmp_buf"
against = "musl"
ours = "392/8"
theirs = { x86_64 = "200/8", aarch64 = "312/8", riscv64 = "344/8" }
reason = "DV3/RD-new: same blob as jmp_buf on all arches"

[[deviation]]
name = "termios"
against = "musl"
ours = "44/4"
theirs = { x86_64 = "60/4", aarch64 = "60/4", riscv64 = "60/4" }
reason = "S742/DR-69: the native struct termios is FreeBSD 13334440 (NCCS=20, no c_line, c_cc at 16, speeds at 36/40); the 60-byte musl record is the private tty wire shape"

# --- Against musl constants (H1 x86_64, H3 aarch64 fcntl) ----------------------------------

[[deviation]]
name = "AF_ROUTE"
against = "musl"
ours = 128
theirs = 16
reason = "O-abi-6/RD-85: the BSD route family starts at 128; musl aliases AF_ROUTE to AF_NETLINK (16); socket() fails with EAFNOSUPPORT"

[[deviation]]
name = "PF_ROUTE"
against = "musl"
ours = 128
theirs = 16
reason = "PF_* are aliases of the AF_* entries; the BSD route family is at 128"

[[deviation]]
name = "NGROUPS_MAX"
against = "musl"
ours = 1023
theirs = 32
reason = "H-19/CR-16: the kernel supports 1023 supplementary groups"

[[deviation]]
name = "HOST_NAME_MAX"
against = "musl"
ours = 64
theirs = 255
reason = "H-19/CR-20: the UTS node name is 64 bytes"

[[deviation]]
name = "PTHREAD_STACK_MIN"
against = "musl"
ours = 16384
theirs = 2048
reason = "O-abi-13/RD-85: covers the signal frame; musl's 2048 does not"

[[deviation]]
name = "NL_ARGMAX"
against = "musl"
ours = 64
theirs = 9
reason = "B.8: 64 positional printf/scanf arguments"

[[deviation]]
name = "SOMAXCONN"
against = "musl"
ours = 4096
theirs = 128
reason = "01 B.8/RD-78: the header backlog value is 4096; the runtime cap is a sysctl"

[[deviation]]
name = "utsname"
against = "musl"
ours = "1280/1"
theirs = { x86_64 = "390/1", aarch64 = "390/1", riscv64 = "390/1" }
reason = "S746: the public struct utsname is the FreeBSD 133344405 record (SYS_NMLN 256, five fields, no domainname, 1280 bytes); musl's six 65-byte fields are the Linux record"

[[deviation]]
name = "passwd"
against = "musl"
ours = "80/8"
theirs = { x86_64 = "48/8", aarch64 = "48/8", riscv64 = "48/8" }
reason = "S746: the public struct passwd is the FreeBSD 133344405 eleven-field record (80 bytes); musl has the seven-field 48-byte record"

