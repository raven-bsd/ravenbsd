[[deviation]]
name = "SIGRTMIN"
against = "freebsd"
ours = 35
theirs = 65
reason = "C19 keeps the private signal range at 1..=64 and the kernel set width at u64; the public real-time range stays 35..64 until the kernel 128-bit set-width unit. FreeBSD SIGRTMIN is 65."

[[deviation]]
name = "SIGRTMAX"
against = "freebsd"
ours = 64
theirs = 126
reason = "C19 keeps the private signal range at 1..=64 and the kernel set width at u64; the public real-time range stays 35..64 until the kernel 128-bit set-width unit. FreeBSD SIGRTMAX is 126."
