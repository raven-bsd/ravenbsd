#
# First-party data: the type decisions are doc 14 3.A.2 plus H-14/H-15. musl's
# `include/alltypes.h.in` and the three `arch/*/bits/alltypes.h.in` files were read as the
# structural base; the values below are the frozen RavenBSD decisions, not musl's.
#
# `hdrgen provenance` has no entry for this file (CLEANROOM row of doc 14 section 5).

schema = 1

# The type decisions are doc 14 3.A.2 plus H-14/H-15. musl's alltypes.h.in is the base; the
# three deliberate changes are nlink_t/blksize_t (DV1), wchar_t (D3) and char (D2).
# `ctype_probe` names the musl type used by the size probe (`hdrgen verify`).

[[type]]
name = "size_t"
rust = "usize"
c = "unsigned long"
bits = 64
signed = false

[[type]]
name = "uintptr_t"
rust = "usize"
c = "unsigned long"
bits = 64
signed = false

[[type]]
name = "uintmax_t"
rust = "u64"
c = "unsigned long"
bits = 64
signed = false

[[type]]
name = "ssize_t"
rust = "isize"
c = "long"
bits = 64
signed = true

[[type]]
name = "ptrdiff_t"
rust = "isize"
c = "long"
bits = 64
signed = true

[[type]]
name = "intptr_t"
rust = "isize"
c = "long"
bits = 64
signed = true

[[type]]
name = "intmax_t"
rust = "i64"
c = "long"
bits = 64
signed = true

[[type]]
name = "int64_t"
rust = "i64"
c = "long"
bits = 64
signed = true

[[type]]
name = "register_t"
rust = "isize"
c = "long"
bits = 64
signed = true

[[type]]
name = "wchar_t"
rust = "i32"
c = "int"
bits = 32
signed = true
per_arch = { aarch64 = { rust = "u32", c = "unsigned int", signed = false } }
doc = "D3/H-14: __WCHAR_TYPE__; x86_64 and riscv64 int, aarch64 unsigned int"

[[type]]
name = "wint_t"
rust = "u32"
c = "int"
bits = 32
signed = false
doc = "D4: Rust is u32; __WINT_TYPE__ is int on x86_64/aarch64 and unsigned int on riscv64; WEOF is (wint_t)-1"

