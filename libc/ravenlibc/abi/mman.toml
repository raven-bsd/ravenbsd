# RavenBSD: native VM flags and protections transcribed from freebsd:sys/sys/mman.h @
# 133344405f532bd54ff3629a77d4c4e062f01fdb (BSD-3-Clause, tier A, DR-69). Constants are
# transcribed to TOML and generated, not copied. Linux-only flags stay as explicit Raven
# extensions in the high bits, distinct from every FreeBSD-named flag.

schema = 1
group = "mman"
c_header = "bits/abi_mman.h"
guard = "_RAVEN_BITS_ABI_MMAN_H"
rust_type = "i32"
base = "hex"
source = ["freebsd:sys/sys/mman.h"]
donor = { name = "freebsd", revision = "133344405f532bd54ff3629a77d4c4e062f01fdb", license = "BSD-3-Clause" }
donor_absent = "Linux-only VM flags and madvise commands stay as explicit Raven extensions in high bits"
prefixes = ["MAP_", "PROT_", "MS_", "MCL_", "MADV_", "MREMAP_", "POSIX_MADV_", "MFD_"]

omit = [
  { name = "MAP_FAILED", reason = "pointer expression ((void *)-1); C37's sys/mman.h text" },
  { name = "MAP_ALIGNED", reason = "FreeBSD function-like macro, not an object-like constant; C37 policy" },
]

