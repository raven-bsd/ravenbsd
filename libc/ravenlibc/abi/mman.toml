  { name = "PROT_READ", value = 1 },
  { name = "PROT_WRITE", value = 2 },
  { name = "PROT_EXEC", value = 4 },
  { name = "PROT_GROWSDOWN", value = 0x01000000, doc = "Raven extension: Linux-only protection flag" },
  { name = "PROT_GROWSUP", value = 0x02000000, doc = "Raven extension: Linux-only protection flag" },
  { name = "MAP_SHARED", value = 0x01 },
