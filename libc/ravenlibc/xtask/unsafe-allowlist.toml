# DR-39 allow-list. Each row names one crate and one raw module.
# [[allow]]
# crate = "raven-libc-str"
# path = "src/raw.rs"
# reason = "raw pointer entry points"

[[allow]]
crate = "raven-libc-m"
path = "src/fenv/"
reason = "DR-39 x87/SSE control-register access (fnstenv/fldenv/fnstcw/fldcw/fnstsw/stmxcsr/ldmxcsr, fnclex, fwait); each block has a // SAFETY: comment naming the valid buffer"
[[allow]]
crate = "raven-libc-str"
path = "src/raw/"
reason = "DR-39 audited pointer shell: the mem* entry points, the compiler-builtins adaptation, the secure-memory barriers, the caller-cursor tokenisers and the Arm asm wrappers; every unsafe block carries a // SAFETY: comment"

[[allow]]
crate = "raven-libc-malloc"
path = "src/raw.rs"
reason = "DR-39 audited raw module: every read, write, fill and copy of the allocator; every unsafe block carries a // SAFETY: comment"

[[allow]]
crate = "raven-libc-malloc"
path = "src/raw_ut.rs"
reason = "host unit tests exercise the raw module directly; the addresses come from live stack buffers"

[[allow]]
crate = "raven-libc-malloc"
path = "src/tiny/tiny_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned 4 MiB block"

[[allow]]
crate = "raven-libc-malloc"
path = "src/hardened/hardened_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned 16 MiB block"

[[allow]]
crate = "raven-libc-malloc"
path = "src/debug/debug_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned block"

[[allow]]
crate = "raven-libc-tls"
path = "src/raw.rs"
reason = "DR-39 audited TLS raw module: initial-image writes, DTV publication, TCB conversion and the thread-pointer register helpers; every unsafe block names the mapping/DTV/thread-pointer invariant that makes it sound"

[[allow]]
crate = "raven-libc-thread"
path = "src/raw.rs"
reason = "DR-39 audited thread raw module: TCB field views, robust-list pointer chasing, the entry trampoline and the production SysKernel; every unsafe block names the invariant that makes it sound"

[[allow]]
crate = "raven-libc-thread"
path = "src/raw/"
reason = "DR-39 audited raw submodules: per-architecture thread entry assembly, futex word views and TLS-descriptor calls; every unsafe block names its invariant"
