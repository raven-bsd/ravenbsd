# DR-39 allow-list. Each row names one crate and one raw module.
# [[allow]]
# crate = "raven-libc-str"
# path = "src/raw.rs"
# reason = "raw pointer entry points"

[[allow]]
crate = "raven-libc-m"
path = "src/fenv/"
reason = "DR-39 x87/SSE control-register access (fnstenv/fldenv/fnstcw/fldcw/fnstsw/stmxcsr/ldmxcsr, fnclex, fwait); each block has a // SAFETY: comment naming the valid buffer"
[[allow]]
crate = "raven-libc-str"
path = "src/raw/"
reason = "DR-39 audited pointer shell: the mem* entry points, the compiler-builtins adaptation, the secure-memory barriers, the caller-cursor tokenisers and the Arm asm wrappers; every unsafe block carries a // SAFETY: comment"

[[allow]]
crate = "raven-libc-malloc"
path = "src/raw.rs"
reason = "DR-39 audited raw module: every read, write, fill and copy of the allocator; every unsafe block carries a // SAFETY: comment"

[[allow]]
crate = "raven-libc-malloc"
path = "src/raw_ut.rs"
reason = "host unit tests exercise the raw module directly; the addresses come from live stack buffers"

[[allow]]
crate = "raven-libc-malloc"
path = "src/tiny/tiny_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned 4 MiB block"

[[allow]]
crate = "raven-libc-malloc"
path = "src/hardened/hardened_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned 16 MiB block"

[[allow]]
crate = "raven-libc-malloc"
path = "src/debug/debug_ut.rs"
reason = "host test arena uses the system allocator to obtain a page-aligned block"

[[allow]]
crate = "raven-libc-stdio"
path = "src/raw.rs"
reason = "DR-39 audited raw module: the shareable FILE cell (unsafe impl Sync justified by the recursive lock protocol), caller buffer pairs, the fopencookie/funopen typed thunks, Box::into_raw/from_raw for heap FILEs and the list links; every unsafe block carries a // SAFETY: comment"

[[allow]]
crate = "raven-libc-stdio"
path = "src/cookie_ut.rs"
reason = "host unit tests define and call Rust extern \"C\" cookie callbacks over Box-owned test cookies"

[[allow]]
crate = "raven-libc-stdio"
path = "src/funopen_ut.rs"
reason = "host unit tests define and call Rust extern \"C\" funopen callbacks over Box-owned test cookies"

[[allow]]
crate = "raven-libc-stdio"
path = "src/mem_ut.rs"
reason = "host unit tests read the open_memstream out pointers through Box-owned raw pointers (the C ownership contract)"

[[allow]]
crate = "raven-libc-stdio"
path = "src/funopen.rs"
reason = "the public funopen signature names the caller's C callback pointer types (unsafe extern fn types only); the calls themselves are in src/raw.rs"

[[allow]]
crate = "raven-libc-stdio"
path = "src/api_ut.rs"
reason = "host unit test reads the open_memstream out pointers through Box-owned raw pointers (the C ownership contract)"
