#
# P4d/P4o system/process utility evidence. Only rows with executable POSIX
# behaviour evidence are claimed present; partial or missing tools stay defects
# in docs/posix/P4-system.md.

schema = 1
standard = "posix-2024"

[[row]]
id = "util.id"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4d: QEMU x86_64 case stages the shell-profile uutils id; checks uid/gid/groups, -n and -r"

[[row]]
id = "util.uname"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4d: QEMU x86_64 case checks uname -s/-n/-r/-v/-m/-a against the kernel uname"

[[row]]
id = "util.tty"
status = "present"
evidence = "test:tests/posix/utility/system/tty/test.sh"
notes = "P4d: host behaviour of the vendored uutils tty on a pty; target pty/tty primitives come from P3"

[[row]]
id = "util.stty"
status = "present"
evidence = "test:tests/posix/utility/system/stty/test.sh"
notes = "P4d: host behaviour of the vendored uutils stty on a pty; target termios primitives come from P3"

[[row]]
id = "util.env"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4o: first-party env; -i, assignments, execve command and exit status"

[[row]]
id = "util.getconf"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4o: first-party getconf; ARG_MAX, PAGESIZE, _POSIX_VERSION and -a"

[[row]]
id = "util.kill"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4o: first-party kill; -l names/numbers, pid and group targets, signal 0 and errors"

[[row]]
id = "util.nice"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4o: first-party nice; query, set/clamp and execute a command"

[[row]]
id = "util.nohup"
status = "present"
evidence = "qtest:posix-util-system"
notes = "P4o: non-terminal stdout path; exec and exit status. Terminal-only nohup.out redirection is unavailable (no fd 1/isatty/dup2) and is recorded as a libc/tty follow-up"
