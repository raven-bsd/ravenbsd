#
# P45 shell-builtin utility evidence. All present rows use the existing
# posix-shell qtest; the builtin group was added to that case, not a new runner.
schema = 1
standard = "posix-2024"

[[row]]
id = "util.alias"
status = "present"
evidence = "qtest:posix-shell"
notes = "P45: alias define/list and unalias remove markers (alias:0, unalias:0); substitution in one non-interactive parse unit is not claimed"

