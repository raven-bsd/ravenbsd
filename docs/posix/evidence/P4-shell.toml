#
# P4a POSIX shell evidence. The qtest runs brush --posix through the supported grammar,
# expansion, redirection, function, loop, set-option, trap-EXIT and builtin groups. The seven
# waived rows are the platform or target-stdio gaps named in docs/posix/P4-shell.md; they are
# not claimed as passes.

schema = 1
standard = "posix-2024"

[[row]]
id = "shell.arithmetic-expansion"
status = "present"
evidence = "qtest:posix-shell"
notes = "P4a: arithmetic-expansion marker in the posix-shell qtest"

