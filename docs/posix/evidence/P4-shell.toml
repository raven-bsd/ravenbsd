#
# P4a/P4p POSIX shell evidence. The qtest runs the 18 brush --posix groups and the rsh
# pipeline, redirection, list and here-document group. Three waived rows (job control,
# interactive login and signal traps) are the platform gaps named in docs/posix/P4-shell.md;
# they are not claimed as passes.

schema = 1
standard = "posix-2024"

[[row]]
id = "shell.arithmetic-expansion"
status = "present"
evidence = "qtest:posix-shell"
notes = "P4a: arithmetic-expansion marker in the posix-shell qtest"

