# P1 owner evidence: headers and interfaces.
schema = 1
standard = "posix-2024"

[[row]]
id = "header.assert.h"
status = "present"
evidence = "test:tests/posix/check-headers.sh"
notes = "P1: assert.h and the assert macro compile under the POSIX feature macros"

# P1 batch (a): the headers absent from the ravenlibc include root. The compile test uses the
# same POSIX feature macros as the gate and exercises the macro/interface surface where present.
[[row]]
id = "header.float.h"
status = "present"
evidence = "test:tests/libc/posix/headers/check-missing-headers.sh"
notes = "P1 batch a: POSIX.1-2024 <float.h> (C17 7.7) compiles through the libc include root"

[[row]]
id = "header.iso646.h"
status = "present"
evidence = "test:tests/libc/posix/headers/check-missing-headers.sh"
