#
# K548 rev351: the smoke crate links like a product static ravenbsd binary. The toolchain ships the
# target std; the CRT objects, the static libc and the layout script come from the product tree
# (build/x86_64, tests/libc/target/x86_64.ld), not from the local build/toolchain. The paths are
# relative to toolchain/smoke so the smoke stays inside the repository.

[target.x86_64-unknown-ravenbsd]
rustflags = [
    "-C", "code-model=small",
    "-C", "relocation-model=static",
    "-C", "lto=no",
    "-C", "link-arg=../../build/x86_64/crt1.o",
    "-C", "link-arg=../../build/x86_64/crti.o",
    "-C", "link-arg=../../build/x86_64/crtbegin.o",
    "-C", "link-arg=-L../../build/x86_64",
    "-C", "link-arg=-lc",
    "-C", "link-arg=../../build/x86_64/crtend.o",
    "-C", "link-arg=../../build/x86_64/crtn.o",
    "-C", "link-arg=-T../../tests/libc/target/x86_64.ld",
]
