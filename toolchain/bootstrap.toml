#
# Bootstrap configuration for the patched RavenBSD Rust toolchain (ticket K19).
# `change-id = "ignore"` silences the upstream bootstrap schema-change warning.

change-id = "ignore"

[build]
target = ["x86_64-unknown-linux-gnu", "x86_64-unknown-ravenbsd"]
extended = true
# `make toolchain` installs stage 1. Cargo is part of that stage; rustfmt and
# clippy are stage-2 tools and are deliberately not required for the K19 gate.
tools = ["cargo"]
docs = false
# The patches only touch compiler/rustc_target and library/; the LLVM submodule is
# not modified, so the CI LLVM can be downloaded instead of checking it out.
submodules = false

[llvm]
download-ci-llvm = true

[rust]
channel = "stable"

[install]
prefix = "build/toolchain"
sysconfdir = "etc"
