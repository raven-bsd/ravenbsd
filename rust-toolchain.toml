# Pinned stable toolchain. No nightly, ever, for building shipped artifacts (DECISIONS.md DR-02).
[toolchain]
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "riscv64gc-unknown-none-elf",
    "x86_64-unknown-uefi",
    "aarch64-unknown-uefi",
]
