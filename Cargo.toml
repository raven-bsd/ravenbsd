# RavenBSD workspace. Host-testable crates are the default members (`cargo test` on the host); kernel,
# loader and userland programs are built for their own targets by `cargo xtask` (architecture/10).
[workspace]
resolver = "3"
# A ticket that creates a new top-level crate appends ONE line to `members` (and nothing else here).
# Planned members: "kernel", "boot/loader", "userland/rt", "userland/init", "userland/bin/<tool>",
# "userland/servers/<server>", "userland/drivers/<driver>", "userland/linux-shim", "libc/ralibc",
# "xtask", "tests/qtest", "tests/fixtures/<name>".
members = [
    "crates/*",
    "kernel",
    "boot/loader",
    "tests/fixtures/s08-init",
    "tests/fixtures/s09-futex",
    "tests/fixtures/echo-dialogue",
    "tests/fixtures/s24-spawn/parent",
    "tests/fixtures/s24-spawn/child",
    "tests/fixtures/s11-echo",
    "tests/fixtures/s33-ipc",
    "tests/fixtures/s32-capture",
    "tests/fixtures/s37-fs",
    "tests/fixtures/s25-xfer",
    "tests/fixtures/s26-evq",
    "tests/fixtures/s27-echo",
    "tests/fixtures/s35-handles",
    "tests/fixtures/k68-svc",
    "tests/fixtures/s21-edu",
    "tests/fixtures/s21d-aarch64",
    "tests/fixtures/k66-fs",
    "tests/fixtures/k71-scheme",
    "tests/fixtures/k67-fs",
    "tests/fixtures/s30-irq",
    "tests/fixtures/s31-irq",
    "tests/fixtures/s34-concurrency",
    "tests/fixtures/s36-lifecycle",
    "tests/fixtures/s38-events",
    "tests/fixtures/s40-teardown",
    "tests/fixtures/usercopy-cow",
    "tests/fixtures/testkernel",
    "xtask",
    "tests/qtest",
    "tests/ufs-oracle",
    "tests/ufs-powercut",
    "tools/linux-corpus",
    "tools/ufs-fsck",
    "tools/ufs-mkfs",
    "tools/integration-inventory",
    "libc/spike/va",
    "userland/rt",
    "userland/linux-shim",
    "userland/init",
    "userland/init/testsvc",
    "userland/bin/uname",
    "userland/bin/rsh",
    "userland/bin/echo",
    "userland/bin/hostname",
    "userland/bin/sleep",
    "userland/bin/date",
    "userland/bin/dmesg",
    "userland/bin/mount",
    "userland/bin/umount",
    "userland/bin/ps",
    "userland/bin/svcctl",
    "userland/bin/cat",
    "userland/bin/ls",
    "userland/bin/mkdir",
    "userland/bin/rmdir",
    "userland/bin/rm",
    "userland/bin/mv",
    "userland/bin/cp",
    "userland/bin/touch",
    "userland/bin/stat",
    "userland/bin/df",
    "userland/servers/logd",
    "userland/servers/sysd",
    "userland/servers/randd",
    "userland/servers/zerod",
    "userland/servers/nulld",
    "userland/servers/ramfsd",
    "userland/servers/ramfsd-probe",
    "userland/servers/initfsd",
    "userland/servers/initfsd-probe",
    "userland/servers/vfsd",
    "userland/servers/vfsd-probe",
    "userland/servers/coretest",
    "userland/servers/consd",
    "userland/servers/consd-probe",
    "tests/net/packetdrill-harness",
    "tests/tcpip",
    "tests/tcpip/conformance",
    "tests/tcpip/fuzz-replay",
    "tests/tcpip/interop",
    "tests/tcpip/bench",
    "tests/tcpip/oracle",
    "tools/bench-host",
]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
repository = "https://example.invalid/ravenbsd"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# The kernel crate additionally opts in to `indexing_slicing` and `arithmetic_side_effects` (warn).

# dev: "fat" on purpose: no optimisation, full debug info, overflow checks. Easy to debug, big binaries.
[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true
panic = "abort"

# The 64 MiB ESP cannot hold the debug-sized shell initfs together with the ten file tools.
# Drop debug info only for the userland runtime and its pure libraries; kernel debug info is
# unchanged.
[profile.dev.package."raven-rt"]
debug = false

[profile.dev.package."raven-tool-core"]
debug = false

[profile.dev.package."raven-proto-fs"]
debug = false

[profile.dev.package."raven-scheme"]
debug = false

[profile.dev.package."raven-ipc"]
debug = false

[profile.dev.package."raven-vfs-core"]
debug = false

[profile.dev.package."raven-ramfs-core"]
debug = false

[profile.dev.package."raven-svc-manifest"]
debug = false

[profile.dev.package."raven-hostname"]
debug = false

[profile.dev.package."raven-sleep"]
debug = false

[profile.dev.package."raven-date"]
debug = false

[profile.dev.package."raven-dmesg"]
debug = false

[profile.dev.package."raven-mount"]
debug = false

[profile.dev.package."raven-umount"]
debug = false

[profile.dev.package."raven-ps"]
debug = false

[profile.dev.package."raven-consd"]
debug = false

[profile.dev.package."raven-init"]
debug = false

[profile.dev.package."raven-initfsd"]
debug = false

[profile.dev.package."raven-vfsd"]
debug = false

[profile.dev.package."raven-ramfsd"]
debug = false

[profile.dev.package."raven-logd"]
debug = false

[profile.dev.package."raven-sysd"]
debug = false

[profile.dev.package."raven-nulld"]
debug = false

[profile.dev.package."raven-zerod"]
debug = false

[profile.dev.package."raven-randd"]
debug = false

[profile.dev.package."raven-svcctl"]
debug = false

[profile.dev.package."raven-uname"]
debug = false

[profile.dev.package."raven-echo"]
debug = false

# release: smallest binaries: size optimisation, fat LTO, one codegen unit, no unwinding, symbols stripped.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = false
incremental = false
