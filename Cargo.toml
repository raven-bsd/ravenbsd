# release: smallest binaries: size optimisation, fat LTO, one codegen unit, no unwinding, symbols stripped.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = false
incremental = false
