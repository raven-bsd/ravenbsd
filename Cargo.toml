# release: smallest binaries: size optimisation, fat LTO, one codegen unit, no unwinding, symbols stripped.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = false
incremental = false

# K19a/C64g: the actual registry libc 0.2.186 with the ABI-checked ravenbsd
# unix module. The path crate lives outside the workspace (see `exclude`) and
# is also used by the getrandom backend probe and the brush target build.
[patch.crates-io]
libc = { path = "toolchain/vendor/libc" }
