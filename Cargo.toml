[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
repository = "https://example.invalid/ravenbsd"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# The kernel crate additionally opts in to `indexing_slicing` and `arithmetic_side_effects` (warn).

# dev: "fat" on purpose: no optimisation, full debug info, overflow checks. Easy to debug, big binaries.
# ravenlibc build profiles (architecture/raven-libc/17-crate-layout.md 9.2); built by `cargo xtask libc-*`, never by default.
[profile.libc-a]
inherits = "release"
opt-level = "z"
codegen-units = 4096
lto = false
panic = "abort"
debug = false
incremental = false
strip = "none"

[profile.libc-a-server]
inherits = "libc-a"
opt-level = "s"

# The hot list of donor-map/16 R-26 keeps its own optimisation level in the server set;
# the symbol set and behaviour are identical to the tiny set (L-8).
[profile.libc-a-server.package."raven-libc-str"]
opt-level = 3

[profile.libc-a-server.package."raven-libc-fmt"]
opt-level = 3

[profile.libc-a-server.package."raven-libc-malloc"]
opt-level = 3

[profile.libc-a-server.package."raven-libc-dtoa"]
opt-level = 3

[profile.libc-a-server.package."raven-libc-stdlib"]
opt-level = 3

[profile.libc-so]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false
strip = "none"

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true
panic = "abort"

# The 64 MiB ESP cannot hold the debug-sized shell initfs together with the ten file tools.
# Drop debug info only for the userland runtime and its pure libraries; kernel debug info is
# unchanged.
[profile.dev.package."raven-rt"]
debug = false

[profile.dev.package."raven-tool-core"]
debug = false

[profile.dev.package."raven-proto-fs"]
debug = false

[profile.dev.package."raven-proto-dev"]
debug = false

[profile.dev.package."raven-pcid"]
debug = false

[profile.dev.package."raven-devd"]
debug = false

[profile.dev.package."raven-scheme"]
debug = false

[profile.dev.package."raven-ipc"]
debug = false

[profile.dev.package."raven-vfs-core"]
debug = false

[profile.dev.package."raven-ramfs-core"]
debug = false

[profile.dev.package."raven-svc-manifest"]
debug = false

[profile.dev.package."raven-hostname"]
debug = false

[profile.dev.package."raven-sleep"]
debug = false

[profile.dev.package."raven-date"]
debug = false

[profile.dev.package."raven-dmesg"]
debug = false

[profile.dev.package."raven-mount"]
debug = false

[profile.dev.package."raven-umount"]
debug = false

[profile.dev.package."raven-ps"]
debug = false

[profile.dev.package."raven-consd"]
