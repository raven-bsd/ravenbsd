[package]
name = "raven-rt"
version = "0.1.0"
description = "RavenBSD no_std userland runtime: entry, syscalls, printing, panic, allocator."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["panic-handler", "alloc"]
panic-handler = []
alloc = []

[dependencies]
raven-abi = { path = "../../crates/raven-abi" }
raven-elf = { path = "../../crates/raven-elf" }
raven-proto-fs = { path = "../../crates/raven-proto-fs" }
raven-scheme = { path = "../../crates/raven-scheme" }

[target.'cfg(target_os = "none")'.dependencies]
raven-initfs = { path = "../../crates/raven-initfs" }

[dev-dependencies]
raven-initfs = { path = "../../crates/raven-initfs", features = ["std"] }

[[example]]
name = "hello"
path = "examples/hello.rs"
required-features = ["panic-handler"]

[[example]]
name = "spawn_demo"
path = "tests/spawn_demo/spawn_demo.rs"
required-features = ["panic-handler"]

[lints]
workspace = true
