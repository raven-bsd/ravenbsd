[package]
name = "raven-kstat-cli"
version = "0.1.0"
description = "RavenBSD kstat typed statistics utility."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "raven-kstat-cli"
path = "src/main.rs"

[dependencies]
raven-kstat = { path = "../../../crates/raven-kstat" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-dtrace-user = { path = "../../../crates/raven-dtrace-user" }
raven-rt = { path = "../../rt" }

[lints]
workspace = true
