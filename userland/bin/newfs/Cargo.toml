[package]
name = "newfs"
version = "0.1.0"
description = "RavenBSD newfs: format a UFS2 block device over the block scheme."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "newfs"
path = "src/lib.rs"

[[bin]]
name = "newfs"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-block = { path = "../../../crates/raven-proto-block" }
raven-scheme = { path = "../../../crates/raven-scheme" }
ufs-core = { path = "../../../crates/ufs-core" }
fsd-ufs = { path = "../../servers/fsd-ufs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[lints]
workspace = true
