[package]
name = "raven-logger"
version = "0.1.0"
description = "RavenBSD logger utility: write a priority/tag record to logd."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }

[[bin]]
name = "logger"
path = "src/main.rs"

[lints]
workspace = true
