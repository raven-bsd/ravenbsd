[package]
name = "raven-play"
version = "0.1.0"
description = "RavenBSD play utility: PCM16 WAV to the audio: null sink."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-audio-core = { path = "../../../crates/raven-audio-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-audio = { path = "../../../crates/raven-proto-audio" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
