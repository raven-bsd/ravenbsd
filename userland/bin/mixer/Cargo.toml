[package]
name = "raven-mixer"
version = "0.1.0"
description = "RavenBSD mixer utility: volume, mute and status on audio:out0."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-audio = { path = "../../../crates/raven-proto-audio" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
