[package]
name = "strip"
version = "0.1.0"
description = "RavenBSD strip: remove symbol and debug sections from ELF32/ELF64 files."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "strip"
path = "src/lib.rs"

[[bin]]
name = "strip"
path = "src/main.rs"

[dependencies]
raven-elf = { path = "../../../crates/raven-elf" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[lints]
workspace = true
