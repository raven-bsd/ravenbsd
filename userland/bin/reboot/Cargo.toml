[package]
name = "raven-reboot"
version = "0.1.0"
description = "RavenBSD reboot command."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "reboot"
path = "src/main.rs"
test = false

[dependencies]
raven-shutdown = { path = "../shutdown" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
