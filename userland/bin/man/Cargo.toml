[package]
name = "man"
version = "0.1.0"
description = "RavenBSD manual page viewer."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-mdoc = { path = "../../../crates/raven-mdoc" }
raven-theme = { path = "../../../crates/raven-theme", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
