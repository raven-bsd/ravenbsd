[package]
name = "su"
version = "0.1.0"
description = "RavenBSD su utility: verify a target account and start its shell."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
raven-userdb = { path = "../../../crates/raven-userdb" }

[target.'cfg(target_os = "none")'.dependencies]
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
