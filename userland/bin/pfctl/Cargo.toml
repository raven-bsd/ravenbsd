[package]
name = "raven-pfctl"
version = "0.1.0"
description = "RavenBSD pfctl front-end: pf.conf parser, AST, printer and table files."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_pfctl"
path = "src/lib.rs"

[[bin]]
name = "raven-pfctl"
path = "src/main.rs"

[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[lints]
workspace = true
