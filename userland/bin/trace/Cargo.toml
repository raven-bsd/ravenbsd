[package]
name = "trace"
version = "0.1.0"
description = "Read the cross-process span sink and print one request tree."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "trace"
path = "src/lib.rs"

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-trace-core = { path = "../../../crates/raven-trace-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
