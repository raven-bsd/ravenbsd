[package]
name = "raven-tar"
version = "0.1.0"
description = "RavenBSD tar: POSIX ustar create, list and extract."
# SC2: first-party crate name, so cargo-audit does not match the upstream `tar-rs`
# advisories by package name (the binary stays `tar`).
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "tar"
path = "src/lib.rs"

[[bin]]
name = "tar"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }

[lints]
workspace = true
