[package]
name = "raven-getty"
version = "0.1.0"
description = "RavenBSD getty: console login prompt and session shell launcher."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "raven_getty"
path = "src/lib.rs"

[[bin]]
name = "getty"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
login = { path = "../login" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
