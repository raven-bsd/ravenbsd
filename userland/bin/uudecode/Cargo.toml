[package]
name = "uudecode"
version = "0.1.0"
description = "RavenBSD uudecode: POSIX begin/end decoding."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "uudecode"
path = "src/lib.rs"

[[bin]]
name = "uudecode"
path = "src/main.rs"

[dependencies]
uuencode = { path = "../uuencode" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }

[lints]
workspace = true
