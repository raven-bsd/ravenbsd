[package]
name = "login"
version = "0.1.0"
description = "RavenBSD login: root password verification and session setup."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "login"
path = "src/lib.rs"

[[bin]]
name = "login"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
raven-auth = { path = "../../../crates/raven-auth" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
