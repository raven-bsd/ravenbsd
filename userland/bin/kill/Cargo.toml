[package]
name = "raven-kill"
version = "0.1.0"
description = "RavenBSD kill utility: send signals to processes and process groups."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }

[[bin]]
name = "kill"
path = "src/main.rs"

[lints]
workspace = true
