[package]
name = "raven-ping"
version = "0.1.0"
description = "RavenBSD ICMP echo diagnostic over the net: scheme."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_ping"
path = "src/lib.rs"

[[bin]]
name = "raven-ping"
path = "src/main.rs"

[dependencies]
raven-proto-net = { path = "../../../crates/raven-proto-net" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
