[package]
name = "raven-mesg"
version = "0.1.0"
description = "RavenBSD mesg utility: read or set terminal write permission."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-scheme = { path = "../../../crates/raven-scheme" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }

[[bin]]
name = "mesg"
path = "src/main.rs"

[lints]
workspace = true
