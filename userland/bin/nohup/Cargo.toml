[package]
name = "raven-nohup"
version = "0.1.0"
description = "RavenBSD nohup utility: run a command immune to hangups."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-env = { path = "../env" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }

[[bin]]
name = "nohup"
path = "src/main.rs"

[lints]
workspace = true
