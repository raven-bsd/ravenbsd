[package]
name = "raven-nice"
version = "0.1.0"
description = "RavenBSD nice utility: query or change a process nice value and run a command."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-env = { path = "../env" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }

[[bin]]
name = "nice"
path = "src/main.rs"

[lints]
workspace = true
