[package]
name = "talk"
version = "0.1.0"
description = "RavenBSD talk: bounded local two-way terminal session protocol."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "talk"
path = "src/lib.rs"

[[bin]]
name = "talk"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-rt = { path = "../../rt" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[dev-dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-ptyd = { path = "../../../userland/servers/ptyd" }
raven-ttyd = { path = "../../../userland/servers/ttyd" }

[lints]
workspace = true
