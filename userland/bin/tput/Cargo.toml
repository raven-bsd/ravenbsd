[package]
name = "tput"
version = "0.1.0"
description = "RavenBSD tput: ANSI terminal capability lookup."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "tput"
path = "src/lib.rs"

[[bin]]
name = "tput"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[lints]
workspace = true
