[package]
name = "wget"
version = "0.1.0"
description = "Simple wget for RavenBSD HTTP and the OpenSSL TLS add-on."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "wget"
path = "src/lib.rs"

[[bin]]
name = "wget"
path = "src/main.rs"

[features]
default = []
tls = ["curl/tls"]

[dependencies]
curl = { path = "../curl", default-features = false }
raven-http = { path = "../../../crates/raven-http" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
