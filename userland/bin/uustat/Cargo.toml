[package]
name = "uustat"
version = "0.1.0"
description = "RavenBSD uustat: list, summarize and cancel queued uucp jobs."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "uustat"
path = "src/lib.rs"

[[bin]]
name = "uustat"
path = "src/main.rs"

[dependencies]
uucp = { path = "../uucp" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt" }
raven-tool-core = { path = "../../../crates/raven-tool-core" }

[lints]
workspace = true
