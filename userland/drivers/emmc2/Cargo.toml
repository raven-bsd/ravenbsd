[package]
name = "emmc2"
version = "0.1.0"
description = "Raspberry Pi 4 EMMC2 (SDHCI) userspace driver and disk: scheme."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-pi4 = { path = "../../../crates/raven-pi4" }
raven-proto-block = { path = "../../../crates/raven-proto-block" }

[target.'cfg(target_os = "none")'.dependencies]
raven-driver = { path = "../../../crates/raven-driver" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
