[package]
name = "virtio-blk"
version = "0.1.0"
description = "virtio-blk userspace driver: modern virtio-pci, one request queue and the disk: scheme."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-driver = { path = "../../../crates/raven-driver" }
raven-proto-block = { path = "../../../crates/raven-proto-block" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
