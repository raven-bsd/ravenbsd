[package]
name = "genet"
version = "0.1.0"
description = "GENET v5 userspace driver: platform MMIO/DMA seam, board bring-up record, frame/IRQ path and typed bring-up."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-driver = { path = "../../../crates/raven-driver" }
