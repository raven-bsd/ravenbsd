[package]
name = "raven-ramfsd"
version = "0.1.0"
description = "RavenBSD in-memory writable filesystem server (ramfs: scheme)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-ramfs-core = { path = "../../../crates/raven-ramfs-core" }
raven-scheme = { path = "../../../crates/raven-scheme" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", features = ["alloc"] }

[dev-dependencies]
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-scheme = { path = "../../../crates/raven-scheme", features = ["testing"] }

[lints]
workspace = true
