[package]
name = "netd"
version = "0.1.0"
description = "RavenBSD net: socket server: loopback TCP/UDP and the interface control channel."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-netcore = { path = "../../../crates/raven-netcore" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-net = { path = "../../../crates/raven-proto-net" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
