[package]
name = "atd"
version = "0.1.0"
description = "RavenBSD minimal at daemon: run due queued jobs through the kernel spawn path."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
at = { path = "../../bin/at" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
