[package]
name = "raven-ttyd"
version = "0.1.0"
description = "RavenBSD session/foreground-terminal state server."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_ttyd"
path = "src/lib.rs"

[[bin]]
name = "ttyd"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
