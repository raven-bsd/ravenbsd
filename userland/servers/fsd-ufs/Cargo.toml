[package]
name = "fsd-ufs"
version = "0.1.0"
description = "RavenBSD read-only UFS filesystem server (ufs: scheme)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-block = { path = "../../../crates/raven-proto-block" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-scheme = { path = "../../../crates/raven-scheme" }
ufs-core = { path = "../../../crates/ufs-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
