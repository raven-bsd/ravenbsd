# The platform driver table installed by the Pi 4 profiles. `devd` matches these entries against
# the device-tree `compatible` string; `vendor`/`device` are absent because they are PCI keys.
#
# `args` declares the platform grants: `bar=N` selects the `reg` window and `resources=dma+irq`
# asks for the DMA buffer and the device's first GIC interrupt. `devd dtb launch` generates the
# `bar`/`bar_size`/`dma`/`irq` tokens and transfers the handles in that order. REL3 stages the
# driver programs and their service entries; the genet entry is the launch-ready one.

[[driver]]
name = "genet"
compatible = "brcm,bcm2711-genet-v5"
exec = "/sbin/genet"
args = ["bar=0", "resources=dma+irq", "serve", "slots=platform"]
abi = 1
version = 1
ops_version = 1
capabilities = ["mmio", "dma", "irq"]

[[driver]]
name = "emmc2"
compatible = "brcm,bcm2711-emmc2"
exec = "/sbin/emmc2"
abi = 1
version = 1
ops_version = 1
capabilities = ["mmio"]

[[driver]]
name = "pwm1"
compatible = "brcm,bcm2835-pwm"
exec = "/sbin/pwm"
abi = 1
version = 1
ops_version = 1
capabilities = ["mmio"]

[[driver]]
name = "rng200"
compatible = "brcm,bcm2711-rng200"
exec = "/sbin/rng200"
abi = 1
version = 1
ops_version = 1
capabilities = ["mmio"]
