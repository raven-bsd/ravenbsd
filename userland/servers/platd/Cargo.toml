[package]
name = "raven-platd"
version = "0.1.0"
description = "RavenBSD Raspberry Pi 4 platform server (plat: scheme)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-plat = { path = "../../../crates/raven-plat" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-driver = { path = "../../../crates/raven-driver" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
