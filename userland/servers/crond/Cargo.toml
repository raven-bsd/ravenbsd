[package]
name = "crond"
version = "0.1.0"
description = "RavenBSD minimal cron daemon: minute-granularity spool scheduler."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
crontab = { path = "../../bin/crontab" }
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
