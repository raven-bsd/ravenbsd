[package]
name = "raven-ptyd"
version = "0.1.0"
description = "RavenBSD pty master/slave server and line discipline."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_ptyd"
path = "src/lib.rs"

[[bin]]
name = "ptyd"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-tty-core = { path = "../../../crates/raven-tty-core" }

[lints]
workspace = true
