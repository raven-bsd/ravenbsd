[package]
name = "raven-initfsd"
version = "0.1.0"
description = "RavenBSD read-only filesystem server over the initfs (initfs: scheme)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
