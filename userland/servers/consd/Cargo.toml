[package]
name = "raven-consd"
version = "0.1.0"
description = "RavenBSD console server: the tty: scheme over DEBUG_READ/DEBUG_WRITE."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-tty-core = { path = "../../../crates/raven-tty-core" }

[lints]
workspace = true
