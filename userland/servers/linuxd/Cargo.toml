[package]
name = "linuxd"
version = "0.1.0"
description = "RavenBSD Linux personality server: Linux process table, dispatcher and image loader."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "linuxd"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-linux-abi = { path = "../../../crates/raven-linux-abi" }
raven-linux-dispatch = { path = "../../../crates/raven-linux-dispatch" }
raven-proto-linux = { path = "../../../crates/raven-proto-linux" }
linux-elf = { path = "../../../crates/linux-elf" }

[target.'cfg(target_os = "none")'.dependencies]
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }

[target.'cfg(target_os = "none")'.dependencies.raven-rt]
path = "../../rt"
features = ["alloc", "panic-handler"]

[lints]
workspace = true
