[package]
name = "raven-consd-probe"
version = "0.1.0"
description = "One-shot tty: console client used by the consd qtest."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-tty = { path = "../../../crates/raven-proto-tty" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-tty-core = { path = "../../../crates/raven-tty-core" }

[lints]
workspace = true
