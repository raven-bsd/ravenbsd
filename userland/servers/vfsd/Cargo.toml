[package]
name = "raven-vfsd"
version = "0.1.0"
description = "RavenBSD file: namespace server: mount table and path routing."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-vfs-core = { path = "../../../crates/raven-vfs-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-pager = { path = "../../../crates/raven-pager" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
