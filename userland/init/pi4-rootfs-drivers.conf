# Pi 4 platform driver table for the UFS root image.
#
# devd matches the EMMC2 node and transfers the MMIO window, DMA buffer and GIC
# interrupt as child handles 3/4/5. It appends `bar=0`, `bar_size=`, `dma=` and
# `irq=`; the emmc2 option parser accepts that spelling (and the explicit
# `mmio_handle=`/`dma_handle=`/`irq_handle=` form).
[[driver]]
name = "genet"
compatible = "brcm,bcm2711-genet-v5"
exec = "/sbin/genet"
args = ["bar=0", "resources=dma+irq", "serve", "slots=platform"]

[[driver]]
name = "emmc2"
compatible = "brcm,bcm2711-emmc2"
exec = "/sbin/emmc2"
args = ["bar=0", "resources=dma+irq"]

[[driver]]
name = "platd"
compatible = "raven,pi4-platform"
exec = "/sbin/platd"
args = ["bar=0", "bar=1", "bar=2", "resources=dma", "dma_size=256", "mailbox=3:64", "gpio=4:180", "rng=5:40", "dma=6:256"]
