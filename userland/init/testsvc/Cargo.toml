[package]
name = "raven-testsvc"
version = "0.1.0"
description = "Test service used by the svcd qtest."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-testsvc"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../rt", features = ["alloc"] }

[lints]
workspace = true
