#
# The release driver table: virtio-net for the QEMU network and virtio-blk for the optional
# scratch disk. `devd` launches the first matching PCI function, so a boot with the scratch disk
# gets `disk:0` and a boot without it falls through to virtio-net. The release profile stages this
# one file at `/etc/drivers.toml`; no fragment stages a second table.

# QEMU `virtio-blk-pci,drive=scratch,disable-legacy=on`: vendor 0x1af4, device 0x1042.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq"]
cycles = 1

# QEMU `virtio-net-pci,netdev=n0,disable-legacy=on`: vendor 0x1af4, device 0x1041. `serve` keeps
# the frame service alive for netd.
[[driver]]
name = "virtio-net"
vendor = 0x1af4
device = 0x1041
exec = "/sbin/virtio-net"
args = ["bar=4", "resources=dma+irq", "serve"]
cycles = 1
