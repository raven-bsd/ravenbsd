#
# The server image keeps the bootstrap services and the network services
# alive. Test images override these to `never` where a deliberate restart is
# part of the case.

logd_restart="never"
initfsd_restart="never"
ramfsd_restart="never"
nulld_restart="never"
zerod_restart="never"
randd_restart="never"
blockd_restart="never"
fsd_ufs_restart="never"
vfsd_restart="never"
pcid_restart="never"
devd_restart="never"
consd_restart="never"
rsh_restart="never"
netd_restart="never"
resolvd_restart="never"
