# One-shot client that lists /root/etc and reads /root/etc/hostname through vfsd.
name = "k33-probe"
exec = "/sbin/k33-probe"
args = ["k33-probe"]
needs = ["scheme:file"]
readiness = "exit"
restart = "never"
max_restarts = 0
