# The hw qtest boots to a settled state; long-running bootstrap services stay running but never
# restart. root services are one-shot or pinned to "never".

logd_restart="never"
initfsd_restart="never"
ramfsd_restart="never"
nulld_restart="never"
zerod_restart="never"
randd_restart="never"
blockd_restart="never"
fsd_ufs_restart="never"
vfsd_restart="never"
pcid_restart="never"
devd_restart="never"
consd_restart="never"
rsh_restart="never"
