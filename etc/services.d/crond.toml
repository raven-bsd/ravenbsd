# Minimal cron daemon. It reads /var/cron/<user> and spawns jobs through the kernel;
# the image must mount a writable /var/cron (the P4y qtest mounts ramfs there).
name = "crond"
exec = "/sbin/crond"
needs = ["scheme:file"]
readiness = "none"
restart = "on-failure"
