name = "brush"
exec = "/bin/brush"
args = ["brush", "-i", "--input-backend", "minimal", "--rcfile", "/etc/brush/brushrc"]
needs = ["consd", "vfsd", "ramfsd", "initfsd"]
restart = "never"
grants = ["initfs"]

[env]
TERM = "vt100"
