# Socket server. The loopback milestone owns a socket table over the native core and serves the
# `net:` scheme; B12b wires the virtio-net frame ring behind the same interface.
name = "netd"
exec = "/sbin/netd"
needs = ["logd"]
provides = ["scheme:net"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"
