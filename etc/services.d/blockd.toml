# Block-device server.  The default backend is the RAM disk loaded from the
# initial filesystem; a service override can set BLOCKD_DISK=disk:0 to use the
# virtio-blk driver instead (the test profile does exactly that).
name = "blockd"
exec = "/sbin/blockd"
needs = ["scheme:initfs"]
provides = ["scheme:block"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"

[env]
BLOCKD_IMAGE = "initfs:/etc/blockd.img"
