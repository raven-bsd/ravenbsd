# Block-device server.  K14 serves a RAM disk loaded from the initial
# filesystem; K15 replaces the backend with a real storage driver.
name = "blockd"
exec = "/sbin/blockd"
needs = ["scheme:initfs"]
provides = ["scheme:block"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"

[env]
BLOCKD_IMAGE = "initfs:/etc/blockd.img"
