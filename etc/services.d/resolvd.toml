# DNS resolver service.  It reads the static `/etc/resolv.conf`; DHCP lease
# application waits for the B12b/B12c netd seam.
name = "resolvd"
exec = "/sbin/resolvd"
needs = ["scheme:net", "scheme:initfs"]
provides = ["scheme:resolv"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"
