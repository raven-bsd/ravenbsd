# DNS resolver service. A static `/etc/resolv.conf` nameserver list wins;
# otherwise the service applies the live DHCP lease from netd, writes the
# lease DNS servers to the runtime resolv.conf and refreshes from the lease
# timers.
name = "resolvd"
exec = "/sbin/resolvd"
needs = ["scheme:net", "scheme:initfs"]
provides = ["scheme:resolv"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"
