# Minimal at daemon. It reads /var/at and spawns due jobs through the kernel; the image must
# mount a writable /var/at (the P40 qtest mounts ramfs there).
name = "atd"
exec = "/sbin/atd"
needs = ["scheme:file"]
readiness = "none"
restart = "on-failure"
