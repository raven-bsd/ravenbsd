# Device manager. Matches `pci:` devices against `/etc/drivers.toml`, launches each driver with a
# BAR MMIO grant, and serves the `dev:` scheme.
name = "devd"
exec = "/sbin/devd"
args = ["devd"]
needs = ["scheme:pci"]
provides = ["scheme:dev"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "on-failure"
