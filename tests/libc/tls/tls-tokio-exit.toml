# S188 shell-shape discriminator: the current-thread Tokio runtime (the shell cfg on RavenBSD),
# main-thread thread_local!, exit(0). A panic with the AccessError here means the libc exit ordering
# owns the brush failure; a clean run points at the shell's call path. The multi-thread builder
# faults earlier in the tokio blocking-pool thread spawn (0x40f121, cr2=0) and is not the shell shape.

name = "tls-tokio-exit"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/tls/build-tokio.sh x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^TOKIO188: main tls set$'

[[expect]]
regex = '^TOKIO188: runtime idle, exit$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic'
