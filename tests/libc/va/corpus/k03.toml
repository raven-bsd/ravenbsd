#
# The 57 differential cases of the K03 spike (libc/spike/va/tests/variadic.rs),
# copied as DATA. The spike is the project's own BSD-3-Clause code (K03, same author);
# its printf is NOT reused: every case runs through the real engine (C43 + C42) and the
# reference is the host glibc snprintf, called from a generated C driver.
#
# Grammar (parsed by tests/k03_corpus.rs): one [[case]] per case; `args` is a list of
# `i32:N`, `u32:N`, `i64:N`, `u64:N`, `f64:0x<bits>`, `str:TEXT`, `null:str`, `null:ptr`,
# `ptr:0xN`; an optional `exclude = "reason"` documents a C43/glibc difference.
schema = 1

