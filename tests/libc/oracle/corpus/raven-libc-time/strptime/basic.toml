# C44 defect: the Rust `finish` loop runs past the last month start when
# `%U`/`%W` week finalisation produces a yday above 365, and never returns.
# The C oracle returns a normalised 2028 date. This is the minimal reproducer.
[[case]]
text = "53 5 2028"
format = "%U %w %Y"
