#
# The C44 strftime matrix. `%P`, `^` and `#` are RD-28 extensions that the
# pinned donor does not implement; they are covered by the crate unit tests.
# `%w` and `%u` are included here and expose the C44 padding divergence.

[[case]]
zone = "UTC0"
year = 1970
mon = 0
mday = 1
hour = 0
min = 0
sec = 0
wday = 4
yday = 0
isdst = 0
gmtoff = 0
format = "%Y"
size = 128

