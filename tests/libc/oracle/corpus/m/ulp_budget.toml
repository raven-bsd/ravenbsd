# Measured ULP budget of raven-libc-m against the musl C ancestor (see tests/diff_m_core.rs).
# A zero means bit-exact. The values are the measured maxima of the default calibration run
# (20 seeds x 10,000 cases per function) quoted in the C47a report; they are a measurement, not a
# tolerance chosen to make the test pass.

