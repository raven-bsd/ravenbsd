#
# K03 corpus (ticket C43 section 7.2, layer G): the 57 check! cases of
# ravenbsd/libc/spike/va/tests/variadic.rs, converted to (format, argument
# classes). The spike code is not used; only its corpus idea and values are
# reproduced here. The differential run lives in
# tests/libc/oracle/tests/diff_fmt_freebsd.rs; this file is the committed
# record for C70 (printf_format fuzz) and for the report mapping.
#
# Argument classes: i = i32/i64/u32/u64 word, d = double, p = pointer,
# n = null pointer, s = C string. The expected bytes are produced by the C
# oracle at test time, never typed here.

schema = 1
corpus = "fmt-k03"

[[case]]
group = "strings"
format = "hello"
args = []

[[case]]
group = "strings"
format = "%%"
args = []

[[case]]
group = "strings"
