[package]
name = "raven-libc-oracle"
version = "0.1.0"
description = "Differential libc oracle harness: generators, corpus, shrinking and mutation drills."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
raven-libc-ctype = { path = "../../../libc/ravenlibc/crates/raven-libc-ctype" }
raven-libc-str = { path = "../../../libc/ravenlibc/crates/raven-libc-str" }
raven-libc-stdlib = { path = "../../../libc/ravenlibc/crates/raven-libc-stdlib" }
raven-libc-dtoa = { path = "../../../libc/ravenlibc/crates/raven-libc-dtoa", features = ["alloc"] }
raven-libc-fmt = { path = "../../../libc/ravenlibc/crates/raven-libc-fmt" }
raven-libc-time = { path = "../../../libc/ravenlibc/crates/raven-libc-time" }
raven-libc-m = { path = "../../../libc/ravenlibc/crates/raven-libc-m" }

[features]
default = []
oracle-string-basic = []
oracle-ctype-multibyte = []
oracle-ctype-class = []
oracle-str-mem = []
oracle-str-openbsd = []
oracle-str-freebsd = []
oracle-str-musl = []
oracle-str-errmsg = []
oracle-stdlib-netbsd = []
oracle-stdlib-openbsd = []
oracle-stdlib-freebsd = []
oracle-stdlib-musl = []
oracle-dtoa = []
oracle-m-core = []
oracle-dtoa-ld128 = []
oracle-fmt-freebsd = []
oracle-fmt-musl = []
oracle-fmt-musl-scanf = []
oracle-raven-libc-time = []
all-oracles = [
    "oracle-string-basic",
    "oracle-ctype-multibyte",
    "oracle-ctype-class",
    "oracle-str-mem",
    "oracle-str-openbsd",
    "oracle-str-freebsd",
    "oracle-str-musl",
    "oracle-str-errmsg",
    "oracle-stdlib-netbsd",
    "oracle-stdlib-openbsd",
    "oracle-stdlib-freebsd",
    "oracle-stdlib-musl",
    "oracle-dtoa",
    "oracle-m-core",
    "oracle-dtoa-ld128",
    "oracle-fmt-freebsd",
    "oracle-fmt-musl",
    "oracle-fmt-musl-scanf",
    "oracle-raven-libc-time",
]

[lints]
workspace = true
