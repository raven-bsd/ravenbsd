[package]
name = "raven-libc-oracle"
version = "0.1.0"
description = "Differential libc oracle harness: generators, corpus, shrinking and mutation drills."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"

[features]
default = []
oracle-string-basic = []
all-oracles = ["oracle-string-basic"]

[lints]
workspace = true
