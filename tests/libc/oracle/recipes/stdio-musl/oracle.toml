#
# stdio-musl: the musl FILE core compiled against the replacement headers of shim/stdio/musl.
# Every system call is forwarded to the Rust harness, so the C original and the Rust subject
# run over the same in-memory file system. The closure is the narrow FILE surface; the wide
# and process halves are excluded (see the report).

schema = 1
family = "stdio-musl"
description = "musl FILE core (buffering, locks, open-file list, memory and cookie streams)"
exports = [
    "__do_orphaned_stdio_locks",
    "__fbufsize",
    "__fdopen",
    "__flbf",
    "__fmodeflags",
    "__fpending",
    "__fpurge",
    "__freadable",
    "__freadahead",
    "__freading",
    "__freadptr",
    "__freadptrinc",
    "__fseeko",
    "__fseeko_unlocked",
    "__fseterr",
    "__fsetlocking",
    "__ftello",
    "__ftello_unlocked",
    "__fwritable",
    "__fwritex",
    "__fwriting",
    "__lockfile",
    "__ofl_add",
    "__ofl_lock",
    "__ofl_unlock",
    "__overflow",
    "__register_locked_file",
    "__stdio_close",
    "__stdio_ofl_lockptr",
    "__stdio_read",
    "__stdio_seek",
    "__stdio_write",
    "__stdout_write",
    "__toread",
    "__toread_needs_stdio_exit",
    "__towrite",
    "__towrite_needs_stdio_exit",
    "__uflow",
    "__unlist_locked_file",
    "__unlockfile",
    "_flushlbf",
    "clearerr",
    "fclose",
    "feof",
    "ferror",
    "fflush",
    "fgetc",
    "fgetpos",
    "fgets",
    "fileno",
    "flockfile",
    "fmemopen",
    "fopen",
    "fputc",
    "fputs",
    "fread",
    "freopen",
    "fseek",
    "fsetpos",
    "ftell",
    "ftrylockfile",
    "funlockfile",
    "fwrite",
    "getc",
    "getc_unlocked",
    "getdelim",
    "getline",
    "open_memstream",
    "putc",
    "putc_unlocked",
    "rewind",
    "rl_stdio_hooks",
    "setbuf",
    "setbuffer",
    "setlinebuf",
    "setvbuf",
    "ungetc",
]
opt = ["O2", "O0"]
defines = ["_GNU_SOURCE"]
include = [
    "shim:stdio/musl",
    "donor:musl/src/internal",
]
flags = []

