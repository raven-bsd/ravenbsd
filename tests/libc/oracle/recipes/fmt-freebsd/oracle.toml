#
# fmt-freebsd: the FreeBSD printf conversion logic (vfprintf.c, printf-pos.c,
# snprintf.c, vsnprintf.c, swprintf.c, vswprintf.c, vfwprintf.c) linked with the
# NetBSD gdtoa digit engine that C42 also ports. The point of the family is the
# printf layout logic, so the digits come from the same gdtoa on both sides.
# The shim provides the private FILE image, the xlocale entry points and the
# string-stream __sfvwrite; see shim/fmt/README.md.

schema = 1
family = "fmt-freebsd"
description = "FreeBSD printf/wide-printf layout over the NetBSD gdtoa digit engine"
exports = [
    "_FLOCKFILE",
    "__Balloc_D2A",
    "__Bfree_D2A",
    "__ULtod_D2A",
    "__any_on_D2A",
    "__b2d_D2A",
    "__bigtens_D2A",
    "__cmp_D2A",
    "__copybits_D2A",
    "__d2b_D2A",
    "__decrement_D2A",
    "__diff_D2A",
    "__dtoa",
    "__dtoa_result_D2A",
    "__fflush",
    "__find_arguments",
    "__find_warguments",
    "__fputwc",
    "__freedtoa",
    "__gdtoa",
    "__gethex_D2A",
    "__hdtoa",
    "__hexdig_D2A",
    "__hexdig_init_D2A",
    "__hexnan_D2A",
    "__hi0bits_D2A",
    "__hldtoa",
    "__i2b_D2A",
    "__increment_D2A",
    "__ldtoa",
    "__lo0bits_D2A",
    "__lshift_D2A",
    "__match_D2A",
    "__mult_D2A",
    "__multadd_D2A",
    "__nrv_alloc_D2A",
    "__pow5mult_D2A",
    "__quorem_D2A",
    "__ratio_D2A",
    "__rshift_D2A",
    "__rv_alloc_D2A",
    "__s2b_D2A",
    "__set_ones_D2A",
    "__sflags",
    "__sflush",
    "__sfvwrite",
    "__stdio_cancel_cleanup",
    "__strcp_D2A",
    "__strtodg_D2A",
    "__strtopQ_D2A",
    "__strtopx_D2A",
    "__strtord_D2A",
    "__sum_D2A",
    "__swsetup",
    "__tens_D2A",
    "__tinytens_D2A",
    "__trailz_D2A",
    "__ulp_D2A",
    "__vfprintf",
    "__vfwprintf",
    "__xvprintf",
    "fegetround",
    "snprintf",
    "snprintf_l",
    "strtod",
    "strtod_l",
    "strtof",
    "strtof_l",
    "strtold",
    "strtold_l",
    "swprintf",
    "swprintf_l",
    "vfprintf",
    "vfprintf_l",
    "vfwprintf",
    "vfwprintf_l",
    "vsnprintf",
    "vsnprintf_l",
    "vswprintf",
    "vswprintf_l",
]
opt = ["O2", "O0"]
defines = [
    "_GNU_SOURCE",
    "Honor_FLT_ROUNDS",
    "__HAVE_LONG_DOUBLE=1",
    "GDTOA_LD_FMT=x",
    "__weakref_visible=",
    "__weak_reference(x)=",
    "__libc_fegetround_ref=fegetround",
    "__unused=",
    "__UNCONST(a)=((char*)(a))",
]
include = [
    "shim:fmt",
    "shim:gdtoa",
    "donor:freebsd/lib/libc/stdio",
    "donor:freebsd/lib/libc/include",
    "donor:freebsd/lib/libc/locale",
    "donor:freebsd/contrib/gdtoa",
    "donor:netbsd/lib/libc/gdtoa",
    "donor:netbsd/lib/libc/arch/x86_64/gdtoa",
]
flags = []

