#
# m-ld: the FreeBSD lib/msun `*l` C originals behind the raven-libc-m long-double functions.
# The C is built as an external oracle (never into a shipped artifact); the RD-33 hidden-pointer
# mapping lives in shim/m/ld_thunk.c. It covers exp/log, trig, hyperbolic, erf/gamma and the
# exact-class functions.

schema = 1
family = "m-ld"
description = "FreeBSD msun long-double originals (exp, log, trig, hyperbolic, erf/gamma, exact)"
exports = ["__isfinite", "__isfinitef", "__isfinitel", "__kernel_cosl", "__kernel_rem_pio2", "__kernel_sinl", "__kernel_tanl", "acoshl", "asinhl", "atanhl", "ceill", "copysignl", "coshl", "cosl", "cospil", "erfcl", "erfl", "expl", "expm1l", "fabsl", "fdim", "fdimf", "fdiml", "floor", "floorl", "fmaxl", "fminl", "fmodl", "ldexpl", "lgammal_r", "log10l", "log1pl", "log2l", "logl", "nextafterl", "nexttowardl", "remainderl", "remquol", "rintl", "rl_acoshl", "rl_asinhl", "rl_atanhl", "rl_ceill", "rl_copysignl", "rl_coshl", "rl_cosl", "rl_erfcl", "rl_erfl", "rl_expl", "rl_expm1l", "rl_fdiml", "rl_floorl", "rl_fmaxl", "rl_fminl", "rl_fmodl", "rl_lgammal_r", "rl_log10l", "rl_log1pl", "rl_log2l", "rl_logl", "rl_nextafterl", "rl_nexttowardl", "rl_remainderl", "rl_remquol", "rl_rintl", "rl_roundl", "rl_scalbnl", "rl_sinhl", "rl_sinl", "rl_tanhl", "rl_tanl", "rl_tgammal", "rl_truncl", "roundl", "scalbnl", "sinhl", "sinl", "sinpil", "sqrtl", "tanhl", "tanl", "tgammal", "truncl"]
opt = ["O2", "O0"]
aliases = { machine = "donor:freebsd/sys/amd64/include", x86 = "donor:freebsd/sys/x86/include" }
defines = ["DBL_MAX_EXP=1024", "DBL_MIN_EXP=-1021", "FLT_EVAL_METHOD=0", "__weak_reference(a,b)=", "__pure2=__attribute__((__pure__))", "LDBL_MANT_DIG=64", "LDBL_MAX_EXP=16384", "LDBL_MIN=3.3621031431120935063E-4932L", "LDBL_MIN_EXP=-16381"]
include = ["shim:m", "donor:freebsd/lib/msun/src", "donor:freebsd/lib/msun/ld80", "donor:freebsd/lib/libc/include", "donor:freebsd/lib/libc/amd64", "donor:freebsd/sys", "donor:freebsd/sys/amd64/include", "donor:freebsd/sys/x86/include", "donor:freebsd/sys/sys", "donor:freebsd/include"]
flags = ["-std=gnu11"]

