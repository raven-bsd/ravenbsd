#
# stdlib-freebsd: the AVL tsearch family, hsearch_r, realpath1 and basename/dirname.
# The OpenBSD strlcpy/strlcat sources are included because the host libc has no strlcpy
# (RD-new 3: one merged object); the realpath fast path is disabled by the libsys.h shim.

schema = 1
family = "stdlib-freebsd"
description = "FreeBSD AVL search, hsearch_r, realpath1 and libgen basename/dirname"
exports = [
  "__xpg_basename",
  "dirname",
  "hcreate",
  "hcreate_r",
  "hdestroy",
  "hdestroy_r",
  "hsearch",
  "hsearch_r",
  "realpath",
  "strlcat",
  "strlcpy",
  "tdelete",
  "tdestroy",
  "tfind",
  "tsearch",
  "twalk",
]
opt = ["O2", "O0"]
defines = ["_SEARCH_PRIVATE", "_GNU_SOURCE", "__ssp_real(x)=x", "__unused=", "__unused2=", "__noinline=__attribute__((noinline))", "__DECONST(type,var)=(type)(var)", "arc4random_buf(p,n)=__builtin_memset((p),0,(n))"]
include = ["shim:stdlib-freebsd"]
flags = []

[[source]]
donor = "freebsd"
path = "lib/libc/stdlib/tsearch.c"

[[source]]
donor = "freebsd"
path = "lib/libc/stdlib/tdelete.c"

[[source]]
donor = "freebsd"
path = "lib/libc/stdlib/tfind.c"

