schema = 1
family = "stdlib-musl"
description = "musl drand48/erand48/lrand48/nrand48/mrand48/jrand48/srand48/seed48/lcong48"
exports = [
  "__rand48_step",
  "__seed48",
  "drand48",
  "erand48",
  "jrand48",
  "lcong48",
  "lrand48",
  "mrand48",
  "nrand48",
  "seed48",
  "srand48",
]
opt = ["O2", "O0"]
defines = ["hidden="]
include = []
flags = []

[[source]]
donor = "musl"
path = "src/prng/drand48.c"

