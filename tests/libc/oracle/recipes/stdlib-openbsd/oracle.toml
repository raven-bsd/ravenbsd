# stdlib-openbsd: strtol/strtoul/strtonum, qsort/heapsort/mergesort/bsearch, getopt_long,
# getsubopt and a64l/l64a. All donors are BSD-3/ISC/PD; the gate re-reads each header.

schema = 1
family = "stdlib-openbsd"
description = "OpenBSD integer conversion, array sorting/searching, getopt_long, getsubopt and a64l"
exports = [
  "a64l",
  "bsearch",
  "getopt",
  "getopt_long",
  "getopt_long_only",
  "getsubopt",
  "heapsort",
  "l64a",
  "mergesort",
  "optarg",
  "opterr",
  "optind",
  "optopt",
  "optreset",
  "qsort",
  "strtol",
  "strtonum",
  "strtoul",
  "suboptarg",
]
opt = ["O2", "O0"]
defines = []
include = []
flags = []

