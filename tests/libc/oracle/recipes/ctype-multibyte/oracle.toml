# ctype-multibyte: the 20 code files of musl:src/multibyte (MIT via musl/COPYRIGHT).
# The private locale_impl.h is replaced by the shim, whose `mb_cur_max` is settable at runtime.

schema = 1
family = "ctype-multibyte"
description = "musl multibyte codec originals, both MB_CUR_MAX modes"
exports = ["__fsmu8", "btowc", "c16rtomb", "c32rtomb", "mblen", "mbrlen", "mbrtoc16", "mbrtoc32", "mbrtowc", "mbsinit", "mbsnrtowcs", "mbsrtowcs", "mbstowcs", "mbtowc", "wcrtomb", "wcsnrtombs", "wcsrtombs", "wcstombs", "wctob", "wctomb"]
opt = ["O2", "O0"]
defines = ["hidden=", "weak_alias(a,b)=", "_LOCALE_IMPL_H=1", "_FORTIFY_SOURCE=0"]
include = ["donor:musl/src/multibyte", "donor:musl/src/internal"]
flags = []

