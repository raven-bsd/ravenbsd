# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026, Bo Maryniuk and RavenBSD contributors
#
# m-core: the musl:src/math originals behind the raven-libc-m transcendental families.
# musl is MIT (tier A) and is the C donor of the libm algorithms the Rust crate was transpiled
# from, so the differential is expected to be bit-exact; a mismatch is a real deviation.
#
# erfc/erfc f32, y0/y1/yn and rsqrt/sinpi have no musl source in the pinned donor checkout and are
# therefore not part of this family (see the C47a report).

schema = 1
family = "m-core"
description = "musl double/float transcendental originals"
exports = [
    "__cosdf", "__exp2f_data", "__exp_data", "__expo2", "__expo2f", "__log2_data",
    "__log2f_data", "__log_data", "__logf_data", "__math_divzero", "__math_divzerof",
    "__math_invalid", "__math_invalidf", "__math_oflow", "__math_oflowf", "__math_uflow",
    "__math_uflowf", "__math_xflow", "__math_xflowf", "__pow_log_data", "__powf_log2_data",
    "__rem_pio2", "__rem_pio2_large", "__rem_pio2f", "__rsqrt_tab", "__sindf", "__tandf",
    "acos", "acosf", "acosh", "acoshf", "asin", "asinf", "asinh", "asinhf", "atan", "atan2",
    "atan2f", "atanf", "atanh", "atanhf", "cos", "cosf", "cosh", "coshf", "erf", "erfc",
    "erfcf", "erff", "exp", "exp10", "exp10f", "exp2", "exp2f", "expf", "expm1", "expm1f",
    "fabs", "fabsf", "floor", "floorf", "j0", "j0f", "j1", "j1f", "jn", "jnf", "log", "log10",
    "log10f", "log1p", "log1pf", "log2", "log2f", "logf", "m_cos", "m_sin", "m_tan", "pow",
    "powf", "sin", "sinf", "sinh", "sinhf", "sqrt", "sqrtf", "tan", "tanf", "tanh", "tanhf",
    "y0", "y0f", "y1", "y1f", "yn", "ynf",
]
opt = ["O2", "O0"]
defines = ["weak_alias(a,b)=", "hidden=", "_GNU_SOURCE=1"]
include = ["shim:m", "donor:musl/src/math", "donor:musl/src/internal", "donor:musl/arch/x86_64", "donor:musl/arch/generic"]
flags = ["-std=gnu11"]

