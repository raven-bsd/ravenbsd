# str-openbsd: every OpenBSD string COPY row of donor-map/01 section 5.2. The donors are BSD-3,
# ISC or public domain; the gate re-reads each header at build time.

schema = 1
family = "str-openbsd"
description = "OpenBSD string.h/strings.h implementations (mem*, str*, tokenising, strmode, ffs, timingsafe, swab)"
exports = [
  "bcmp",
  "bzero",
  "ffs",
  "ffsl",
  "ffsll",
  "memccpy",
  "memmem",
  "memrchr",
  "strcasecmp",
  "strcasecmp_l",
  "strcasestr",
  "strcat",
  "strcmp",
  "strcoll",
  "strcoll_l",
  "strcpy",
  "strcspn",
  "strlcat",
  "strlcpy",
  "strmode",
  "strncasecmp",
  "strncasecmp_l",
  "strncat",
  "strncmp",
  "strncpy",
  "strpbrk",
  "strsep",
  "strspn",
  "strstr",
  "strtok",
  "strtok_r",
  "strxfrm",
  "strxfrm_l",
  "swab",
  "timingsafe_bcmp",
  "timingsafe_memcmp",
]
opt = ["O2", "O0"]
defines = ["_GNU_SOURCE"]
include = []
flags = []

