schema = 1
family = "ctype-class"
description = "musl ctype/wctype/wcwidth originals"
exports = ["__isalnum_l", "__isalpha_l", "__isblank_l", "__iscntrl_l", "__isdigit_l", "__isgraph_l", "__islower_l", "__isprint_l", "__ispunct_l", "__isspace_l", "__isupper_l", "__iswalnum_l", "__iswalpha_l", "__iswblank_l", "__iswcntrl_l", "__iswctype_l", "__iswdigit_l", "__iswgraph_l", "__iswlower_l", "__iswprint_l", "__iswpunct_l", "__iswspace_l", "__iswupper_l", "__iswxdigit_l", "__isxdigit_l", "__tolower_l", "__toupper_l", "__towctrans_l", "__towlower_l", "__towupper_l", "__wctrans_l", "__wctype_l", "isalnum", "isalpha", "isascii", "isblank", "iscntrl", "isdigit", "isgraph", "islower", "isprint", "ispunct", "isspace", "isupper", "iswalnum", "iswalpha", "iswblank", "iswcntrl", "iswctype", "iswdigit", "iswgraph", "iswlower", "iswprint", "iswpunct", "iswspace", "iswupper", "iswxdigit", "isxdigit", "toascii", "tolower", "toupper", "towctrans", "towlower", "towupper", "wcswidth", "wctrans", "wctype", "wcwidth"]
opt = ["O2", "O0"]
defines = ["weak_alias(a,b)=", "__NO_CTYPE=1", "_POSIX_C_SOURCE=200112L", "locale_t=void*", "_FORTIFY_SOURCE=0"]
include = ["donor:musl/src/ctype"]
flags = ["-std=gnu99"]

