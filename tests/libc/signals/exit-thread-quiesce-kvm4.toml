#
# S194: K445-like KVM4 run. One thread calls exit(0) while a sibling loops on a thread_local!,
# and init must exit with the probe status at four vCPUs under KVM.

name = "exit-thread-quiesce-kvm4"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/signals/build-exit-thread.sh x86_64"]
initfs = "build/fixtures/exit-thread-quiesce/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^QUIESCE: worker ready$'

[[expect]]
regex = '^QUIESCE: main exit$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic|QUIESCE: worker survived'
