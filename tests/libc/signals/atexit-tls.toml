#
# K571/S188: the exit order. An atexit handler reads a thread_local!. It must run while the TLS
# block is addressable; the libc runs the handler before any TLS destruction.

name = "atexit-tls"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/signals/build-atexit.sh x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^MAIN-TLS value=7$'

[[expect]]
regex = '^MAIN-TLS atexit=0$'

[[expect]]
regex = '^ATEXIT-TLS value=7$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic'
