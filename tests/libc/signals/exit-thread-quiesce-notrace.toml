#
# S194: K445-like no-trace run. Four vCPUs (TCG), one-shot svcd, init must exit with the probe.
# No s194-trace boot flag, so this exercises the exit path with no diagnostic serial output.

name = "exit-thread-quiesce-notrace"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/signals/build-exit-thread.sh x86_64"]
initfs = "build/fixtures/exit-thread-quiesce/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^QUIESCE: worker ready$'

[[expect]]
regex = '^QUIESCE: main exit$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic|QUIESCE: worker survived'
