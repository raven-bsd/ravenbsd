#
# S194: the Rust libc crate's RavenBSD struct sigaction is 24 bytes; the C ABI and ravenlibc are
# 152 bytes. A query must not write past the caller object and an install must not be rejected.

name = "sigaction-abi"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/signals/build-sigaction-abi.sh x86_64"]
initfs = "build/fixtures/sigaction-abi/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^SIGACTION-ABI: small=24 full=152$'

[[expect]]
regex = '^SIGACTION-ABI: pass$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic|SIGACTION-ABI: FAIL'
