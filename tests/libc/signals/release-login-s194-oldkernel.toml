#
# S194 diagnostic: the current release initfs on the pre-merge kernel 773a02f5a. If the shell
# still panics here, the defect is in the userland signal/libc changes; if it passes, it is in
# the kernel changes after 773a02f5a.

name = "release-login-s194-oldkernel"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 300
pre = ["true"]
initfs = "build/fixtures/s194-release/initfs.img"
loader_kernel = "/tmp/opencode/s194-oldk-target/x86_64-unknown-none/release/raven-kernel"
boot_cmdline = "console=ttyS0 test-exit=1 s194-trace=1"
qemu_extra = [
    "-smp", "4",
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 300

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = ""
delay_ms = 2000

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
