#
# S194 diagnostic: a sibling thread initialises a thread_local!, exits, and main reads the same
# key. The keys are per-thread; the sibling's destructor must not destroy main's state.

name = "tls-sibling-exit"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/libc/signals/build-tls-sibling.sh x86_64"]
initfs = "build/fixtures/tls-sibling-exit/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^SIBLING: main before value=41$'

[[expect]]
regex = '^SIBLING: worker value=11$'

[[expect]]
regex = '^SIBLING: main after value=41$'

[[expect]]
regex = '^SIBLING: pass$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic'
