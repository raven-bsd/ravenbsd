#
# S194 diagnostic: the release image with the same brush but mask_sigttou installed through the
# 152-byte C sigaction layout. If the AccessError disappears, the 24-byte Rust libc layout is the
# cause; if not, it is elsewhere. The initfs is prebuilt in build/fixtures/s194-fixsig.

name = "release-login-s194-fixsig"
arch = "x86_64"
profile = "release"
timeout_secs = 300
pre = ["true"]
initfs = "build/fixtures/s194-fixsig/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-smp", "4",
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^/root$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)AccessError|EXCEPTION|page fault|panic'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 300

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = ""
delay_ms = 2000

[[step]]
send = "cd && pwd\n"
delay_ms = 100

[[step]]
wait = '^/root$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
