[package]
name = "raven-posix-fs"
version = "0.1.0"
description = "P5 POSIX filesystem behaviour fixture for vfsd/ramfsd."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-posix-fs"
path = "src/main.rs"

[[bin]]
name = "raven-posix-fs-smp"
path = "src/bin/smp.rs"

[[bin]]
name = "raven-posix-fs-start"
path = "src/bin/start.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }

[lints]
workspace = true
