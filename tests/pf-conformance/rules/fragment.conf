# Fragment reassembly fixture. OpenBSD pf_norm.c:pf_reassemble queues
# incomplete fragments (returns PF_PASS with *m0 == NULL) and filters the
# reassembled datagram once. raven-pf at a426dee0 has no fragment model.
set default block
scrub in on eth0 all fragment reassemble
pass in on eth0 proto tcp from any to any port 80 keep state
