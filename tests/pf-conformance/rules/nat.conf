# Source-NAT fixture. OpenBSD pf.conf(5) TRANSLATION: translation runs before
# filtering, so the pass rule after `nat` matches the translated source.
# raven-pf at a426dee0 has no NAT; K273/K274 implement it.
set default block
nat on eth0 from 10.0.0.0/24 to any -> 203.0.113.5 static-port
pass out on eth0 proto any from 203.0.113.5 to any keep state
