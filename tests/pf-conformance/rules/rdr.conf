# Redirect fixture. OpenBSD pf.conf(5) TRANSLATION: translation runs before
# filtering, so the pass rule after `rdr` matches the translated destination.
# raven-pf at a426dee0 has no rdr; K273/K274 implement it.
set default block
rdr on eth0 proto tcp from any to 203.0.113.5 port 80 -> 10.0.0.80 port 8080
pass in on eth0 proto tcp from any to 10.0.0.80 port 8080 keep state
