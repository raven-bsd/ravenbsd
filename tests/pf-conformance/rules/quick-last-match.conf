# Last-match-wins and quick matrix. `no state` keeps rule selection visible.
set default block
pass in on eth0 proto tcp from any to any port 80 no state
block in on eth0 proto tcp from 10.0.0.9 to any
pass in on eth0 proto tcp from any to any no state
pass quick in on eth0 proto tcp from 10.0.0.10 to any port 22 no state
block in on eth0 proto tcp from any to any port 22
