#
# Negative fragmentation fixture without scrub. OpenBSD pf.c:pf_match_rule
# sets virtual_proto=PF_VPROTO_FRAGMENT and skips every rule that names a
# port or TCP flag, so a port-80 pass rule cannot admit a fragment. The
# default block applies; this is the fail-closed case.
set default block
pass in on eth0 proto tcp from any to any port 80 keep state
