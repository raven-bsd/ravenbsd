[package]
name = "raven-tcpip-sim"
version = "0.1.0"
description = "Deterministic host network simulator and trace recorder for the RavenBSD TCP/IP stack."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
raven-tcpip = { path = "../../crates/raven-tcpip", features = ["testutil"] }
raven-tcpip-wire = { path = "../../crates/raven-tcpip-wire" }
raven-abi = { path = "../../crates/raven-abi" }
raven-prng = { path = "../../crates/raven-prng" }
