[package]
name = "raven-tls-client"
version = "0.1.0"
description = "One-shot TLS client smoke for the OpenSSL add-on."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-tls-client"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-net = { path = "../../../crates/raven-proto-net" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-tls = { path = "../../../crates/raven-tls" }

[lints]
workspace = true
