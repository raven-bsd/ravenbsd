[package]
name = "raven-user-image"
version = "0.1.0"
description = "U5 user-tools qtest fixture init: writable ramfs /etc and the seven tools."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.raven]
target = "none"

[[bin]]
name = "user-image-init"
path = "src/init.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
