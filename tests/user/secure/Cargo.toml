[package]
name = "raven-user-secure-tests"
version = "0.1.0"
description = "U3e adversarial credential-transition tests for su and passwd."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"
publish = false

[workspace]
members = [".", "fixture"]
resolver = "3"

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1

[dev-dependencies]
passwd = { path = "../../../userland/bin/passwd" }
raven-abi = { path = "../../../crates/raven-abi" }
raven-auth = { path = "../../../crates/raven-auth" }
raven-userdb = { path = "../../../crates/raven-userdb" }
su = { path = "../../../userland/bin/su" }
