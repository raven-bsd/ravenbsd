[package]
name = "raven-user-secure-fixture"
version = "0.1.0"
description = "U3e target fixture: setuid su/passwd credential-transition probes."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"
publish = false

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-user-secure-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-user-secure-runner"
path = "src/bin/runner.rs"

[[bin]]
name = "raven-user-secure-shell"
path = "src/bin/shell.rs"

[[bin]]
name = "raven-user-secure-probe"
path = "src/bin/probe.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }
