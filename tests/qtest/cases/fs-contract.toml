name = "fs-contract"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/k66-fs/build.sh"]
initfs = "build/fixtures/k66-fs/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^k66-fs: contract ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
