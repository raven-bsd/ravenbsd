[package]
name = "raven-s45-fault"
version = "0.1.0"
description = "S45 fixture: user faults delivered as FaultRecord, SIGRETURN PC rewrite and default SIGSEGV status."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s45-fault"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
