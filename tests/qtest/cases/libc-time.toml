name = "libc-time"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 240
pre = ["sh tests/libc/target/build.sh time x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^libc-time: start$'

[[expect]]
regex = '^libc-time: clocks ok$'

[[expect]]
regex = '^libc-time: sleep ok$'

[[expect]]
regex = '^libc-time: gmtime ok$'

[[expect]]
regex = '^libc-time: timegm ok$'

[[expect]]
regex = '^libc-time: localtime ok$'

[[expect]]
regex = '^libc-time: strftime ok$'

[[expect]]
regex = '^libc-time: strptime ok$'

[[expect]]
regex = '^libc-time: time ok$'

[[expect]]
regex = '^libc-time: clock ok$'

[[expect]]
regex = '^libc-time: difftime ok$'

# needs PG-17
# [[expect]]
# regex = '^libc-time: abstime ok$'

# needs PG-18
# [[expect]]
# regex = '^libc-time: cputime ok$'

[[expect]]
regex = '^libc-time: done$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-[a-z]+: FAIL'
