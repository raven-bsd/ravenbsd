# P4d: POSIX system/process utility behaviour in a shell guest. The case builds a
# minimal initfs (core services plus only the tools under test) so initfsd stays
# inside its readiness window. This is a host/QEMU test, not a board or release
# claim.

name = "posix-util-system"
arch = "x86_64"
profile = "base"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
pre = ["sh tests/posix/utility/system/build.sh"]
initfs = "build/posix/utility/system/initfs.img"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'
unordered = true

[[expect]]
regex = '^rsh: ready$'
unordered = true

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|rsh: .*command not found'

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "id\n"
delay_ms = 100

[[step]]
wait = '^uid=0\(root\) gid=0\(root\) groups=0\(root\)$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -u\n"
delay_ms = 100

[[step]]
wait = '^0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -un\n"
delay_ms = 100

[[step]]
wait = '^root$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -g\n"
delay_ms = 100

[[step]]
wait = '^0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -gn\n"
delay_ms = 100

[[step]]
wait = '^root$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -G\n"
delay_ms = 100

[[step]]
wait = '^0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id -Gn\n"
delay_ms = 100

[[step]]
wait = '^root$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id root\n"
delay_ms = 100

[[step]]
wait = '^uid=0\(root\) gid=0\(root\) groups=0\(root\)$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "id nosuchuser\n"
delay_ms = 100

[[step]]
wait = '^id: nosuchuser: no such user$'
timeout_secs = 30

[[step]]
send = "echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^status=1$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ps\n"
delay_ms = 100

[[step]]
wait = '^logd running [0-9]+$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ps --json\n"
delay_ms = 100

[[step]]
wait = '^\{"schema":1,"kind":"process","pid":null,"ppid":null,"uid":null,"gid":null,"state":"[a-z-]+","name":"[a-z0-9-]+","command":null,"threads":null,"rss_bytes":null\}$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ps --selftest\n"
delay_ms = 100

[[step]]
wait = '^ps: selftest ok$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -n\n"
delay_ms = 100

[[step]]
wait = '^raven$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -m\n"
delay_ms = 100

[[step]]
wait = '^x86_64$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -s\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -r\n"
delay_ms = 100

[[step]]
wait = '^0\.1$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -v\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD 0\.1 \(BASE\) #1: .*$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "uname -a\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD raven 0\.1 .* x86_64$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "hostname\n"
delay_ms = 100

[[step]]
wait = '^raven$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "hostname --selftest\n"
delay_ms = 100

[[step]]
wait = '^hostname: selftest ok$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "env\n"
delay_ms = 100

[[step]]
wait = '^PATH=/bin:/sbin$'
timeout_secs = 30

[[step]]
wait = '^HOME=/$'
timeout_secs = 30

[[step]]
wait = '^USER=root$'
timeout_secs = 30

[[step]]
wait = '^SHELL=/bin/rsh$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export P4D=ok\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "env\n"
delay_ms = 100

[[step]]
wait = '^P4D=ok$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "whoami\n"
delay_ms = 100

[[step]]
wait = '^root$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "whoami extra; echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^usage: whoami$'
timeout_secs = 30

[[step]]
wait = '^status=2$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
