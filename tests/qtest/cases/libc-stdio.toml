name = "libc-stdio"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 240
pre = ["sh tests/libc/target/build.sh stdio x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"
skip = "needs PG-1 PG-13 PG-22 PG-23 PG-24 PG-29 PG-50 PG-53"

[[expect]]
regex = '^libc-stdio: start$'

[[expect]]
regex = '^libc-stdio: printf ok$'

[[expect]]
regex = '^libc-stdio: scanf ok$'

[[expect]]
regex = '^libc-stdio: file ok$'

[[expect]]
regex = '^libc-stdio: initfs read ok$'

[[expect]]
regex = '^libc-stdio: buffer ok$'

[[expect]]
regex = '^libc-stdio: std streams ok$'

[[expect]]
regex = '^libc-stdio: memstream ok$'

[[expect]]
regex = '^libc-stdio: wide ok$'

[[expect]]
regex = '^libc-stdio: getline ok$'

# needs PG-12 or compiler-rt soft-float builtins; the program prints SKIP
# [[expect]]
# regex = '^libc-stdio: float ok$'

[[expect]]
regex = '^libc-stdio: done$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-[a-z]+: FAIL'
