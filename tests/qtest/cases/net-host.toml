#
# K227 host-reachable tap acceptance. The pre-step runs the bounded host-side
# tap/bridge proof (host ping, guest ping/internet, DNS server, cleanup); the
# case then boots the release image on QEMU user networking to prove the image
# and getty are unchanged. The guest TCP/SSH assertion waits for K225/K195 and
# is not claimed here.

name = "net-host"
arch = "x86_64"
profile = "release"
timeout_secs = 300
pre = ["sh tests/scripts/qemu-net-selftest.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^svcd: netd up$'

[[expect]]
regex = '^svcd: getty up$'

[[expect]]
regex = '^RavenBSD 0\.1 \(x86_64\) \(tty:console\)$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 180

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
