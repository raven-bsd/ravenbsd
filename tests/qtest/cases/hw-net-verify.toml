# B70 two-boot harness, boot 2: the pre step verifies the exact host-echo payload written by
# the first boot; the guest boots the real service manager once more and prints its marker.
# Parked with hw-net until B12b/B12c/B14/B15 land.

name = "hw-net-verify"
arch = "x86_64"
profile = "hw-net-verify"
timeout_secs = 120
skip = "harness parked: needs the active hw-net boot and B12b/B12c/B14/B15"
pre = ["sh tests/fixtures/b70-net/verify-host-echo.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^hw-net: verify boot$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
