name = "exc-int3"
arch = "x86_64"
profile = "base"
timeout_secs = 30
boot_cmdline = "console=ttyS0 test-exit=1 selftest=int3"
expect_exit = "success"

[[expect]]
regex = 'EXCEPTION: breakpoint'

[[expect]]
regex = 'selftest: int3 returned'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\) '

[[expect]]
regex = '^mem: \d+ MiB usable in \d+ regions$'

[[expect]]
regex = '^cmdline: '
