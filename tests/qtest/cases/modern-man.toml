# K94: the installed pages are found under /usr/share/man, render through the first-party
# renderer, stay plain over the serial console, and report a missing page as exit 1.
name = "modern-man"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^rsh: ready$'

[[expect]]
regex = '^LS\(1\)  RavenBSD  November 12, 2026$'

[[expect]]
regex = '^NAME$'

[[expect]]
regex = '^    ls - list directory contents$'

[[expect]]
regex = '^man: no entry for nope in section 9$'

[[expect]]
regex = '^status=1$'

[[expect]]
regex = '^status=0$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '\x1b\[[0-9;]*m'

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "man 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^NAME$'
timeout_secs = 30

[[step]]
wait = '^    ls - list directory contents$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man 9 nope\n"
delay_ms = 100

[[step]]
wait = '^man: no entry for nope in section 9$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^status=1$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export TERM=xterm-256color\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export NO_COLOR=1\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export TERM=dumb\n"
delay_ms = 100

[[step]]
send = "unset NO_COLOR\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "unset TERM\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export MANPAGER=cat\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^status=0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man -V\n"
delay_ms = 100

[[step]]
wait = '^man 0\.1\.0 \(RavenBSD\)$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
