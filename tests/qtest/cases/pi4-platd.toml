# P12: devd launches platd from the P8 driver table and a client exercises the
# plat: scheme through the deterministic backend. The fixture is a launch/scheme
# test; the hardware capability plan is host-tested, not a board result.

name = "pi4-platd"
arch = "x86_64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/fixtures/pi4-platd/build.sh"]
initfs = "build/fixtures/pi4-platd/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^devd: dtb devices=1$'

[[expect]]
regex = '^devd: dtb device /platd@fd580000 compatible=raven,pi4-platform reg=0xfd580000\+0x1000 dma=0 irq=none$'

[[expect]]
regex = '^devd: dtb driver platd compatible=raven,pi4-platform device=/platd@fd580000$'

[[expect]]
regex = '^devd: dtb launch platd bars=3 bar=0 size=0x1000 dma=4096 irq=0$'

[[expect]]
regex = '^platd: ready backend=fake$'

[[expect]]
regex = '^svcd: pcid up$'

[[expect]]
regex = '^pi4-platd: model=0x00002711$'

[[expect]]
regex = '^pi4-platd: revision=0x00c03114$'

[[expect]]
regex = '^pi4-platd: serial=0x0000000012345678$'

[[expect]]
regex = '^pi4-platd: mac=02:00:00:00:00:01$'

[[expect]]
regex = '^pi4-platd: clock12=50000000$'

[[expect]]
regex = '^pi4-platd: power0=1$'

[[expect]]
regex = '^platd: claim pin=17$'

[[expect]]
regex = '^pi4-platd: gpio claim ok$'

[[expect]]
regex = '^platd: conflict pin=17$'

[[expect]]
regex = '^pi4-platd: gpio conflict ok$'

[[expect]]
regex = '^pi4-platd: gpio config ok$'

[[expect]]
regex = '^platd: release pin=17$'

[[expect]]
regex = '^pi4-platd: rng=[0-9a-f]{16}$'

[[expect]]
regex = '^pi4-platd: done$'

[[expect]]
regex = '^svcd: plat-client up$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
