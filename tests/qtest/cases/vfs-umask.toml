#
# S204: a non-root client creates with umask 027 and 077 on `file:` through
# vfsd. POSIX create yields 0640 and 0600, owned by the caller's euid/egid.
# The reused `vfsd-test` profile runs the generated probe as a one-shot svcd
# service; the fixture build installs it at the profile's staged path.

name = "vfs-umask"
arch = "x86_64"
profile = "vfsd-test"
timeout_secs = 300
pre = ["sh tests/fixtures/vfs-umask/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^vfs-umask: 027 mode=0640 uid=1000 gid=1000$'

[[expect]]
regex = '^vfs-umask: 077 mode=0600 uid=1000 gid=1000$'

[[expect]]
regex = '^vfs-umask: probe ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
