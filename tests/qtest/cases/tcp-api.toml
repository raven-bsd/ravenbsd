# K294 TCP API matrix: connect, send, recv and close through the AF_INET socket path. This is the
# K230 socket-inet fixture driven explicitly on TCG; tcp-api-kvm.toml runs the same expectation
# set on KVM. No product source is changed.

name = "tcp-api"
arch = "x86_64"
profile = "network-config-test"
timeout_secs = 300
initfs = "build/fixtures/socket-inet/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-accel", "tcg",
    "-nic", "none",
    "-netdev", "user,id=n0,hostfwd=tcp:127.0.0.1:23080-:23080",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"
pre = [
    "test -f build/fixtures/socket-inet/initfs.img || sh tests/fixtures/socket-inet/build.sh",
    "sh tests/fixtures/socket-inet/start-host-echo.sh",
]

[[expect]]
regex = '^socket-inet: socket fd=[0-9]+$'

[[expect]]
regex = '^socket-inet: bind ok$'

[[expect]]
regex = '^socket-inet: listen ok$'

[[expect]]
regex = '^socket-inet: listening port=23080$'

[[expect]]
regex = '^.*socket-inet: poll revents=1$'

[[expect]]
regex = '^.*socket-inet: accept fd=[0-9]+$'

[[expect]]
regex = '^socket-inet: accepted peer=[0-9.]+:[0-9]+$'

[[expect]]
regex = '^socket-inet: echo received bytes=19 payload=socket-inet-payload$'

[[expect]]
regex = '^socket-inet: echo sent$'

[[expect]]
regex = '^socket-inet: host ack socket-inet-ack$'

[[expect]]
regex = '^socket-inet: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)socket-inet: fail|panic|EXCEPTION'
