# K508: PROC_TIMES/GETRUSAGE accounting: self busy interval, busy child within 1 ms,
# sleeping child under 5 ms of user time, reaped-child folding and priority non-corruption.

name = "proc-times"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/proc-times/build.sh"]
initfs = "build/fixtures/proc-times/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^proc-times: self-user=1 self-system=1$'

[[expect]]
regex = '^proc-times: busy-child=1 child-user-ns=[0-9]+ child-system-ns=[0-9]+$'

[[expect]]
regex = '^proc-times: sleep-child=1 sleep-user-ns=[0-9]+$'

[[expect]]
regex = '^proc-times: priority=1 accounting=1$'

[[expect]]
regex = '^proc-times: reaped-fold=1 maxrss=[0-9]+$'

[[expect]]
regex = '^proc-times: cpuclock=not-exposed$'

[[expect]]
regex = '^proc-times: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|proc-times: fail'
