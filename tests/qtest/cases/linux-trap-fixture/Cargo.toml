[package]
name = "raven-s41-trap"
version = "0.1.0"
description = "S41 fixture: native controller, Linux trap handler and Linux-personality children."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s41-trap"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-ipc = { path = "../../../../crates/raven-ipc" }
raven-proto-linux = { path = "../../../../crates/raven-proto-linux" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
