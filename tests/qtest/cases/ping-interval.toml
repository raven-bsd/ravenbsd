# K190: the default ping interval is one second, the four replies are real slirp ICMP replies,
# and a 100% loss run exits non-zero. The guest prints the measured wait before each echo after
# the first, so the qtest asserts spacing without relying on a host wall clock.

name = "ping-interval"
arch = "x86_64"
profile = "release"
timeout_secs = 180
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^svcd: getty up$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: interval seq=2 waited=[1-9][0-9]{3}ms$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=2 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: interval seq=3 waited=[1-9][0-9]{3}ms$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=3 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: interval seq=4 waited=[1-9][0-9]{3}ms$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=4 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: 4 packets transmitted, 4 received, 0% packet loss$'

[[expect]]
regex = '^ping: rtt min/avg/max = [0-9]+/[0-9]+/[0-9]+ ms$'

[[expect]]
regex = '^ping: 10\.0\.2\.99 seq=1 timeout$'

[[expect]]
regex = '^ping: 1 packets transmitted, 0 received, 100% packet loss$'

[[expect]]
regex = '^ping-status:1$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "ping 10.0.2.2\n"
delay_ms = 100

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'
timeout_secs = 30

[[step]]
wait = '^ping: interval seq=2 waited=[1-9][0-9]{3}ms$'
timeout_secs = 30

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=2 rtt=[0-9]+ms$'
timeout_secs = 30

[[step]]
wait = '^ping: interval seq=3 waited=[1-9][0-9]{3}ms$'
timeout_secs = 30

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=3 rtt=[0-9]+ms$'
timeout_secs = 30

[[step]]
wait = '^ping: interval seq=4 waited=[1-9][0-9]{3}ms$'
timeout_secs = 30

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=4 rtt=[0-9]+ms$'
timeout_secs = 30

[[step]]
wait = '^ping: 4 packets transmitted, 4 received, 0% packet loss$'
timeout_secs = 30

[[step]]
wait = '^ping: rtt min/avg/max = [0-9]+/[0-9]+/[0-9]+ ms$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ping -c 1 -w 1 10.0.2.99; echo ping-status:$?\n"
delay_ms = 100

[[step]]
wait = '^ping: 10\.0\.2\.99 seq=1 timeout$'
timeout_secs = 30

[[step]]
wait = '^ping: 1 packets transmitted, 0 received, 100% packet loss$'
timeout_secs = 30

[[step]]
wait = '^ping-status:1$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60

[[forbid]]
regex = '(?i)panic|EXCEPTION|login: .*incorrect|login: .*failed|bad ELF|SegmentOutsideUserRange'
