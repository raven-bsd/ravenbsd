#
# S96: the release login is brush, completion is registered, and no rsh process is running.
# The scripted completion proof is `complete -p`; TAB itself is interactive.

name = "brush-login"
arch = "x86_64"
profile = "release"
timeout_secs = 420
pre = ["cargo xtask build brush --arch x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven# $'

[[expect]]
regex = '^shell:/bin/brush$'

[[expect]]
regex = '^zero:(brush|/bin/brush)$'

[[expect]]
regex = "^complete -W 'help exit' raven-test$"

[[expect]]
regex = '^no-rsh$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '^rsh: ready$'

[[forbid]]
regex = '^[0-9]+ [0-9]+ 0 0 rsh$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|login: .*incorrect|login: .*failed'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 300

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "echo shell:$SHELL\n"
delay_ms = 100

[[step]]
wait = '^shell:/bin/brush$'
timeout_secs = 30

[[step]]
send = "echo zero:$0\n"
delay_ms = 100

[[step]]
wait = '^zero:(brush|/bin/brush)$'
timeout_secs = 30

[[step]]
send = "complete -p raven-test\n"
delay_ms = 100

[[step]]
wait = "^complete -W 'help exit' raven-test$"
timeout_secs = 30

[[step]]
send = "ps -e\n"
delay_ms = 100

[[step]]
wait = '^PID PPID UID GID CMD$'
timeout_secs = 30

[[step]]
send = "echo no-rsh\n"
delay_ms = 100

[[step]]
wait = '^no-rsh$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
