# S776 fault delivery without SIG_SETUP: a read-only page write is delivered through the
# kernel-built C19 frame (SIGACTION disposition, kernel sigcode, SIGRETURN resume). The
# handler sees SIGSEGV/SEGV_ACCERR and the fault address in the record; a child that exits
# from the handler reports status 11 and a child with the default disposition dies with -11.

name = "signal-fault"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/qtest/cases/signal-fault-fixture/build.sh"]
initfs = "build/fixtures/signal-fault/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-cpu", "max"]
expect_exit = "success"

[[expect]]
regex = '^signal-fault: page handler=1 code=2 addr=0x[0-9a-f]+ addr-match=1$'

[[expect]]
regex = '^signal-fault: page resumed=1$'

[[expect]]
regex = '^signal-fault: caught status=11$'

[[expect]]
regex = '^signal-fault: default status=-11$'

[[expect]]
regex = '^signal-fault: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
