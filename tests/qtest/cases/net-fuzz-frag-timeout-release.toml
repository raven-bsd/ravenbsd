name = "net-fuzz-frag-timeout-release"
arch = "x86_64"
profile = "release"
# Release-profile reassembly-timeout row: one 31 s wait plus a fresh-fragment canary.
timeout_secs = 120
pre = ["timeout 900 sh tests/net-conformance/fuzz.sh --release --scenario frag-timeout"]
image = "build/qtest/net-fuzz-release.img"
qemu_extra = ["-netdev", "user,id=n0", "-device", "virtio-net-pci,netdev=n0,disable-legacy=on,mac=52:54:00:12:34:56"]
expect_exit = "success"

[[step]]
wait = '^netconf: listening port=23090$'
timeout_secs = 45
[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 45
[[step]]
send = "root\n"
[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 10
[[step]]
send = "raven\n"
[[step]]
wait = '^raven# $'
timeout_secs = 30
[[step]]
send = "exit 0\n"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
