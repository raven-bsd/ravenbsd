name = "sched-kernel-threads"
arch = "x86_64"
profile = "base"
timeout_secs = 60
boot_cmdline = "console=ttyS0 test-exit=1 selftest=sched"
expect_exit = "success"

[[expect]]
regex = '^sched: running \(1 cpu, slice 10 ms\)$'

[[expect]]
regex = '^selftest: sched ok switches=\d+$'

[[forbid]]
regex = '(?i)panic|selftest: sched failed|timeout'
