# S161: the C19 signal model on aarch64. A caught signal is delivered by the kernel `sendsig` as a
# `sigframe` on the user stack, the handler sees `x0=sig`, `x1=&siginfo`, `x2=&ucontext`, the
# frame's `__gregs` holds the interrupted ELR/SP, the sigcode (`mov x8, #SIGRETURN; svc #0`)
# returns through the kernel `sigreturn`, and an `SA_ONSTACK` handler runs on the alternate stack.

name = "signal-aarch64-action"
arch = "aarch64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/signal/build.sh"]
initfs = "build/fixtures/signal/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^signal-action: start$'

[[expect]]
regex = '^signal-action: sigaction ok$'

[[expect]]
regex = '^signal-action: frame ok$'

[[expect]]
regex = '^signal-action: resume ok$'

[[expect]]
regex = '^signal-action: altstack ok$'

[[expect]]
regex = '^signal-action: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|signal-action: .*failed|signal-action: .*wrong|signal-action: context mismatch|signal-action: .*not on altstack'
