name = "devd"
arch = "x86_64"
profile = "devd-test"
timeout_secs = 240
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-device", "edu"]
expect_exit = "success"

[[expect]]
regex = '^pcid: devices=[1-9][0-9]*$'

[[expect]]
regex = '^svcd: pcid up$'

[[expect]]
regex = '^devd: matched [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] vendor=0x1234 device=0x11e8 irq_line=[0-9]+ irq_pin=[0-9]+$'

[[expect]]
regex = '^devd: dummy running$'

[[expect]]
regex = '^devd: dummy rights ok$'

[[expect]]
regex = '^devd: driver dummy cycles=10$'

[[expect]]
regex = '^svcd: devd up$'

[[expect]]
regex = '^devd stopped 0$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
