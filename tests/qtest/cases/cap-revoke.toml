# S73 capability handoff and revocation: a controller transfers two reduced-rights MemObject
# handles to a child (MAP|READ|DUP and READ|DUP), forks that child, revokes MAP on the source
# lineage, and both processes must reject every later MAP with EPERM while a right that was never
# granted stays EACCES. A duplicate made before and after the revoke cannot regain MAP. The
# lifetime case then proves the object survives the source close and a stale handle is EBADF.

name = "cap-revoke"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/cap-revoke/build.sh"]
initfs = "build/fixtures/cap-revoke/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^cap: use ok$'
unordered = true

[[expect]]
regex = '^cap: use ok$'
unordered = true

[[expect]]
regex = '^cap: dup-before ok$'
unordered = true

[[expect]]
regex = '^cap: dup-before ok$'
unordered = true

[[expect]]
regex = '^cap: never-granted ok$'
unordered = true

[[expect]]
regex = '^cap: never-granted ok$'
unordered = true

[[expect]]
regex = '^cap: revoke eperm ok$'
unordered = true

[[expect]]
regex = '^cap: revoke eperm ok$'
unordered = true

[[expect]]
regex = '^cap: dup-before eperm ok$'
unordered = true

[[expect]]
regex = '^cap: dup-before eperm ok$'
unordered = true

[[expect]]
regex = '^cap: dup-after ok$'
unordered = true

[[expect]]
regex = '^cap: dup-after ok$'
unordered = true

[[expect]]
regex = '^cap: dup-after eacces ok$'
unordered = true

[[expect]]
regex = '^cap: dup-after eacces ok$'
unordered = true

[[expect]]
regex = '^cap: never-after eacces ok$'
unordered = true

[[expect]]
regex = '^cap: never-after eacces ok$'
unordered = true

[[expect]]
regex = '^cap: never-dup eacces ok$'
unordered = true

[[expect]]
regex = '^cap: never-dup eacces ok$'
unordered = true

[[expect]]
regex = '^cap: revoke client ok$'
unordered = true

[[expect]]
regex = '^cap: revoke client ok$'
unordered = true

[[expect]]
regex = '^cap: revoke case ok$'

[[expect]]
regex = '^cap: lifetime use ok$'

[[expect]]
regex = '^cap: lifetime alive ok$'

[[expect]]
regex = '^cap: lifetime reuse ok$'

[[expect]]
regex = '^cap: lifetime stale ok$'

[[expect]]
regex = '^cap: lifetime case ok$'

[[expect]]
regex = '^cap: ok$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|cap: failed|cap: .*unexpected'
