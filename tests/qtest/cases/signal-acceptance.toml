name = "signal-acceptance"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/signals/build.sh"]
initfs = "build/signals/x86_64/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^signal: handler ok sig=10$'

[[expect]]
regex = '^signal: ucontext ok rip=0x[0-9a-f]+ rsp=0x[0-9a-f]+$'

[[expect]]
regex = '^signal: return ok$'

[[expect]]
regex = '^signal: nested ok sig=12$'

[[expect]]
regex = '^signal: interrupt ok sig=10$'

[[expect]]
regex = '^signal: blocked-held$'

[[expect]]
regex = '^signal: blocked ok signal=10$'

[[expect]]
regex = '^signal: exec-default ok signal=10$'

[[expect]]
regex = '^signal: ignored ok$'

[[expect]]
regex = '^signal: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|signal: fail|signal: exec-child survived'
