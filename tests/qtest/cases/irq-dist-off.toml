name = "irq-dist-off"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/fixtures/irq-dist/build.sh"]
initfs = "build/fixtures/irq-dist/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=off irq-dist-trace"
qemu_extra = ["-device", "edu"]
expect_exit = "success"

# With smp_user=off the IRQ stays on the BSP.
[[expect]]
regex = '^irq-dist: vector \d+ -> cpu 0$'

[[expect]]
regex = '^irq-dist: msi vector=\d+ count=1000$'

[[expect]]
regex = '^irq-dist: msi vector=\d+ count=1000$'

[[expect]]
regex = '^irq-dist: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '^irq-dist: vector \d+ -> cpu [1-9]$'

[[forbid]]
regex = '^irq-dist: vector \d+ handled on cpu [1-9]$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|irq-dist: failed'
