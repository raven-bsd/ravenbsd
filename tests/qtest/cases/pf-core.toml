# K273 pf-core: the userspace filter model over an initfs fixture. Exercises rules, tables,
# stateful replies, NAT translation, IPv6 stateless matching and fail-closed parsing.

name = "pf-core"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/pf/build.sh"]
initfs = "build/fixtures/pf/pf-core.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^pf-core: rules=5 table=1$'

[[expect]]
regex = '^pf-core: allow=1 deny=1 state=1 nat=1 v6=1 malformed=1$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|pf-core: fail'
