# S44: a kernel C19 signal sent to a thread blocked in poll(2) must wake it with EINTR and run the
# handler. A lost kick re-arms the wait and the child reports a timeout.

name = "signal-poll"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/signal/poll/build.sh"]
initfs = "build/signal-poll/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 init=/bin/signal-poll"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^signal-poll: poll EINTR$'

[[expect]]
regex = '^signal-poll: handler ok$'

[[expect]]
regex = '^signal-poll: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|signal-poll: fail|EXCEPTION'
