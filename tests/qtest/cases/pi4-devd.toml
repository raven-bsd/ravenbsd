# P8: devd decodes the fixture DTB, matches the fake platform driver by compatible string,
# creates the MMIO/DMA/IRQ handles, transfers them and waits for the driver. The fake driver
# verifies its handles without touching device memory.

name = "pi4-devd"
arch = "aarch64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/fixtures/pi4-devd/build.sh"]
initfs = "build/fixtures/pi4-devd/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^devd: dtb devices=5$'

[[expect]]
regex = '^devd: dtb device /soc/pwm@7e20c800 compatible=brcm,bcm2835-pwm reg=0xfe20c800\+0x28 dma=0 irq=none$'

[[expect]]
regex = '^devd: dtb device /soc/rng@7e104000 compatible=brcm,bcm2711-rng200 reg=0xfe104000\+0x28 dma=0 irq=none$'

[[expect]]
regex = '^devd: dtb device /scb/ethernet@7d580000 compatible=brcm,bcm2711-genet-v5 reg=0xfd580000\+0x10000 dma=0 irq=spi=157,spi=158$'

[[expect]]
regex = '^devd: dtb device /emmc2bus/mmc@7e340000 compatible=brcm,bcm2711-emmc2 reg=0xfe340000\+0x100 dma=1 irq=spi=126$'

[[expect]]
regex = '^devd: dtb device /interrupt-controller@ff841000 compatible=arm,gic-400 reg=0xff841000\+0x1000 dma=0 irq=none$'

[[expect]]
regex = '^devd: dtb driver fake-platform compatible=brcm,bcm2711-genet-v5 device=/scb/ethernet@7d580000$'

[[expect]]
regex = '^devd: dtb launch fake-platform bar=0 size=0x10000 dma=1048576 irq=189$'

[[expect]]
regex = '^fake-platform: bar=0 size=65536 dma=1048576 irq=189$'

[[expect]]
regex = '^fake-platform: dma bus=0x[0-9a-f]+ len=1048576$'

[[expect]]
regex = '^fake-platform: handles ok$'

[[expect]]
regex = '^devd: dtb launch fake-platform exit=0$'

[[expect]]
regex = '^devd: dtb matched=1$'

[[expect]]
regex = '^svcd: pcid up$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
