name = "kernel-early-boot"
arch = "x86_64"
profile = "base"
timeout_secs = 30
boot_cmdline = "console=ttyS0 test-exit=1 loglevel=debug"
expect_exit = "success"

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\) '

[[expect]]
regex = '^mem: \d+ MiB usable in \d+ regions$'

[[expect]]
regex = '^cmdline: '

[[forbid]]
regex = '(?i)panic'
