#
# K151/K166: aarch64 release login. This is the qtest shape of the K145 cold-start harness: it
# must reach `Password:` and a shell prompt with the aarch64 dynamic login, never a static
# substitute. K166 supplies the PL011 RX/DEBUG_READ path that makes input possible.

name = "login-aarch64"
arch = "aarch64"
profile = "release"
timeout_secs = 240
boot_cmdline = "console=ttyAMA0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^-{10,}$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 aarch64$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven# '

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|bad ELF|getty failed'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
