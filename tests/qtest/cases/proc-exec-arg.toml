# S168b: after exec, the C8 argument register and the stack pointer must both carry the aligned
# loader sp0. The child's custom `_start` reads `rdi` before the stack is touched.

name = "proc-exec-arg"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/qtest/cases/proc-exec-arg/build.sh"]
initfs = "build/fixtures/proc-exec-arg/x86_64/arg.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^proc-exec-arg: init$'

[[expect]]
regex = '^proc-exec-arg: child arg=0x[0-9a-f]+ sp=0x[0-9a-f]+ match=1 aligned=1 argc=1$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|proc-exec-arg: FAIL'
