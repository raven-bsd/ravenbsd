# K466 row 9, check half: boot the image left by `ufs-fsync-persist` after its
# power cut, mount it read-write, and verify every byte of the file plus the
# directory entry and the rename. The probe compares each 4 KiB chunk against the
# same deterministic pattern it wrote before the cut.

name = "ufs-fsync-check"
arch = "x86_64"
profile = "ufs-demo"
# The first boot after the power cut runs fsd-ufs's full recovery check on the
# slow synchronous block path; allow it to finish before the login wait.
timeout_secs = 300
pre = ["test -f build/fixtures/ufs-durability/disk.img"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-drive", "if=none,id=ufs,format=raw,file=build/fixtures/ufs-durability/disk.img",
    "-device", "virtio-blk-pci,drive=ufs,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^-{80}$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 x86_64$'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^k466: persist file=ok len=65536 checksum=[0-9a-f]{16}$'

[[expect]]
regex = '^k466: persist dir=ok rename=ok entry=[0-9a-f]{16}$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange'

[[forbid]]
regex = '(?i)mismatch|short at chunk|longer than'

# K542: the write boot's syncs must leave the filesystem clean. A skipped sync
# leaves the superblock dirty (mount writes clean=0) and this recovery line
# appears on the remount, so the durability row is load-bearing for fsync.
[[forbid]]
regex = 'fsd-ufs: (repaired|journal replayed|refused to serve a dirty image)'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 240

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "mount ufs: /mnt && echo mount-ok\n"
delay_ms = 100

[[step]]
wait = '^mount-ok$'
timeout_secs = 240

[[step]]
send = "/mnt/bin/ufs-probe persist-check; echo probe=$?\n"
delay_ms = 100

[[step]]
wait = '^k466: persist dir=ok rename=ok entry=[0-9a-f]{16}$'
timeout_secs = 60

[[step]]
wait = '^probe=0$'
timeout_secs = 30

[[step]]
send = "umount /mnt && echo umount-ok\n"
delay_ms = 100

[[step]]
wait = '^umount-ok$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
