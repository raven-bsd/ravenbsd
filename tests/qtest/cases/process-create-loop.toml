# S192: 100 fork/wait cycles in one process. The initfs has only /init; no services. A kernel
# stack overflow in process creation is a double fault.

name = "process-create-loop"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/qtest/cases/process-create-loop-fixture/build.sh"]
initfs = "build/qtest/process-create-loop/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|spawn-loop: fail'
