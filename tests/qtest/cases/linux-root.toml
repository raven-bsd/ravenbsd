# B32a: the Alpine minirootfs staged by addons/linux-root/build.sh is packed into the initfs. The
# fixture verifies the release, BusyBox and the musl loader, then asks linuxd to run the exact
# `/compat/linux/bin/busybox ls` argument vector. The PIE main and its musl interpreter now load at
# their biases; BusyBox reaches `ls`, which stops at `stat(2)` (B25). The unimplemented `stat` hit
# and the BusyBox error line are the recorded boundary.

name = "linux-root"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh addons/linux-root/build.sh --qtest"]
initfs = "build/linux-root/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^linux-root: release=3\.24\.4$'

[[expect]]
regex = '^linux-root: busybox bytes=[0-9]+ loader bytes=[0-9]+$'

[[expect]]
regex = '^linux-root: attempt path=/compat/linux/bin/busybox argv1=ls$'

[[expect]]
regex = '^linuxd: entry=0x[0-9a-f]+ phdr=0x[0-9a-f]+ phnum=[0-9]+ brk=0x[0-9a-f]+$'

[[expect]]
regex = '^linuxd: dynamic=1 interp-entry=0x[0-9a-f]+ interp-bias=0x[0-9a-f]+$'

[[expect]]
regex = '^linuxd: mapped [0-9]+ regions, sp=0x[0-9a-f]+$'

[[expect]]
regex = '^ls: \.: Function not implemented$'

[[expect]]
regex = '^linuxd: unimplemented nr=4 name=stat hits=1$'

[[expect]]
regex = '^linuxd: hello exit=1$'

[[expect]]
regex = '^linux-root: linuxd exit=1$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|linux-root: FAIL'
