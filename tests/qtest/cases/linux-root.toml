# B32a: the Alpine minirootfs staged by addons/linux-root/build.sh is packed into the initfs. The
# fixture verifies the release, BusyBox and the musl loader, then asks linuxd to run the exact
# `/compat/linux/bin/busybox ls` argument vector. The PIE main and its musl interpreter load at
# their biases; after B25 the metadata batch is served, so BusyBox lists the staged top-level
# directories and exits 0. B25 updates this case from the pre-B25 `stat`-failure boundary to the
# new successful listing (the case file is outside B25's Owns; see the B25 report).

name = "linux-root"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh addons/linux-root/build.sh --qtest"]
initfs = "build/linux-root/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^linux-root: release=3\.24\.4$'

[[expect]]
regex = '^linux-root: busybox bytes=[0-9]+ loader bytes=[0-9]+$'

[[expect]]
regex = '^linux-root: attempt path=/compat/linux/bin/busybox argv1=ls$'

[[expect]]
regex = '^linuxd: entry=0x[0-9a-f]+ phdr=0x[0-9a-f]+ phnum=[0-9]+ brk=0x[0-9a-f]+$'

[[expect]]
regex = '^linuxd: dynamic=1 interp-entry=0x[0-9a-f]+ interp-bias=0x[0-9a-f]+$'

[[expect]]
regex = '^linuxd: mapped [0-9]+ regions, sp=0x[0-9a-f]+$'

[[expect]]
regex = '^bin$'

[[expect]]
regex = '^etc$'

[[expect]]
regex = '^lib$'

[[expect]]
regex = '^sbin$'

[[expect]]
regex = '^usr$'

[[expect]]
regex = '^linuxd: syscall lstat calls=[0-9]+ errors=0$'

[[expect]]
regex = '^linuxd: syscall stat calls=[0-9]+ errors=0$'

[[expect]]
regex = '^linuxd: hello exit=0$'

[[expect]]
regex = '^linux-root: linuxd exit=0$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|linux-root: FAIL'
