name = "kernel-exc-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 90
boot_cmdline = "console=ttyAMA0 test-exit=1 loglevel=debug selftest=brk"
qemu_extra = []
expect_exit = "failure"

[[expect]]
regex = '^exception: sync-cur-spx EC=0x3c \(BRK'

[[expect]]
regex = '^exception: halted$'
