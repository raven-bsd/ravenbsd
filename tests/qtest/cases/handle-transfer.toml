name = "handle-transfer"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/s25-xfer/build.sh"]
initfs = "build/fixtures/s25-xfer/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 s25-handlecheck=1"
expect_exit = "success"

[[expect]]
regex = '^s25: transfer ok$'

[[expect]]
regex = '^s25: rights ok$'

[[expect]]
regex = '^s25: attach ok$'

[[expect]]
regex = '^s25: handles free=[0-9]+$'

[[forbid]]
regex = '(?i)panic'
