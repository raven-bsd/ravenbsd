# J8: the Pi 4 base/shell/server image variants. The pre step builds each variant twice, checks
# the FAT boot manifest, proves both builds are byte-identical and the three variants differ, and
# records the GPT ROOT partition (partition 2) reserved for the J5 UFS-root path. The guest below
# boots the base variant through the generic aarch64 QEMU machine; this is a profile and image
# regression, not a Pi 4 board run.

name = "pi4-image"
arch = "aarch64"
profile = "pi4-image-test"
timeout_secs = 300
pre = ["sh tests/fixtures/pi4-image/build.sh"]
boot_cmdline = "console=ttyAMA0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(aarch64\)'

[[expect]]
regex = '^init: starting$'

[[expect]]
regex = '^RavenBSD \S+ 0\.1 RavenBSD 0\.1 \(\S+\) #\d+: .+ aarch64$'

[[expect]]
regex = '^init: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|pi4-image: FAIL'
