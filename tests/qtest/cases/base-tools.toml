# K06c base-tools: a spawned /bin command must write to the console. The shell itself owns
# `tty:console`; each child adopts it for fds 0/1/2 in libc start. This case is the minimal
# child-output probe before K25a adds the uutils package set.

name = "base-tools"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 500
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^rsh: ready$'

[[expect]]
regex = '^cat$'

[[expect]]
regex = '^ls$'

[[expect]]
regex = '^uname$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|rsh: .*command not found'

[[step]]
wait = '^raven# $'
timeout_secs = 500

[[step]]
send = "ls /bin\n"
delay_ms = 100

[[step]]
wait = '^cat$'
timeout_secs = 60

[[step]]
wait = '^ls$'
timeout_secs = 60

[[step]]
wait = '^uname$'
timeout_secs = 60

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
