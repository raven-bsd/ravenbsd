#
# Draft only: copy to tests/qtest/cases/base-tools.toml after the Raven target build of
# userland/uutils is unblocked and the profile installs build/x86_64/uutils/* at /bin/*.
#
# K26k budget (shell-test image, 84 MB initfs): measured boot ~33 s and whole case ~48 s.
# Boot wait 120 s (3.6x), per-step 15 s (each command is sub-second), case 150 s (3.1x).
# A regression to a full-image initfs scan pushes the first command past 30 s.

name = "base-tools"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 150
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|command not found'

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "uname -a\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD \S+ 0\.1 RavenBSD 0\.1 \(\S+\) #\d+: .+ x86_64$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "ps -e\n"
delay_ms = 100

[[step]]
wait = '^PID PPID UID GID CMD$'
timeout_secs = 15

[[step]]
wait = '^[0-9]+ [0-9]+ [0-9]+ [0-9]+ .+$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "mkdir /tmp/bt\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo hello > /tmp/bt/a\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "cp /tmp/bt/a /tmp/bt/b\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "mv /tmp/bt/b /tmp/bt/c\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "cat /tmp/bt/c\n"
delay_ms = 100

[[step]]
wait = '^hello$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo b > /tmp/bt/s\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo a >> /tmp/bt/s\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "sort /tmp/bt/s\n"
delay_ms = 100

[[step]]
wait = '^a$'
timeout_secs = 15

[[step]]
wait = '^b$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo 1 > /tmp/bt/n\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo 2 >> /tmp/bt/n\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo 3 >> /tmp/bt/n\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "head -n 2 /tmp/bt/n\n"
delay_ms = 100

[[step]]
wait = '^1$'
timeout_secs = 15

[[step]]
wait = '^2$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "tail -n 1 /tmp/bt/n\n"
delay_ms = 100

[[step]]
wait = '^3$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "stat -c %s /tmp/bt/c\n"
delay_ms = 100

[[step]]
wait = '^6$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "rm /tmp/bt/c\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "false\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "echo $?\n"
delay_ms = 100

[[step]]
wait = '^1$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
