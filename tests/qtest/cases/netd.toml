name = "netd"
arch = "x86_64"
profile = "netd-test"
timeout_secs = 240
pre = ["sh tests/fixtures/b12-netd/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^netd: interface lo 127\.0\.0\.1/8$'

[[expect]]
regex = '^svcd: netd up$'

[[expect]]
regex = '^netd: iface lo 127\.0\.0\.1/8$'

[[expect]]
regex = '^netd: readiness event$'

[[expect]]
regex = '^netd: ping 127\.0\.0\.1 rtt=[0-9]+ms$'

[[expect]]
regex = '^netd: route lo ok$'

[[expect]]
regex = '^netd: netstat lo sockets=[0-9]+ rx=[0-9]+ tx=[0-9]+$'

[[expect]]
regex = '^netd: accept path net:accept/[0-9]+$'

[[expect]]
regex = '^netd: endpoints ok$'

[[expect]]
regex = '^netd: options ok$'

[[expect]]
regex = '^netd: tcp echo ok$'

[[expect]]
regex = '^netd: udp echo ok$'

[[expect]]
regex = '^netd: probe ok$'

[[expect]]
regex = '^netd running [0-9]+$'

[[expect]]
regex = '^netd: iface lo 127\.0\.0\.1/8$'

[[expect]]
regex = '^netd: ping 127\.0\.0\.1 rtt=[0-9]+ms$'

[[expect]]
regex = '^netd: route lo ok$'

[[expect]]
regex = '^netd: netstat lo sockets=[0-9]+ rx=[0-9]+ tx=[0-9]+$'

[[expect]]
regex = '^netd: tcp echo ok$'

[[expect]]
regex = '^netd: udp echo ok$'

[[expect]]
regex = '^netd: restart ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
