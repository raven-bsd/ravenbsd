#
# K181: UFS statfs/df capacity. The qemu-ufs root disk is a 256 MiB UFS2 payload;
# the wire block size must match the fragment count so df reports ~256 MiB, not 1.9G.

name = "ufs-statfs"
arch = "x86_64"
profile = "qemu-ufs"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-drive", "if=none,id=ufs,format=raw,file=build/x86_64/qemu-ufs-root.img",
    "-device", "virtio-blk-pci,drive=ufs,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^svcd: root pivoted to UFS at /$'

[[expect]]
regex = '^ufs: +2[0-4][0-9]M +[0-9.]+[KMG]? +[0-9.]+[KMG]? +[0-9]+% /$'

[[expect]]
regex = '^ufs: +[0-9]+ +[0-9]+ +[0-9]+ +[0-9]+% /$'
unordered = true

[[expect]]
regex = '^fill=[0-9]+$'

[[expect]]
regex = '^ufs: on /$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|cannot access'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "/bin/df -h /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "cat /etc/motd > /statfs-fill\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/stat -c 'fill=%s' /statfs-fill\n"
delay_ms = 100

[[step]]
wait = '^fill=[0-9]+$'
timeout_secs = 30

[[step]]
send = "/bin/df -h /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/df -a\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/sbin/mount\n"
delay_ms = 100

[[step]]
wait = '^ufs: on /$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
