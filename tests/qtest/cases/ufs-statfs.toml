# K181: UFS statfs/df capacity. The qemu-ufs root disk is a 256 MiB UFS2 payload;
# the wire block size must match the fragment count so df reports ~256 MiB, not 1.9G.

name = "ufs-statfs"
arch = "x86_64"
profile = "qemu-ufs"
# K413: the demo getty restarts by design (K234); the case ends at the bounded
# timeout after proving the restart, not at an `init exited` line.
timeout_secs = 180
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-drive", "if=none,id=ufs,format=raw,file=build/x86_64/qemu-ufs-root.img",
    "-device", "virtio-blk-pci,drive=ufs,disable-legacy=on",
]
expect_exit = "timeout"

[[expect]]
regex = '^svcd: root pivoted to UFS at /$'

# K374: the styled boot screen is printed before the login prompt.
[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^-{80}$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 x86_64$'

[[expect]]
regex = '^ufs: +2[0-4][0-9]M +[0-9.]+[KMG]? +[0-9.]+[KMG]? +[0-9]+% /$'

[[expect]]
regex = '^ufs: +[0-9]+ +[0-9]+ +[0-9]+ +[0-9]+% /$'
unordered = true

[[expect]]
regex = '^fill=[0-9]+$'

[[expect]]
regex = '^ufs: on /$'

[[forbid]]
regex = '^init exited'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|cannot access'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "/bin/df -h /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "cat /etc/motd > /statfs-fill\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/stat -c 'fill=%s' /statfs-fill\n"
delay_ms = 100

[[step]]
wait = '^fill=[0-9]+$'
timeout_secs = 30

[[step]]
send = "/bin/df -h /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/df -a\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/sbin/mount\n"
delay_ms = 100

[[step]]
wait = '^ufs: on /$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

# K234: the getty restarts; `login:` returning is the real marker. The second
# session re-reads the statfs fill file to prove the rw root survived.
[[step]]
wait = '(?i)^login: ?$'
timeout_secs = 60

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/stat -c 'fill=%s' /statfs-fill\n"
delay_ms = 100

[[step]]
wait = '^fill=[0-9]+$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30
