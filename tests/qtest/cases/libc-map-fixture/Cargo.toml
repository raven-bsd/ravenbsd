# Standalone package: the fixture is a throw-away test program, not part of the product
# workspace, so it keeps its own workspace root and is built with --manifest-path.
[workspace]

[package]
name = "raven-libc-map-fixture"
version = "0.1.0"
description = "S51 PG-13 fixture: PROT_NONE reservations, partial unmap, protect split and REPLACE."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-libc-map-fixture"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
