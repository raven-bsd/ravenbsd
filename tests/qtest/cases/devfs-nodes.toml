#
# K537 devfs nodes: symlink follow/no-follow, dangling, device mode/owner, traversal,
# unlink-while-open and node-name validation.

name = "devfs-nodes"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/devfs/build.sh"]
initfs = "build/fixtures/devfs/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^devfs: services ok$'

[[expect]]
regex = '^devfs: nofollow ok$'

[[expect]]
regex = '^devfs: follow ok$'

[[expect]]
regex = '^devfs: dangling ok$'

[[expect]]
regex = '^devfs: mode-owner ok$'

[[expect]]
regex = '^devfs: traversal ok$'

[[expect]]
regex = '^devfs: unlink-open ok$'

[[expect]]
regex = '^devfs: names ok$'

[[expect]]
regex = '^devfs: nonroot ok$'

[[expect]]
regex = '^devfs: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|devfs: fail'
