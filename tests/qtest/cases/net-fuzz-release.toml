name = "net-fuzz-release"
arch = "x86_64"
profile = "release"
# Release-profile TCP fuzz. The pre-step builds the shipped release profile with the test listener
# and static network drop-in, then runs the deterministic 224-case table.
timeout_secs = 90
pre = ["timeout 900 sh tests/net-conformance/fuzz.sh --release --scenario fuzz"]
image = "build/qtest/net-fuzz-release.img"
qemu_extra = ["-netdev", "user,id=n0", "-device", "virtio-net-pci,netdev=n0,disable-legacy=on,mac=52:54:00:12:34:56"]
expect_exit = "success"

[[step]]
wait = '^netconf: listening port=23090$'
timeout_secs = 45
[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 45
[[step]]
send = "root\n"
[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 10
[[step]]
send = "raven\n"
[[step]]
wait = '^raven# $'
timeout_secs = 30
[[step]]
send = "exit 0\n"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
