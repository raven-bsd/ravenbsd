# P4d: POSIX system/process utility behaviour in a shell guest. The case builds a
# minimal initfs (core services plus only the tools under test) so initfsd stays
# inside its readiness window. This is a host/QEMU test, not a board or release
# claim.

# S112: the same case under KVM -smp 4.
name = "posix-util-system-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 840
boot_cmdline = "console=ttyS0 test-exit=1"
pre = ["sh tests/posix/utility/system/build.sh"]
initfs = "build/posix/utility/system/initfs.img"
qemu_extra = ["-enable-kvm", "-cpu", "host"]
expect_exit = "success"

[[expect]]
regex = 'svcd: all services up$'
unordered = true

[[expect]]
regex = '^rsh: ready$'
unordered = true

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|rsh: .*command not found'

