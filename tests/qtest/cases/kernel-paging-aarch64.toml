name = "kernel-paging-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 90
boot_cmdline = "console=ttyAMA0 test-exit=1 selftest=heap"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^paging: kernel tables active \(HHDM \d+ MiB, reclaimed \d+ MiB\)$'

[[expect]]
regex = '^heap: \d+ KiB$'

[[expect]]
regex = '^selftest: heap ok used=\d+ free=\d+$'

[[forbid]]
regex = '(?i)panic|exception'
