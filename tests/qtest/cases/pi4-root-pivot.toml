#
# K182: Pi 4 UFS `/` pivot on the host-backed EMMC2 GPT+UFS image. The bootstrap
# initfs has no release userland; emmc2 serves the card, blockd scans the GPT,
# fsd-ufs mounts partition 1 read-write, vfsd snapshots ufs:, and svcd pivots `/`
# to ufs:. The UFS-only marker and the login shell prove the post-pivot root.
# QEMU has no BCM2711 EMMC2 model; the host image is served by `emmc2 test`.

name = "pi4-root-pivot"
arch = "aarch64"
profile = "pi4-root-pivot"
timeout_secs = 300
boot_cmdline = "console=ttyAMA0 test-exit=1"
qemu_extra = ["-m", "1024"]
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(aarch64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(aarch64\)'

[[expect]]
regex = '^emmc2: backend=memory image=initfs:/etc/pi4-root\.img sectors=[0-9]+$'

[[expect]]
regex = '^emmc2: registered disk$'

[[expect]]
regex = '^blockd: gpt ok partitions=1$'

[[expect]]
regex = '^blockd: part 1 ufs-root 34\.\.[0-9]+$'

[[expect]]
regex = '^fsd-ufs: mounted block:0 partition 1 as ufs: \([0-9]+ bytes\)$'

[[expect]]
regex = '^fsd-ufs: mode=rw journal=(none|active)$'

[[expect]]
regex = '^svcd: root pivoted to UFS at /$'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^pi4-ufs-root$'

[[expect]]
regex = '^k182-persist$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|no UFS root device|pivot mount failed|staying on the initfs|fsd-ufs: .*failed|blockd: .*failed'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "while IFS= read -r line; do echo \"$line\"; done < /etc/raven/ufs-root-marker\n"
delay_ms = 100

[[step]]
wait = '^pi4-ufs-root$'
timeout_secs = 30

[[step]]
send = "echo k182-persist > /persist-marker; while IFS= read -r line; do echo \"$line\"; done < /persist-marker\n"
delay_ms = 100

[[step]]
wait = '^k182-persist$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
