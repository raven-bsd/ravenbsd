name = "libc-dynamic"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 300
pre = ["sh tests/libc/target/build.sh dynamic x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"
skip = "needs PG-1 PG-2 PG-13 PG-22 PG-23 PG-24 PG-29 PG-49 PG-50 PG-53"

[[expect]]
regex = '^libc-dynamic: start$'

[[expect]]
regex = '^libc-dynamic: interp ok$'

[[expect]]
regex = '^libc-dynamic: needed ok$'

[[expect]]
regex = '^libc-dynamic: dlopen ok$'

[[expect]]
regex = '^libc-dynamic: dlsym ok$'

[[expect]]
regex = '^libc-dynamic: init ok$'

[[expect]]
regex = '^libc-dynamic: error ok$'

[[expect]]
regex = '^libc-dynamic: global ok$'

[[expect]]
regex = '^libc-dynamic: libc ok$'

[[expect]]
regex = '^libc-dynamic: tls ok$'

[[expect]]
regex = '^libc-dynamic: iterate ok$'

[[expect]]
regex = '^libc-dynamic: plug fini$'

[[expect]]
regex = '^libc-dynamic: dlclose ok$'

[[expect]]
regex = '^libc-dynamic: version ok$'

[[expect]]
regex = '^libc-dynamic: done$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-[a-z]+: FAIL'
