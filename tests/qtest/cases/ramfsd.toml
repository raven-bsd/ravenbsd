name = "ramfsd"
arch = "x86_64"
profile = "ramfsd-test"
timeout_secs = 240
pre = ["sh userland/servers/ramfsd-probe/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: ramfsd up$'

[[expect]]
regex = '^ramfsd: probe ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
