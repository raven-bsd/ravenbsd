# Standalone fixture package: the initfs mapping probe is a throw-away test program, not a
# product workspace member.
[workspace]

[package]
name = "raven-initfs-map-fixture"
version = "0.1.0"
description = "K140 initfs MAP/COW/W^X/alignment and first-touch fault probe."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-initfs-map-fixture"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs", default-features = false }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
