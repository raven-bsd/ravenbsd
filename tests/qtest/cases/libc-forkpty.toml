# K196: forkpty on the real pty: server. openpty allocates a pair, the child runs with the slave
# as its controlling terminal and stdio, the parent reads the transcript from the master, sees
# EOF when the slave closes and reaps the child status.

name = "libc-forkpty"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 300
pre = ["sh tests/libc/target/build.sh forkpty"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^libc-forkpty: start$'

[[expect]]
regex = '^libc-forkpty: parent pid=[0-9]+ name=/dev/pts/[0-9]+$'

[[expect]]
regex = '^libc-forkpty: master=pty-child$'

[[expect]]
regex = '^libc-forkpty: pipe child=[0-9]+$'

[[expect]]
regex = '^libc-forkpty: pipe byte=x$'

[[expect]]
regex = '^libc-forkpty: pipe eof=1$'

[[expect]]
regex = '^libc-forkpty: pipe ok$'

[[expect]]
regex = '^libc-forkpty: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-forkpty: fail'
