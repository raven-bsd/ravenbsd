# K431: fcntl(F_SETFL, O_NONBLOCK) on a pipe must change the open-file description so the kernel
# read/write cannot sleep. The fixture marks an empty pipe non-blocking, requires EAGAIN (a
# watchdog reports `FAIL read blocked` if the kernel sleeps), fills a non-blocking write end to
# require EAGAIN, then proves a blocking pipe still waits for a delayed writer.

name = "socket-write-identity"
arch = "x86_64"
profile = "server"
timeout_secs = 60
initfs = "build/fixtures/socket-write-identity/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-nic", "none"]
expect_exit = "success"
pre = ["sh tests/fixtures/socket-write-identity/build.sh"]

[[expect]]
regex = '^socket-write-identity: nonblock empty read EAGAIN ok$'

[[expect]]
regex = '^socket-write-identity: nonblock full write EAGAIN ok$'

[[expect]]
regex = '^socket-write-identity: blocking round-trip ok$'

[[expect]]
regex = '^socket-write-identity: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)socket-write-identity: (FAIL|fail)|panic|EXCEPTION'
