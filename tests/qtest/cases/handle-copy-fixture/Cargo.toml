[package]
name = "raven-s50a-handle-copy"
version = "0.1.0"
description = "S50a fixture: HANDLE_COPY into a child process, Process handle copy and rights errors."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s50a-handle-copy"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
