#
# K408 post-exec socket write. The guest connects to the host at 10.0.2.2:23096 and writes through
# five variants: same process, fork, fork+exec (fd 7), after a read, and a second write after the
# host acknowledges. The host verifies each marker and sends the READ/ACK2/DONE triggers; the guest
# is a long-running network profile, so the case expects the harness timeout. The 180 s budget
# covers a measured loaded boot; the functional checks are the ordered serial markers.

name = "socket-write-exec"
arch = "x86_64"
profile = "server"
timeout_secs = 180
initfs = "build/fixtures/socket-write-exec/initfs.img"
boot_cmdline = "console=ttyS0 loglevel=info"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-object", "filter-dump,id=f0,netdev=n0,file=build/fixtures/socket-write-exec/qemu.pcap",
]
expect_exit = "timeout"
pre = [
    "sh tests/fixtures/socket-write-exec/build.sh",
    "sh tests/fixtures/socket-write-exec/start-host.sh",
]

[[expect]]
regex = '^socket-write-exec: connected fd=[0-9]+$'

[[expect]]
regex = '^socket-write-exec: same sent$'

[[expect]]
regex = '^socket-write-exec: fork sent$'

[[expect]]
regex = '^socket-write-exec-child: pollout ready$'

[[expect]]
regex = '^socket-write-exec: exec sent$'

[[expect]]
regex = '^socket-write-exec: read request$'

[[expect]]
regex = '^socket-write-exec: read sent$'

[[expect]]
regex = '^socket-write-exec: second sent$'

[[expect]]
regex = '^socket-write-exec: host done$'

[[expect]]
regex = '^socket-write-exec: done$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|socket-write-exec: write failed|socket-write-exec: .*trigger missing|socket-write-exec: .*child status=|socket-write-exec-child: pollout (timeout|failed)'
