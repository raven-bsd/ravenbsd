name = "net-fuzz-frag-timeout"
arch = "x86_64"
profile = "network-config-test"
# One 31 s wait on the in-tree 30 s IPv4 reassembly expiry, then a fresh-fragment canary.  The
# pre-step reuses the stamped image from net-fuzz/net-fuzz-l4.
timeout_secs = 75
pre = ["timeout 900 sh tests/net-conformance/fuzz.sh --scenario frag-timeout"]
image = "build/qtest/net-fuzz.img"
qemu_extra = ["-netdev", "user,id=n0", "-device", "virtio-net-pci,netdev=n0,disable-legacy=on,mac=52:54:00:12:34:56"]
expect_exit = "success"

[[step]]
wait = '^netconf: listening port=23090$'
timeout_secs = 45
[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 45
[[step]]
send = "root\n"
[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 10
[[step]]
send = "raven\n"
[[step]]
wait = '^raven# $'
timeout_secs = 30
[[step]]
send = "exit 0\n"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
