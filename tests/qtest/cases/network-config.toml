# K198 static network configuration: netd reads the staged drop-in, publishes 10.0.2.15/24
# with gateway 10.0.2.2 without DHCP, applies hostname raven-static through sysd, and the
# release login, ifconfig, ping to the gateway and df remain usable.

name = "network-config"
arch = "x86_64"
profile = "network-config-test"
timeout_secs = 300
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^netd: network config mode=static hostname=raven-static$'
unordered = true

[[expect]]
regex = '^netd: interface eth0 10\.0\.2\.15/24$'
unordered = true

[[expect]]
regex = '^netd: hostname raven-static$'
unordered = true

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven-static$'

[[expect]]
regex = '^ifconfig: eth0 .*inet 10\.0\.2\.15 netmask 255\.255\.255\.0$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: [1-9][0-9]* packets transmitted, [1-9][0-9]* received, 0% packet loss$'

[[expect]]
regex = '^Filesystem     1K-blocks  Used Available Use% Mounted on$'

[[expect]]
regex = '^initfs: .* /$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 300

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "hostname\n"
delay_ms = 100

[[step]]
wait = '^raven-static$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/sbin/ifconfig\n"
delay_ms = 100

[[step]]
wait = '^ifconfig: eth0 .*inet 10\.0\.2\.15 netmask 255\.255\.255\.0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ping 10.0.2.2\n"
delay_ms = 100

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'
timeout_secs = 60

[[step]]
wait = '^ping: [1-9][0-9]* packets transmitted, [1-9][0-9]* received, 0% packet loss$'
timeout_secs = 60

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "df\n"
delay_ms = 100

[[step]]
wait = '^Filesystem     1K-blocks  Used Available Use% Mounted on$'
timeout_secs = 30

[[step]]
wait = '^initfs: .* /$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60

[[forbid]]
regex = '(?i)panic|EXCEPTION|No child process|i/o error|ECHILD|out of memory|oom-kill|command not found|devd failed'
