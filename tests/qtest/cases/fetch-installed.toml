#
# K199/K198 staging gate: the release image must actually contain the first-party curl/wget
# binaries and the strict network drop-in, not just the overlay profile used by fetch-http.
name = "fetch-installed"
arch = "x86_64"
profile = "release"
timeout_secs = 240
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '(?i)^.*login:'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^-rwxr-xr-x .* /bin/curl$'

[[expect]]
regex = '^-rwxr-xr-x .* /bin/wget$'

[[expect]]
regex = '^hostname = "raven"$'

[[expect]]
regex = '^mode = "dhcp"$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "/bin/ls -l /bin/curl /bin/wget\n"
delay_ms = 100

[[step]]
wait = '^-rwxr-xr-x .* /bin/wget$'
timeout_secs = 30

[[step]]
send = "cat /etc/raven/conf.d/network.toml\n"
delay_ms = 100

[[step]]
wait = '^mode = "dhcp"$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
