# S37 kernel filesystem plumbing: K66 flags, sequential offsets, DUP/last-close, 10,000 cycles,
# client death with an unlinked open file and a transferred reference.

name = "fs-ipc"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/fixtures/s37-fs/build.sh"]
initfs = "build/fixtures/s37-fs/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^s37: flags ok$'

[[expect]]
regex = '^s37: append ok$'

[[expect]]
regex = '^s37: offsets ok$'

[[expect]]
regex = '^s37: dup ok$'

[[expect]]
regex = '^s37: loop ok$'

[[expect]]
regex = '^s37: loop count opens=0 released=0 offsets=0$'

[[expect]]
regex = '^s37: forged ok$'

[[expect]]
regex = '^s37: client count opens=0 released=0 offsets=0$'

[[expect]]
regex = '^s37: death reader ok$'

[[expect]]
regex = '^s37: death reader closed$'

[[expect]]
regex = '^s37: death count opens=0 released=1 offsets=0$'

[[expect]]
regex = '^s37: death ok$'

[[expect]]
regex = '^s37: lifecycle ok$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
