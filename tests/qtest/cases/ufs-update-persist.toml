#
# K185 persistence: apply a second raven-ufs update to the same root disk, then boot
# the staged ESP with --no-build and read the second content through /.

name = "ufs-update-persist"
arch = "x86_64"
profile = "qemu-ufs"
# K413: the demo getty restarts by design (K234); the case ends at the bounded
# timeout after proving the restart, not at an `init exited` line.
timeout_secs = 120
pre = ["sh tests/fixtures/ufs-update/second.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-drive", "if=none,id=ufs,format=raw,file=build/qtest/ufs-update-root.img",
    "-device", "virtio-blk-pci,drive=ufs,disable-legacy=on",
]
expect_exit = "timeout"

[[expect]]
regex = '^svcd: root pivoted to UFS at /$'

# K374: the styled boot screen is printed before the login prompt.
[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^-{80}$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 x86_64$'

[[expect]]
regex = '^k185-second$'

[[forbid]]
regex = '^init exited'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|no UFS root device|cannot access'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 60

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/cat /etc/ufs-update.txt\n"
delay_ms = 100

[[step]]
wait = '^k185-second$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

# K234: the getty restarts; `login:` returning is the real marker. A second
# login re-reads the second update to prove the new session and the content.
[[step]]
wait = '(?i)^login: ?$'
timeout_secs = 60

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/cat /etc/ufs-update.txt\n"
delay_ms = 100

[[step]]
wait = '^k185-second$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30
