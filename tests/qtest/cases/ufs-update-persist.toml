#
# K185 persistence: apply a second raven-ufs update to the same root disk, then boot
# the staged ESP with --no-build and read the second content through /.

name = "ufs-update-persist"
arch = "x86_64"
profile = "qemu-ufs"
timeout_secs = 90
pre = ["sh tests/fixtures/ufs-update/second.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-drive", "if=none,id=ufs,format=raw,file=build/qtest/ufs-update-root.img",
    "-device", "virtio-blk-pci,drive=ufs,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^svcd: root pivoted to UFS at /$'

[[expect]]
regex = '^k185-second$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|no UFS root device|cannot access'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 60

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/cat /etc/ufs-update.txt\n"
delay_ms = 100

[[step]]
wait = '^k185-second$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
