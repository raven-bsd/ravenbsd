#
# K26b rework: non-interactive rc and theme test. rsh owns the console in the
# `modern-shell-test` profile; `/bin/brush -c` exercises the shell builtins and sources the
# opt-in `/etc/brush/brushrc` to check the Raven Violet prompt, history and completion.
# The interactive login assertion is `modern-shell-login.toml`, blocked on P9a.
#
# K26k budget (modern-shell-test image, 33 MB initfs): measured whole case ~28 s.
# Boot wait 90 s, per-step 15 s, case 120 s (4.3x).

name = "modern-shell"
arch = "x86_64"
profile = "modern-shell-test"
timeout_secs = 120
pre = ["cargo xtask build brush --arch x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'
unordered = true

[[expect]]
regex = '^rsh: ready$'
unordered = true

[[expect]]
regex = '^echo:ok$'

[[expect]]
regex = '^printf:ok$'

[[expect]]
regex = '^test:ok$'

[[expect]]
regex = '^cond:ok$'

[[expect]]
regex = '^arith:5$'

[[expect]]
regex = '^PS1=.*38;5;183.*\\u@\\h.*38;5;231.*\\w.*\\\$'

[[expect]]
regex = '^HIST=/tmp/brush_history:ignoreboth:%F %T ?$'

[[expect]]
regex = "^complete -W 'help exit' raven-test$"

[[expect]]
regex = '^PLAIN=.*\\u@\\h.*\\w.*\\\$'

[[expect]]
regex = '^DUMB=.*\\u@\\h.*\\w.*\\\$'

[[expect]]
regex = '^ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|Function not implemented|error:'

[[forbid]]
regex = '^PLAIN=.*38;5;'

[[forbid]]
regex = '^PLAIN=.*\\e\['

[[forbid]]
regex = '^DUMB=.*38;5;'

[[forbid]]
regex = '^DUMB=.*\\e\['

[[step]]
wait = '^raven# $'
timeout_secs = 90

[[step]]
send = "/bin/brush -c 'echo echo:ok; printf \"printf:%s\\n\" ok; test 1 -eq 1 && echo test:ok; [[ a == a ]] && echo cond:ok; echo arith:$((2+3))'\n"
delay_ms = 100

[[step]]
wait = '^arith:5$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "/bin/brush -c '. /etc/brush/brushrc; printf \"PS1=%s\\n\" \"$PS1\"; printf \"HIST=%s:%s:%s\\n\" \"$HISTFILE\" \"$HISTCONTROL\" \"$HISTTIMEFORMAT\"; complete -p raven-test'\n"
delay_ms = 100

[[step]]
wait = '^PS1=.*38;5;183.*\\u@\\h.*38;5;231.*\\w.*\\\$'
timeout_secs = 15

[[step]]
wait = '^HIST=/tmp/brush_history:ignoreboth:%F %T ?$'
timeout_secs = 15

[[step]]
wait = "^complete -W 'help exit' raven-test$"
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "/bin/brush -c 'NO_COLOR=1; export NO_COLOR; . /etc/brush/brushrc; printf \"PLAIN=%s\\n\" \"$PS1\"'\n"
delay_ms = 100

[[step]]
wait = '^PLAIN=.*\\u@\\h.*\\w.*\\\$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "/bin/brush -c 'TERM=dumb; export TERM; . /etc/brush/brushrc; printf \"DUMB=%s\\n\" \"$PS1\"'\n"
delay_ms = 100

[[step]]
wait = '^DUMB=.*\\u@\\h.*\\w.*\\\$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "/bin/brush -c 'echo ok'\n"
delay_ms = 100

[[step]]
wait = '^ok$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
