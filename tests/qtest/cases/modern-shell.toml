#
# K26b: brush is the interactive login shell in the modern-shell profile. The case asserts
# the Raven Violet prompt, cwd/root marker, history/completion config and the NO_COLOR branch.

name = "modern-shell"
arch = "x86_64"
profile = "modern-shell"
timeout_secs = 900
skip = "interactive brush console input is blocked: minimal backend panics in static TLS, basic backend does not consume tty:console input, reedline needs multi-threaded tokio (thread_create is ENOSYS)"
pre = ["cargo xtask build brush --arch x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^\x1B\[38;5;183mroot'

[[expect]]
regex = '^prompt-ok$'

[[expect]]
regex = '^/tmp/brush_history$'

[[expect]]
regex = '^ignoreboth$'

[[expect]]
regex = '^%F %T'

[[expect]]
regex = "^complete -W 'help exit' raven-test$"

[[expect]]
regex = '^root@raven:/# $'

[[expect]]
regex = '^no-color-ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 600

[[step]]
send = "echo prompt-ok\n"
delay_ms = 2000

[[step]]
wait = '^prompt-ok$'
timeout_secs = 30

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 30

[[step]]
send = "echo $HISTFILE\n"
delay_ms = 100

[[step]]
wait = '^/tmp/brush_history$'
timeout_secs = 30

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 30

[[step]]
send = "echo $HISTCONTROL\n"
delay_ms = 100

[[step]]
wait = '^ignoreboth$'
timeout_secs = 30

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 30

[[step]]
send = "echo $HISTTIMEFORMAT\n"
delay_ms = 100

[[step]]
wait = '^%F %T'
timeout_secs = 30

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 30

[[step]]
send = "complete -p raven-test\n"
delay_ms = 100

[[step]]
wait = "^complete -W 'help exit' raven-test$"
timeout_secs = 30

[[step]]
wait = '^.*root@raven:/# $'
timeout_secs = 30

[[step]]
send = "NO_COLOR=1 source /etc/brush/brushrc\n"
delay_ms = 100

[[step]]
wait = '^root@raven:/# $'
timeout_secs = 30

[[step]]
send = "echo no-color-ok\n"
delay_ms = 100

[[step]]
wait = '^no-color-ok$'
timeout_secs = 30

[[step]]
wait = '^root@raven:/# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
