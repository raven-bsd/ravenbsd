# K27c init-writer case: the marker on the UFS root disk is stale, slot B is valid, and the
# loader boots it while waiting for the health marker. init mounts the root, waits for the
# required root service readiness and writes the healthy marker to the UFS root disk.

name = "update-health-init"
arch = "x86_64"
profile = "base"
timeout_secs = 600
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-drive", "if=none,id=d0,format=raw,file=build/qtest/update-health-trial.img",
    "-device", "virtio-blk-pci,drive=d0,disable-legacy=on",
]
pre = ["sh tests/fixtures/update/prepare.sh"]
expect_exit = "success"

[[expect]]
regex = '^loader: update: trial slot b attempt 2$'

[[expect]]
regex = '^loader: update: trial slot b loaded; waiting for the health marker$'

[[expect]]
regex = '^svcd: root mounted at /root$'

[[expect]]
regex = '^update-health: probe ready$'

[[expect]]
regex = '^svcd: health-probe up$'

[[expect]]
regex = '^svcd: required services ready$'

[[expect]]
regex = '^svcd: health marker written$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|health marker:'
