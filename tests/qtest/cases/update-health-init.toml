# K27a init-marker case: boot the real kernel with the update-health profile, let init reach the
# all-services-up point and write the marker through blockd to the attached virtio-blk disk.

name = "update-health-init"
arch = "x86_64"
profile = "update-health"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-drive", "if=none,id=d0,format=raw,file=build/qtest/update-health-scratch.img",
    "-device", "virtio-blk-pci,drive=d0,disable-legacy=on",
]
pre = ["sh tests/fixtures/update/prepare.sh"]
expect_exit = "success"

[[expect]]
regex = '^svcd: health marker written$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|health marker:'
