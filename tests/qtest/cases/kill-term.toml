# K434 pre-session signal probe. The release profile stages /bin/kill-term from
# tests/fixtures/kill-term; the console runs it and requires kill(SIGTERM) to
# succeed with the child's wait status reporting death by SIGTERM.
#
# Build the image, then run without rebuilding:
#   cargo xtask image --arch x86_64 --profile release --output build/qtest/kill-term.img
#   cargo xtask qtest --case kill-term --arch x86_64 --no-build

name = "kill-term"
arch = "x86_64"
profile = "release"
timeout_secs = 240
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^kill-term: kill_rc=0 wait_pid=[0-9]+ signalled=1 sig=15$'

[[expect]]
regex = '^kill-term: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/kill-term\n"
delay_ms = 200

[[step]]
wait = '^kill-term: ok$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30

[[forbid]]
regex = '(?i)panic|EXCEPTION|kill-term: fail'

[[forbid]]
regex = '(?i)SegmentOutsideUserRange'
