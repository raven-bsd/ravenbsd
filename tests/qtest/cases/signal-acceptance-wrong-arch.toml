# S710b wrong-architecture artifact rejection: the aarch64 kernel must refuse the x86_64 `/init`
# ELF instead of running it. The pre step deliberately builds the x86_64 signal fixture and this
# case feeds that foreign artifact to the aarch64 image; the kernel's init ELF parse rejects the
# machine with BadMachine and exits through the C5 failure protocol. A run that reaches
# `signal-action: start` would mean the foreign artifact was executed, so it is forbidden.

name = "signal-acceptance-wrong-arch"
arch = "aarch64"
profile = "base"
timeout_secs = 120
pre = ["RAVEN_QT_ARCH=x86_64 sh tests/fixtures/signal/build.sh"]
initfs = "build/fixtures/signal/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1"
expect_exit = "failure"

[[expect]]
regex = '^kernel: error: invalid init ELF: ELF machine does not match$'

[[forbid]]
regex = '(?i)signal-action: start|signal: boundary ok|init exited \(0\)|panic|EXCEPTION'
