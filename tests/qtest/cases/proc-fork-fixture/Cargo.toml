[package]
name = "raven-s50b-proc-fork"
version = "0.1.0"
description = "S50b fixture: PROC_FORK COW clone, NOFORK/ZERO_ON_FORK and handle-table duplication."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s50b-proc-fork"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
