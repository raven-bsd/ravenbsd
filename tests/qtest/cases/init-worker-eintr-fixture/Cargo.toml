[package]
name = "raven-init-worker-eintr"
version = "0.1.0"
description = "K480 fixture: a handlerless THREAD_KICK must not publish a service exit."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-init-worker-eintr"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-init = { path = "../../../../userland/init" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-proto-svc = { path = "../../../../crates/raven-proto-svc" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-svc-manifest = { path = "../../../../crates/raven-svc-manifest" }

[lints]
workspace = true
