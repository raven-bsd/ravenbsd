name = "kernel-timer"
arch = "x86_64"
profile = "base"
timeout_secs = 60
pre = ["sh tests/qtest/preflight-load.sh --max-load 5.0"]
boot_cmdline = "console=ttyS0 test-exit=1 selftest=timer"
expect_exit = "success"

[[expect]]
regex = '^acpi: \d+ cpus, \d+ ioapics, \d+ overrides$'

[[expect]]
regex = '^apic: id \d+ \((x2apic|xapic)\)$'

[[expect]]
regex = '^time: tsc \d+ MHz \((cpuid|pit)\)$'

[[expect]]
regex = '^timer: 1000 Hz$'

# Rev 110 data-derived budget: the unloaded 30-run distribution was 98-101 ms (max 101); the
# 126 ms full-gate run at load1=6.32 is inside the kernel's own 70-130 ms contract, while the
# 146 ms run at load1=60.83 is outside it. The upper bound is the kernel's 130 ms invariant, not
# a fit to 146; the lower 90 ms keeps the normal 98-101 ms headroom. No kernel change.
[[expect]]
regex = '^selftest: timer 100 ticks in (9[0-9]|1[0-2][0-9]|130) ms$'

[[forbid]]
regex = '(?i)panic'
