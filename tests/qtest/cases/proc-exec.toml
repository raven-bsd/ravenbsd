# P2g: proc-exec needs the P2e procd process model. origin/master has no `procd` server or
# `raven-proto-proc` crate, and the kernel has no PROC_EXEC syscall (only PROC_EXEC_CRED). The
# P2e branch implements the case on top of procd SPAWN/WAIT; this row stays honestly blocked
# until that server is merged.

name = "proc-exec"
arch = "x86_64"
profile = "base"
timeout_secs = 180
skip = "blocked: P2e procd + raven-proto-proc SPAWN/WAIT not merged (origin/stuart/P2e 15d47e18); no kernel PROC_EXEC syscall exists"
expect_exit = "success"
