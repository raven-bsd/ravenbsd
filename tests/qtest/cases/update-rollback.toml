# The K27 rollback case: boot the normal loader image, attach a second GPT disk with slot A
# (good test kernel) and slot B (invalid kernel), exhaust the trial budget and boot slot A.
# The second disk is a fixture convenience; production images carry both slots in their ESP.

name = "update-rollback"
arch = "x86_64"
profile = "base"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-drive", "format=raw,file=build/qtest/update-rollback-slots.img,index=1"]
pre = ["sh tests/fixtures/update/prepare.sh"]
expect_exit = "success"

[[expect]]
regex = '^loader: update: trial slot b attempt 2$'

[[expect]]
regex = '^loader: update: trial slot b failed: .+$'

[[expect]]
regex = '^loader: update: trial slot b attempt 1$'

[[expect]]
regex = '^loader: update: rollback to slot a$'

[[expect]]
regex = '^TESTKERNEL OK arch=1 .*$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
