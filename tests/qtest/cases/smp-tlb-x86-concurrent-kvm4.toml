# S118: x86_64 four-way concurrent unmap/TLB-shootdown regression under KVM with four CPUs.
name = "smp-tlb-x86-concurrent-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/smp/x86_64/build.sh"]
initfs = "build/smp-x86/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on smp-user-trace"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^smp-user: cpu [1-9] first user thread pid=\d+ tid=\d+$'
unordered = true

[[expect]]
regex = '^smp-x86-tlb: map=0x[0-9a-f]+ alias=0x[0-9a-f]+$'

[[expect]]
regex = '^smp-x86-tlb: concurrent-shootdown waiters=4$'

[[expect]]
regex = '^smp-x86-tlb: workers ready$'

[[expect]]
regex = '^smp-x86-tlb: summary waiters=4 tlb_rounds=64 tlb_stale=0$'

[[expect]]
regex = '^smp-x86-tlb: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-x86-tlb: fail|smp-x86-tlb: worker .* failed|stale round|smp: tlb shootdown timeout'
