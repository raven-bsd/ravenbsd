#
# K517: PROC_REBOOT poweroff row. Root caller -> ACPI S5; QEMU exits with the
# platform status (0) instead of the C5 isa-debug-exit map, hence expect_exit
# "any". A returned call prints RETURNED/no-action and is forbidden.

name = "proc-reboot-poweroff"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/proc-reboot/build.sh poweroff"]
initfs = "build/fixtures/proc-reboot/poweroff.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "any"

[[expect]]
regex = '^poweroff=request$'

[[forbid]]
regex = '(?i)panic|RETURNED|no-action'
