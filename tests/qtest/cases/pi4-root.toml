# J5: the EMMC2 host-backed fake card serves the GPT+UFS image; blockd scans it, fsd-ufs mounts
# partition 1 read-only and vfsd exposes the tree. The probe mounts /ufs and reads the known files.
# QEMU has no BCM2711 EMMC2 model, so the MMIO/IRQ/SDMA path is not covered here.

name = "pi4-root"
arch = "aarch64"
profile = "pi4-root-test"
timeout_secs = 300
pre = ["sh tests/fixtures/pi4-root/build.sh"]
boot_cmdline = "console=ttyAMA0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^emmc2: backend=memory image=initfs:/etc/pi4-root\.img sectors=32835$'
unordered = true

[[expect]]
regex = '^emmc2: registered disk$'
unordered = true

[[expect]]
regex = '^svcd: emmc2 up$'
unordered = true

[[expect]]
regex = '^emmc2: serving$'
unordered = true

[[expect]]
regex = '^blockd: remote disk=disk:0 sectors=32835 ro=0$'
unordered = true

[[expect]]
regex = '^blockd: gpt ok partitions=1$'
unordered = true

[[expect]]
regex = '^blockd: part 1 ufs-root 34\.\.32801$'
unordered = true

[[expect]]
regex = '^svcd: blockd up$'
unordered = true

[[expect]]
regex = '^fsd-ufs: mounted block:0 partition 1 as ufs: \(16777216 bytes\)$'
unordered = true

[[expect]]
regex = '^svcd: fsd-ufs up$'
unordered = true

[[expect]]
regex = '^svcd: vfsd up$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe mount ok$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe ten\.txt=0123456789$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe one\.txt=one$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe listing=dir1,fastlink,slowlink,ten\.txt$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe readlink=fast-target$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe stat=empty,size=0$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe vfs-errors ok$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe umount ok$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe errors ok$'
unordered = true

[[expect]]
regex = '^fsd-ufs: probe ok$'
unordered = true

[[expect]]
regex = '^svcd: fsd-ufs-probe up$'
unordered = true

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
