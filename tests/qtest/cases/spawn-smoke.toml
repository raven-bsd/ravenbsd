# B71a spawn-smoke: runtime spawn, wait and getpid. The /init fixture embeds an
# exit-7 child in a local initfs image; no libc/spawn wrapper is involved.

name = "spawn-smoke"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/spawn/build.sh"]
initfs = "build/fixtures/spawn/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^spawn-smoke: start$'

[[expect]]
regex = '^spawn-smoke: child$'

[[expect]]
regex = '^spawn-smoke: ok pid=[0-9]+ exit=7$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|spawn-smoke: fail'
