# K97/K97c: the dynamic userland gate. The pre step builds the selected profile's initfs and
# asserts the staged /bin programs carry PT_INTERP /libexec/ld-elf.so.1 and DT_NEEDED libc.so.1
# while /init and /sbin stay static. The boot then starts the dynamic /bin/rsh service and
# requires its `rsh: ready` line, which can only print after the loader has entered its main.
#
# `--arch aarch64` overrides the case arch and boots the same profile on the harness's generic
# `virt,gic-version=2` machine (the Pi 4 disk image cannot be booted by this harness: QEMU 6.2
# has no `raspi4b` machine). The pre step selects `pi4-release` for aarch64 and verifies the
# real Pi 4 binary staging separately; see tickets/kevin/reports/K97c.md.

name = "dynamic-userland"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 900
pre = ["sh tests/fixtures/dynamic-userland/check.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^rsh: ready$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|relocation failed|undefined symbol|rsh: .*command not found'

[[step]]
wait = '^raven# $'
timeout_secs = 600

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
