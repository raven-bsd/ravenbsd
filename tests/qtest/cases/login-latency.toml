#
# K135/K156: bounded login-latency regression. The target is <300 ms for username->Password and
# password->shell. K139 makes username->Password pass 5/5 (163-223 ms at load 3.5-4.1). The shell
# step keeps a 2 s provisional cap: the measured login/getty handoff is ~0.195 s, while brush
# spawn+startup is ~0.806 s and is handed to the brush owner. Tighten it to 1 s only when the
# brush stage lands and 5/5 supports it. The K131 image build already purges/verifies the fresh
# 0x1000 loader, so the case does not repeat that build step.

name = "login-latency"
arch = "x86_64"
profile = "release"
timeout_secs = 120
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^svcd: getty up$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven# '

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|bad ELF|getty failed'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 90

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 1

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 2

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
