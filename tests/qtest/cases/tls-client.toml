# T2 target proof: the server profile boots netd and virtio-net, this overlay
# adds a one-shot client that connects to the host `openssl s_server` on the
# QEMU user-net gateway, verifies the CA and the 10.0.2.2 SAN, exchanges an
# HTTP request/response and exits. The client build packs the initfs; the host
# server is one connection (`-naccept 1`) and exits after the handshake. The
# server disables TLS 1.3 session tickets to avoid a netd/TCP retransmission
# race; the handshake itself is still TLS 1.3.

name = "tls-client"
arch = "x86_64"
profile = "server"
timeout_secs = 300
pre = [
    "sh tests/tls/client/build.sh",
    "sh tests/tls/client/start-server.sh",
]
initfs = "build/tls/client/tls-client-initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^svcd: netd up$'

[[expect]]
regex = '^raven-tls: connect 10\.0\.2\.2:24443$'

[[expect]]
regex = '^raven-tls: handshake ok$'

[[expect]]
regex = '^raven-tls: wrote 34 bytes$'

[[expect]]
regex = '^raven-tls: read [1-9][0-9]* bytes$'

[[expect]]
regex = '^raven-tls: client ok$'

[[expect]]
regex = '^svcd: tls-client up$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|raven-tls: error'
