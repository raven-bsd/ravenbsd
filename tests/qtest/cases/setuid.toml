# U3b: native exec from an open scheme-file handle, setuid/setgid and nosuid.
# The fixture starts initfsd, then spawns the same child ELF from several initfs paths whose
# modes are 0644, 0755, 4755, 2755; a 4755 script and a nosuid 4755 run complete the matrix.

name = "setuid"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/fixtures/setuid/build.sh"]
initfs = "build/fixtures/setuid/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^setuid: 0644=denied$'

[[expect]]
regex = '^setuid-child: mode=0755 uid=1000 euid=1000 gid=1000 egid=1000$'

[[expect]]
regex = '^setuid-child: mode=4755 uid=1000 euid=0 gid=1000 egid=1000$'

[[expect]]
regex = '^setuid-child: mode=2755 uid=1000 euid=1000 gid=1000 egid=0$'

[[expect]]
regex = '^setuid: script=bad-elf$'

[[expect]]
regex = '^setuid-child: mode=nosuid uid=1000 euid=1000 gid=1000 egid=1000$'

[[expect]]
regex = '^setuid: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|setuid: fail'
