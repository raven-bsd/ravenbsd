name = "net-fuzz-l4"
arch = "x86_64"
profile = "network-config-test"
# The pre-step runs the UDP/ICMP/IPv4-option/fragment groups (104 cases) and reuses the stamped
# image.  This case logs in and exits, so the boot budget is the step timeout.
timeout_secs = 75
pre = ["timeout 900 sh tests/net-conformance/fuzz.sh --scenario l4"]
image = "build/qtest/net-fuzz.img"
qemu_extra = ["-netdev", "user,id=n0", "-device", "virtio-net-pci,netdev=n0,disable-legacy=on,mac=52:54:00:12:34:56"]
expect_exit = "success"

[[step]]
wait = '^netconf: listening port=23090$'
timeout_secs = 45
[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 45
[[step]]
send = "root\n"
[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 10
[[step]]
send = "raven\n"
[[step]]
wait = '^raven# $'
timeout_secs = 30
[[step]]
send = "exit 0\n"

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
