# K531: /tmp must be POSIX 1777 with the sticky bit. The release image is booted once and the
# serial root session runs the rows: the mode/owner, a non-root create, a non-root attempt to
# remove a root-owned file (EPERM by the sticky bit), a non-root directory and mode-600 file, and a
# root remove. Today /tmp is 0755 root root, so the first expectation is red; the fix must be in the
# image assembly (see the report: the mounted ramfs root mode is outside this ticket's Owns).

name = "tmp-writable"
arch = "x86_64"
profile = "release"
timeout_secs = 300
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^1777 root root$'

[[expect]]
regex = '^user-create-ok$'

[[expect]]
regex = '^user-remove-denied$'

[[expect]]
regex = '(?i)(operation not permitted|permission denied)'

[[expect]]
regex = '^dir-mode=755$'

[[expect]]
regex = '^file-mode=600$'

[[expect]]
regex = '^root-remove-ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "stat -c '%a %U %G' /tmp\n"
delay_ms = 100

[[step]]
wait = '^(1777 root root|[0-9]+ [a-z]+ [a-z]+)$'
timeout_secs = 30

[[step]]
send = "su raven -c 'touch /tmp/k531-user && echo user-create-ok'\n"
delay_ms = 100

[[step]]
wait = '^(user-create-ok|.*[Pp]ermission denied.*)$'
timeout_secs = 30

[[step]]
send = "rm -f /tmp/k531-root; touch /tmp/k531-root; chmod 600 /tmp/k531-root; echo root-file-ok\n"
delay_ms = 100

[[step]]
wait = '^root-file-ok$'
timeout_secs = 30

[[step]]
send = "su raven -c 'rm /tmp/k531-root' || echo user-remove-denied\n"
delay_ms = 100

[[step]]
wait = '^(user-remove-denied|.*[Pp]ermission denied.*)$'
timeout_secs = 30

[[step]]
send = "su raven -c 'mkdir /tmp/k531-dir && touch /tmp/k531-dir/mode600 && chmod 600 /tmp/k531-dir/mode600 && stat -c \"dir-mode=%a\" /tmp/k531-dir && stat -c \"file-mode=%a\" /tmp/k531-dir/mode600'\n"
delay_ms = 100

[[step]]
wait = '^(dir-mode=755|.*[Pp]ermission denied.*)$'
timeout_secs = 30

[[step]]
send = "rm -rf /tmp/k531-root /tmp/k531-user /tmp/k531-dir && echo root-remove-ok\n"
delay_ms = 100

[[step]]
wait = '^root-remove-ok$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60

[[forbid]]
regex = '(?i)panic|EXCEPTION'
