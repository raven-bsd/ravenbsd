# Copyright (c) 2026, Bo Maryniuk and RavenBSD contributors
#
# P4a: POSIX shell conformance on the target. rsh owns the console; brush runs the four
# --posix groups and prints the row markers. The fixture script under
# tests/fixtures/posix-shell/ is the host reference and carries the here-doc/pipeline rows
# that the target cannot run until the platform/source-path gaps named in P4-shell.md close.

name = "posix-shell"
arch = "x86_64"
profile = "modern-shell-test"
timeout_secs = 600
pre = ["cargo xtask build brush --arch x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^rsh: ready$'

[[expect]]
regex = '^simple:1:2$'

[[expect]]
regex = '^status:1$'

[[expect]]
regex = '^and:ok$'

[[expect]]
regex = '^or:ok$'

[[expect]]
regex = '^group:ok$'

[[expect]]
regex = '^subshell:ok$'

[[expect]]
regex = '^func:arg$'

[[expect]]
regex = '^func-status:3$'

[[expect]]
regex = '^if:ok$'

[[expect]]
regex = '^case:ok$'

[[expect]]
regex = '^for:1$'

[[expect]]
regex = '^for:2$'

[[expect]]
regex = '^while:1$'

[[expect]]
regex = '^while:2$'

[[expect]]
regex = '^until:2$'

[[expect]]
regex = '^p1:abc:bc:ab:3$'

[[expect]]
regex = '^p2:default$'

[[expect]]
regex = '^arith:5$'

[[expect]]
regex = '^sub:inner$'

[[expect]]
regex = '^split:3:a:b:c$'

[[expect]]
regex = '^/tmp/p4g-a /tmp/p4g-b$'

[[expect]]
regex = '^read:# SPDX-License-Identifier: BSD-3-Clause$'

[[expect]]
regex = '^exec-read:# SPDX-License-Identifier: BSD-3-Clause$'

[[expect]]
regex = '^after-close:1$'

[[expect]]
regex = '^errexit:1$'

[[expect]]
regex = '^nounset:1$'

[[expect]]
regex = '^xtrace:0$'

[[expect]]
regex = '^eval:ok$'

[[expect]]
regex = '^ro:1$'

[[expect]]
regex = '^umask:0022$'

[[expect]]
regex = '^getopt:a:$'

[[expect]]
regex = '^getopt:b:val$'

[[expect]]
regex = '^optind:4$'

[[expect]]
regex = '^pid:[0-9]+$'

[[expect]]
regex = '^trap:exit$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|command not found'

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "/bin/brush --posix -c 'x=1; y=2; echo simple:$x:$y; false; echo status:$?; true && echo and:ok; false || echo or:ok; { echo group:ok; }; ( echo subshell:ok ); f() { echo func:$1; return 3; }; f arg; echo func-status:$?; if true; then echo if:ok; fi; case abc in a*) echo case:ok;; esac; for i in 1 2; do echo for:$i; done; n=0; while [ \"$n\" -lt 2 ]; do n=$((n+1)); echo while:$n; done; until [ \"$n\" -ge 2 ]; do n=$((n+1)); done; echo until:$n'\n"
delay_ms = 100

[[step]]
wait = '^until:2$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/brush --posix -c 'v=abc; echo p1:${v:-x}:${v#a}:${v%c}:${#v}; unset u; echo p2:${u:-default}; echo arith:$((2+3)); echo sub:$(echo inner); IFS=:; v=a:b:c; set -- $v; echo split:$#:$1:$2:$3; unset IFS; echo a > /tmp/p4g-a; echo b > /tmp/p4g-b; echo /tmp/p4g-*'\n"
delay_ms = 100

[[step]]
wait = '^/tmp/p4g-a /tmp/p4g-b$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/brush --posix -c 'read line < /etc/mounts; echo read:$line; exec 3</etc/mounts; read line <&3; echo exec-read:$line; exec 3<&-; echo close >&- 2>&-; echo after-close:$?'\n"
delay_ms = 100

[[step]]
wait = '^after-close:1$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/brush --posix -c 'set -e; set +e; ( set -e; false; echo unreachable ); echo errexit:$?; ( set -u; echo \"$missing\" ); echo nounset:$?; ( set -x; echo traced ); echo xtrace:$?; trap \"echo trap:exit\" EXIT; eval \"echo eval:ok\"; readonly ro=1; echo ro:$ro; umask 022; echo umask:$(umask); set -- -a -b val x; while getopts ab: o; do echo getopt:$o:$OPTARG; done; echo optind:$OPTIND; echo pid:$$'\n"
delay_ms = 100

[[step]]
wait = '^trap:exit$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
