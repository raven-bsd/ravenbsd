#
# K201: the E-Ink content fetch proof. A deterministic host server (127.0.0.1:18081, exposed to
# the guest as 10.0.2.2 through QEMU user networking) serves one fixed insult line. The guest
# fetches it with curl and wget, writes the same bytes with -o/-O, sees a 404 and curl -f
# failure, and follows the redirect. No external network and no panel/hardware claim.
#
# The release client tools come from K199; the case is skipped until that ticket lands.

name = "eink-insult"
arch = "x86_64"
profile = "release"
timeout_secs = 280
pre = ["sh tests/fixtures/insult-server/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"
skip = "needs K199 curl/wget in the release image"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^Your shell is so slow it still waits for the loader\.$'

[[expect]]
regex = '^Your shell is so slow it still waits for the loader\.$'

[[expect]]
regex = '^Your shell is so slow it still waits for the loader\.$'

[[expect]]
regex = '^cmp-ok$'

[[expect]]
regex = '^404$'

[[expect]]
regex = '^curl-f:22$'

[[expect]]
regex = '^Your shell is so slow it still waits for the loader\.$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|command not found|insult-server: failed'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "curl -s http://10.0.2.2:18081/insult\n"
delay_ms = 100

[[step]]
wait = '^Your shell is so slow it still waits for the loader\.$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "curl -s -o /tmp/insult-curl.txt http://10.0.2.2:18081/insult\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "cat /tmp/insult-curl.txt\n"
delay_ms = 100

[[step]]
wait = '^Your shell is so slow it still waits for the loader\.$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "wget -q -O /tmp/insult-wget.txt http://10.0.2.2:18081/insult\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "cat /tmp/insult-wget.txt\n"
delay_ms = 100

[[step]]
wait = '^Your shell is so slow it still waits for the loader\.$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "cmp /tmp/insult-curl.txt /tmp/insult-wget.txt && echo cmp-ok\n"
delay_ms = 100

[[step]]
wait = '^cmp-ok$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "curl -s -o /dev/null -w '%{http_code}\\n' http://10.0.2.2:18081/missing\n"
delay_ms = 100

[[step]]
wait = '^404$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "curl -s -f http://10.0.2.2:18081/missing; echo curl-f:$?\n"
delay_ms = 100

[[step]]
wait = '^curl-f:22$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "curl -s -L http://10.0.2.2:18081/redirect\n"
delay_ms = 100

[[step]]
wait = '^Your shell is so slow it still waits for the loader\.$'
timeout_secs = 10

[[step]]
wait = '^raven# $'
timeout_secs = 10

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
