name = "driver-mmio"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/s21-edu/build.sh"]
initfs = "build/fixtures/s21-edu/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-device", "edu"]
expect_exit = "success"

[[expect]]
regex = '^s21: ecam ok vendor=0x8086$'

[[expect]]
regex = '^s21: edu id=0x010000ed$'

[[expect]]
regex = '^s21: transfer ok$'

[[expect]]
regex = '^s21: negatives ok$'

[[forbid]]
regex = '(?i)panic'
