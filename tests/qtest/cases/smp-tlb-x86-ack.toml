# S753: a TCG target publishes its TLB acknowledgement at the requested sequence inside the
# 100 ms diagnostic window, but the shooter is descheduled between the acknowledgement test and
# the deadline check. The deadline branch must re-read ACKED/LAST and complete without logging a
# timeout. The `s209-tlb-ack-order` boot flag arms the one-shot target delay and bounded shooter
# stall that place the acknowledgement before the deadline check deterministically.
name = "smp-tlb-x86-ack"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/smp/shootdown/build.sh"]
initfs = "build/smp/shootdown/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 s209-tlb-ack-order=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^smp: tlb shootdown ack-order stall cpu=\d+ seq=\d+$'
unordered = true

[[expect]]
regex = '^s209-shootdown: ok rounds=\d+$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp: tlb shootdown timeout|smp: tlb shootdown ack delay'
