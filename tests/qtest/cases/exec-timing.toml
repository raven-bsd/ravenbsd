# K548 rev341: static-program exec/startup split for Ken's pre-banner bucket. The parent forks and
# execve's this same static binary; the child's constructor/main/first-write and the parent's
# fork/exec_ret/wait are all CLOCK_MONOTONIC absolute nanoseconds in the guest; the host computes
# exec_to_ctor, ctor_to_main, main_to_io and child_start. The child prints first, so the ordered
# expectations start with the child rows.

name = "exec-timing"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 240
pre = ["sh tests/libc/target/build.sh exec-timing"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^.*EXEC-TIMING child ctor=[1-9][0-9]* main=[0-9]+ pid=[0-9]+$'

[[expect]]
regex = '^.*EXEC-TIMING child io=[0-9]+$'

[[expect]]
regex = '^.*EXEC-TIMING parent fork=[0-9]+ exec_ret=[0-9]+ wait=[0-9]+ pid=[0-9]+ status=0$'

[[expect]]
regex = '^.*EXEC-TIMING fork_ns=[0-9]+$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|EXEC-TIMING .* FAIL'
