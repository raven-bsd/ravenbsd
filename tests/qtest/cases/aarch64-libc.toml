# S56: aarch64 kernel-side parity for the S23/S54 libc-gate reproducers.

name = "aarch64-libc"
arch = "aarch64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/aarch64/build.sh"]
initfs = "build/fixtures/aarch64/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^aarch64-libc: thread create ex ok$'

[[expect]]
regex = '^aarch64-libc: futex wait/wake ok$'

[[expect]]
regex = '^aarch64-libc: futex eagain ok$'

[[expect]]
regex = '^aarch64-libc: signal delivery ok$'

[[expect]]
regex = '^aarch64-libc: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|aarch64-libc: fail|killed by page fault'
