#
# K498: the pre-step boots the release image with the DEBUG3 sshd overlay, makes
# one password login and one command over a private hostfwd port, and keeps the
# QEMU serial log (the sshd -ddd trace) in build/fixtures/sshd-trace/serial.log.
# The case then boots the same image as a console smoke. This is a trace, not a
# fix and not a monitor/session result claim.

name = "sshd-trace"
arch = "x86_64"
profile = "release"
timeout_secs = 300
pre = ["sh tests/fixtures/sshd-trace/run.sh"]
image = "build/fixtures/sshd-trace/sshd-trace.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^svcd: sshd up$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven# $'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
