#
# K547: the pre-step builds the DEBUG3 overlay image and runs the host-tap vs
# guest-loopback comparison over an isolated private tap
# (tests/fixtures/sshd-trace/run.sh). The host client is the real Linux OpenSSH:
# slirp hostfwd is the known FIN/RST failure, so the tap is required. The case
# then boots the same image as a console-login smoke, so a broken overlay cannot
# pass silently.

name = "sshd-trace"
arch = "x86_64"
profile = "release"
timeout_secs = 300
pre = ["sh tests/fixtures/sshd-trace/run.sh"]
image = "build/fixtures/sshd-trace/sshd-trace.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-nic", "none"]
expect_exit = "success"

[[expect]]
regex = '^svcd: sshd up$'

[[expect]]
regex = '^svcd: getty up$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^raven# $'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|login: .*incorrect|login: .*failed|bad ELF'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
