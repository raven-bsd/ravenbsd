# S23: the minimal kernel reproducer for the libc-threads `0x31` fault.

name = "kernel-thread-faults"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/kernel-thread/build.sh"]
initfs = "build/fixtures/kernel-thread/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^kernel-thread: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|kernel-thread: fail|killed by page fault'
