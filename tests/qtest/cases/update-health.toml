# K27a good-marker case: the second disk carries slot A, a valid slot B and a health marker whose
# slot/token match boot.toml. The loader confirms slot B and boots its test kernel.

name = "update-health"
arch = "x86_64"
profile = "base"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-drive", "format=raw,file=build/qtest/update-health-good.img,index=1"]
pre = ["sh tests/fixtures/update/prepare.sh"]
expect_exit = "success"

[[expect]]
regex = '^loader: update: health marker matches slot b; confirmed$'

[[expect]]
regex = '^TESTKERNEL OK arch=1 .*$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
