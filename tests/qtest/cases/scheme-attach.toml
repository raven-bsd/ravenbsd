name = "scheme-attach"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/k71-scheme/build.sh"]
initfs = "build/fixtures/k71-scheme/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^k71: attach ok$'

[[expect]]
regex = '^k71: two ok$'

[[expect]]
regex = '^k71: norights ok$'

[[expect]]
regex = '^k71: plain ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
