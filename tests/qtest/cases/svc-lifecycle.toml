name = "svc-lifecycle"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/k68-svc/build.sh"]
initfs = "build/fixtures/k68-svc/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^k68: ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
