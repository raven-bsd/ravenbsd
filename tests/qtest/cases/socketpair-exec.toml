# K222: a pre-fork AF_UNIX socketpair must survive fork and exec. The child duplicates the
# inherited end, execs a static reader, and sees exactly the parent's bytes, then EOF. A
# FD_CLOEXEC descriptor must be closed by the exec.
name = "socketpair-exec"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 300
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"
pre = ["sh tests/fixtures/socketpair-exec/build.sh"]

[[expect]]
regex = '^socketpair-exec: exact bytes ok$'

[[expect]]
regex = '^socketpair-exec: eof ok$'

[[expect]]
regex = '^socketpair-exec: shared fd survives close$'

[[expect]]
regex = '^socketpair-exec: cloexec closed$'

[[expect]]
regex = '^socketpair-exec: reader ok$'

[[expect]]
regex = '^socketpair-exec: parent ok$'

[[expect]]
regex = '^socketpair-exec: ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|socketpair-exec: fail'
