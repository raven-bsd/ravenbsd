name = "libc-spawn"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 300
pre = ["sh tests/libc/target/build.sh spawn x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^libc-spawn: parent start$'

[[expect]]
regex = '^libc-spawn: spawn ok$'

[[expect]]
regex = '^libc-child: argc=3 argv1=a argv2=b c RL=1$'

[[expect]]
regex = '^libc-spawn: wait ok$'

[[expect]]
regex = '^libc-spawn: wait twice ok$'

[[expect]]
regex = '^libc-spawn: enoent ok$'

[[expect]]
regex = '^libc-spawn: spawnp ok$'

[[expect]]
regex = '^libc-spawn: exit codes ok$'

[[expect]]
regex = '^libc-spawn: getpid ok$'

[[expect]]
regex = '^libc-spawn: sigdefault ok$'

[[expect]]
regex = '^libc-spawn: fork enosys ok$'

# needs PG-44 PG-47
# [[expect]]
# regex = '^libc-spawn: dup2 action ok$'
# needs PG-35 PG-44
# [[expect]]
# regex = '^libc-spawn: system ok$'
# [[expect]]
# regex = '^libc-spawn: popen ok$'
# needs PG-45 PG-46
# [[expect]]
# regex = '^libc-spawn: fork ok$'
# needs PG-49
# [[expect]]
# regex = '^libc-spawn: bigargs ok$'
# [[expect]]
# regex = '^libc-spawn: dynamic child ok$'

[[expect]]
regex = '^libc-spawn: done$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-[a-z]+: FAIL'
