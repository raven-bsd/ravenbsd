# K374: the styled boot screen is printed before getty's final login prompt.
name = "boot-screen"
arch = "x86_64"
profile = "release"
timeout_secs = 300
pre = ["sh tests/release/check-loader.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-nic", "none"]
expect_exit = "timeout"

[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^-{10,}$'
unordered = true

[[expect]]
regex = '^[0-9]{3}\.[0-9]{2}  \S+ +[a-z]+$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 x86_64$'

[[step]]
wait = '(?i)^login: ?$'
timeout_secs = 300

[[forbid]]
regex = '^RavenBSD 0\.1 \(x86_64\) \(tty:console\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|svcd: .*failed'
