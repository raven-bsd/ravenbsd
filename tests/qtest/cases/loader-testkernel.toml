name = "loader-testkernel"
arch = "x86_64"
profile = "base"
timeout_secs = 30
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^TESTKERNEL OK arch=1 mem_regions=\d+ usable_mib=\d+ initfs_len=\d+ cmdline="'
