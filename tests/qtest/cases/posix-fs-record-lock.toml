# P5c: raw RECORD_LOCK advisory byte-range locks over the file: scheme.

name = "posix-fs-record-lock"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/posix/fs/record-lock/build.sh"]
initfs = "build/fixtures/record-lock/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^record-lock: services ok$'

[[expect]]
regex = '^record-lock: getlk-free ok$'

[[expect]]
regex = '^record-lock: conflict ok$'

[[expect]]
regex = '^record-lock: getlk-conflict ok$'

[[expect]]
regex = '^record-lock: block ok$'

[[expect]]
regex = '^record-lock: close ok$'

[[expect]]
regex = '^record-lock: exit ok$'

[[expect]]
regex = '^record-lock: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|record-lock: fail'
