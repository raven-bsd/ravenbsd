# K27a bad-marker case: the marker is stale (trial state, not healthy) and slot B is an invalid
# kernel. The loader exhausts the trial budget and boots confirmed slot A.

name = "update-health-bad"
arch = "x86_64"
profile = "base"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-drive", "format=raw,file=build/qtest/update-health-bad-slots.img,index=1"]
pre = ["sh tests/fixtures/update/prepare.sh"]
expect_exit = "success"

[[expect]]
regex = '^loader: update: trial slot b attempt 2$'

[[expect]]
regex = '^loader: update: trial slot b failed: .+$'

[[expect]]
regex = '^loader: update: rollback to slot a$'

[[expect]]
regex = '^TESTKERNEL OK arch=1 .*$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
