#
# K184: `stat -f` must not panic when the statvfs record has no filesystem type.
# Raven's statvfs has no f_type; the defined answer is the zero/UNKNOWN type.
# uutils spells the format directive as `-c`; the ticket's `-t`/`-T` shorthand is
# exercised through `-c '%t'` and `-c '%T'`.

name = "stat-fs"
arch = "x86_64"
profile = "release"
timeout_secs = 300
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = 'Type: UNKNOWN \(0x0\)$'
unordered = true

[[expect]]
regex = '^0$'
unordered = true

[[expect]]
regex = '^UNKNOWN \(0x0\)$'
unordered = true

[[expect]]
regex = '^fs1=0$'

[[expect]]
regex = '^fs2=0$'

[[expect]]
regex = '^fs3=0$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|unimplemented'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 60

[[step]]
send = "/bin/stat -f /; echo fs1=$?\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/stat -f -c '%t' /; echo fs2=$?\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/stat -f -c '%T' /; echo fs3=$?\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
