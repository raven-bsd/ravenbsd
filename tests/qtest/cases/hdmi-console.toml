#
# K386: the HDMI text-console contract on the serial stream that the Pi 4 kernel mirrors to the
# firmware display buffer. The fixture runs the production init/getty/login path plus a target
# raven-fb probe; the host check renders the 1024x768x32 artifact. This is not a physical-monitor
# claim: the Pi 4 panel/keyboard evidence remains UI1's board run.
#
# The boot-screen expectation accepts the concise `svcd: all services up` report on the pre-K374
# base and the styled `R A V E N   B S D` title once K374 lands; both are the same boot screen
# position before getty. The login identity accepts the current getty banner or K374's Welcome.

name = "hdmi-console"
arch = "x86_64"
profile = "base"
timeout_secs = 420
pre = ["sh tests/fixtures/hdmi-console/build.sh"]
initfs = "build/fixtures/hdmi-console/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^RavenBSD kernel 0\.1 \((x86_64|aarch64)\)'

# Target probe: configured firmware mode, blitter, scroll and mailbox fallback.
[[expect]]
regex = '^hdmi-console: mode 1024x768x32 ok$'
unordered = true

[[expect]]
regex = '^hdmi-console: blit ok$'
unordered = true

[[expect]]
regex = '^hdmi-console: scroll ok$'
unordered = true

[[expect]]
regex = '^hdmi-console: mailbox fallback ok$'
unordered = true

[[expect]]
regex = '^hdmi-console: done$'
unordered = true

# The boot screen is printed before getty. Pre-K374 this is the concise boot report; after K374
# it is the styled title. Exactly one of these presentations is present on a given base.
[[expect]]
regex = '^(svcd: all services up|R A V E N   B S D)$'
unordered = true

# Current getty owns the banner; K374 moves the identity to the init `Welcome` line.
[[expect]]
regex = '^(RavenBSD 0\.1 \((x86_64|aarch64)\) \(tty:console\)|Welcome to RavenBSD 0\.1 (x86_64|aarch64))$'
unordered = true

[[expect]]
regex = '(?i)^.*login: ?root$'
unordered = true

[[expect]]
regex = '(?i)^password: ?$'
unordered = true

[[expect]]
regex = '^raven# '
unordered = true

[[expect]]
regex = '^hdmi-console-ok$'
unordered = true

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|hdmi-console: FAIL|login: unable'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 120

[[step]]
send = "echo hdmi-console-ok\n"
delay_ms = 100

[[step]]
wait = '^hdmi-console-ok$'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
