#
# PG-50 first-process startup block: boots the libc-test profile and checks the C8 argv/envp/auxv
# convention and the static libc start path. It reuses the `hello` probe binary from
# tests/libc/target; there is no second probe implementation.
name = "libc-start"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 240
pre = ["sh tests/libc/target/build.sh hello x86_64"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"
skip = "needs PG-22 PG-23"

[[expect]]
regex = '^libc-hello: start$'

[[expect]]
regex = '^libc-hello: argc ok$'

[[expect]]
regex = '^libc-hello: environ ok$'

[[expect]]
regex = '^libc-hello: auxv ok$'

[[expect]]
regex = '^libc-hello: tls ok$'

[[expect]]
regex = '^libc-hello: malloc ok$'

[[expect]]
regex = '^libc-hello: string ok$'

[[expect]]
regex = '^libc-hello: done$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|libc-[a-z]+: FAIL'
