# P2e: procd owns a spawned child, sets its process group, reports pgid/sid, maps SIGTERM to
# PROC_TERMINATE and reports a signal-style wait status. Unsupported kernel rows must answer
# ENOSYS rather than pretend success.

name = "proc-signal"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["PROCD_MODE=signal sh tests/fixtures/procd/build.sh"]
initfs = "build/fixtures/procd/initfs-signal.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^procd-test: hello version=1 pid=[0-9]+$'

[[expect]]
regex = '^procd-test: spawn pid=[0-9]+$'
unordered = true

[[expect]]
regex = '^procd-child: sleeping$'
unordered = true

[[expect]]
regex = '^procd-test: setpgid pid=[0-9]+$'

[[expect]]
regex = '^procd-test: getpgid=[0-9]+$'

[[expect]]
regex = '^procd-test: kill signal=15$'

[[expect]]
regex = '^procd-test: wait signal=15$'

[[expect]]
regex = '^procd-test: unknown=echild$'

[[expect]]
regex = '^procd-test: unsupported=enosys$'

[[expect]]
regex = '^procd-test: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|procd-test: fail|procd-child: unknown'
