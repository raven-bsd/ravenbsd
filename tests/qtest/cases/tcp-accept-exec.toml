#
# K225: accepted-socket transmit across fork/exec. The guest listener accepts a hostfwd
# connection, forks, dups the accepted fd to 4 and execs a static writer; the host client must
# read the exact banner and acknowledge it. The second connection writes from the parent as the
# no-exec control. netd logs the accepted file, sid, native sequence/window state and tx queue at
# the child write.

name = "tcp-accept-exec"
arch = "x86_64"
profile = "hw-net"
timeout_secs = 300
pre = [
    "sh tests/fixtures/tcp-accept-exec/build.sh",
    "sh tests/fixtures/tcp-accept-exec/start-host-client.sh",
]
initfs = "build/fixtures/tcp-accept-exec/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0,hostfwd=tcp:127.0.0.1:23125-:23125",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^tcp-accept-exec: listening 10\.0\.2\.15:23125$'

[[expect]]
regex = '^tcp-accept-exec: accepted fd=[0-9]+ pass=0 peer=10\.0\.2\.2:[0-9]+$'

[[expect]]
regex = '^tcp-accept-writer: wrote fd=4 bytes=19$'

[[expect]]
regex = '^tcp-accept-exec: exec child status=0$'

[[expect]]
regex = '^tcp-accept-exec: accepted fd=[0-9]+ pass=1 peer=10\.0\.2\.2:[0-9]+$'

[[expect]]
regex = '^tcp-accept-exec: noexec wrote=23$'

[[expect]]
regex = '^tcp-accept-exec: done$'

[[expect]]
regex = '^netd: tcp write file=[0-9]+ sid=[0-9]+ state=Established snd_una=[0-9]+ snd_nxt=[0-9]+ snd_wnd=[0-9]+ tx=0 len=19 result=Ok\(19\)$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|tcp-accept-exec: fail'

[[forbid]]
regex = 'state=Established snd_wnd=0'
