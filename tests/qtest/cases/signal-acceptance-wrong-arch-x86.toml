# S710b wrong-architecture artifact rejection, mirror direction: the x86_64 kernel must refuse the
# aarch64 `/init` ELF instead of running it. The pre step builds the aarch64 signal fixture and this
# case feeds that foreign artifact to the x86_64 image. Reaching `signal-action: start` would mean
# the artifact was executed, so it is forbidden.

name = "signal-acceptance-wrong-arch-x86"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["RAVEN_QT_ARCH=aarch64 sh tests/fixtures/signal/build.sh"]
initfs = "build/fixtures/signal/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = ["-cpu", "max"]
expect_exit = "failure"

[[expect]]
regex = '^kernel: error: invalid init ELF: ELF machine does not match$'

[[forbid]]
regex = '(?i)signal-action: start|signal: boundary ok|init exited \(0\)|panic|EXCEPTION'
