name = "sched-kernel-threads-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 60
boot_cmdline = "console=ttyAMA0 test-exit=1 selftest=sched"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^sched: running \(1 cpu, slice 10 ms\)$'

[[expect]]
regex = '^selftest: sched ok switches=\d+$'

[[forbid]]
regex = '(?i)panic|selftest: sched failed|timeout'
