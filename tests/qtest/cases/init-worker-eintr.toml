# K480: a handlerless THREAD_KICK interrupts the init worker's PROC_WAIT. The product wait must
# retry on EINTR and leave the service running; a real exit 7 and a SIGKILL status must survive.

name = "init-worker-eintr"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/qtest/cases/init-worker-eintr-fixture/build.sh"]
initfs = "build/fixtures/init-worker-eintr/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^init-worker-eintr: kick=retry$'

[[expect]]
regex = '^init-worker-eintr: state=running$'

[[expect]]
regex = '^init-worker-eintr: exit=7$'

[[expect]]
regex = '^init-worker-eintr: exit7-restart=yes$'

[[expect]]
regex = '^init-worker-eintr: killed=137$'

[[expect]]
regex = '^init-worker-eintr: killed-restart=yes$'

[[expect]]
regex = '^init-worker-eintr: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|init-worker-eintr: fail'
