# K95: a runtime RAVEN_PALETTE reaches the no_std man renderer. The red accent is visible only
# when colour is forced; NO_COLOR keeps the same text without SGR sequences.
name = "modern-man-color"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 420
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^svcd: all services up$'

[[expect]]
regex = '^rsh: ready$'

[[expect]]
regex = '^LS\(1\)  RavenBSD  November 12, 2026$'

[[expect]]
regex = '^    ls - list directory contents$'

[[expect]]
regex = '^  Size: 1019'

[[expect]]
regex = '^status=0$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "export TERM=xterm-256color\n"
delay_ms = 100

[[step]]
send = "export COLORTERM=truecolor\n"
delay_ms = 100

[[step]]
send = "export RAVEN_PALETTE='#ff0000:#6272a4:#44475a:#50fa7b:#ffb86c:#ff5555:#8be9fd:#f8f8f2:#ffb86c:#50fa7b:#ff79c6'\n"
delay_ms = 100

[[step]]
send = "export NO_COLOR=1\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^    ls - list directory contents$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "unset NO_COLOR\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man --color=always 1 ls\n"
delay_ms = 100

[[step]]
wait = '^LS\(1\)  RavenBSD  November 12, 2026$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^status=0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "export MANPAGER=stat\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "man --color=always 1 ls\n"
delay_ms = 100

[[step]]
wait = '^  Size: 1019'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "echo status=$?\n"
delay_ms = 100

[[step]]
wait = '^status=0$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60
