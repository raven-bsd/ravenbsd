[package]
name = "raven-b32-linux-root"
version = "0.1.0"
description = "B32 fixture: check the staged Alpine root and run linuxd on /compat/linux/bin/busybox ls."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-b32-linux-root"
path = "src/main.rs"

[dependencies]
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
