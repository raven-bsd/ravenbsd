name = "smp-user-off"
arch = "x86_64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/fixtures/smp-user/build.sh"]
initfs = "build/fixtures/smp-user/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=off smp-user-trace"
qemu_extra = ["-d", "int", "-D", "/tmp/opencode/s75-qemu-int2.log"]
expect_exit = "success"

# The emergency `smp_user=off` mode keeps user threads on the boot processor but still runs the
# fixture; the shipped default is on.
[[expect]]
regex = '^smp-user: progress 0=\d+ 1=\d+ 2=\d+ 3=\d+$'

[[expect]]
regex = '^smp-user: fault child reaped$'

[[expect]]
regex = '^smp-user: exit child reaped$'

[[expect]]
regex = '^smp-user: done$'

[[expect]]
regex = '^init exited \(0\)$'

# With smp_user=off no user thread may run on an AP and no cross-CPU wake may happen.
[[forbid]]
regex = '^smp-user: cpu [1-9] first user thread'

[[forbid]]
regex = '^smp-user: wake tid \d+ -> cpu [1-9]$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-user: failed'
