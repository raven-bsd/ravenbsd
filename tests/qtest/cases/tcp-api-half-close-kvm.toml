# K294 half-close on KVM: identical to tcp-api-half-close.toml, only the
# accelerator changes.

name = "tcp-api-half-close-kvm"
arch = "x86_64"
profile = "network-config-test"
timeout_secs = 45
initfs = "build/fixtures/net-conformance/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-accel", "kvm",
    "-nic", "none",
    "-netdev", "user,id=n0,hostfwd=tcp:127.0.0.1:23090-:23090",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "timeout"
pre = [
    "test -f build/fixtures/net-conformance/initfs.img || sh tests/fixtures/net-conformance/build.sh",
    "sh tests/qtest/cases/tcp-api-half-close-peer.sh > /tmp/opencode/tcp-api-half-close-kvm-peer.log 2>&1 &",
]

[[expect]]
regex = '^netconf: listening port=23090$'

[[expect]]
regex = '^.*netconf: accepted fd=[0-9]+$'

[[expect]]
regex = '^netconf: write=44 errno=0$'

[[expect]]
regex = '^netconf: peer-event=[0-9]+ read=0$'

[[expect]]
regex = '^netconf: closed$'

[[forbid]]
regex = '(?i)netconf: socket errno|netconf: accept errno|netconf: fail|panic|EXCEPTION'
