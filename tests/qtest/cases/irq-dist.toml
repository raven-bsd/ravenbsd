name = "irq-dist"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/fixtures/irq-dist/build.sh"]
initfs = "build/fixtures/irq-dist/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on irq-dist-trace"
qemu_extra = ["-device", "edu"]
expect_exit = "success"

# The first MSI object is routed to an application processor.
[[expect]]
regex = '^irq-dist: vector \d+ -> cpu [1-9]$'

# Its handler actually ran on an application processor.
[[expect]]
regex = '^irq-dist: vector \d+ handled on cpu [1-9]$'

[[expect]]
regex = '^irq-dist: msi vector=\d+ count=1000$'

# A second MSI object migrates the destination to another AP (or reuses the first) and still
# delivers every interrupt.
[[expect]]
regex = '^irq-dist: vector \d+ -> cpu [1-9]$'

[[expect]]
regex = '^irq-dist: vector \d+ handled on cpu [1-9]$'

[[expect]]
regex = '^irq-dist: msi vector=\d+ count=1000$'

[[expect]]
regex = '^irq-dist: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|irq-dist: failed'
