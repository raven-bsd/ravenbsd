name = "vfsd"
arch = "x86_64"
profile = "vfsd-test"
timeout_secs = 240
pre = ["sh userland/servers/vfsd-probe/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^vfsd: mounted / on initfs:$'

[[expect]]
regex = '^vfsd: mounted /tmp on ramfs:$'

[[expect]]
regex = '^vfsd: probe ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
