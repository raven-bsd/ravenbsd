# REL2b: the QEMU release gate. Boots the `release` profile, logs in as root with the
# development password, asserts the brush root prompt, lists /bin and pings the QEMU
# user-network gateway. The kernel/loader lines remain in the captured transcript.
#
# S130: the release loader contract is --image-base=0x1000. The pre-step is K131's release loader
# check: it plants a stale loader, rebuilds the release initfs, and asserts the fresh 0x1000 base,
# SONAME, manifest base/interpreter/hash and the loader packed in the initfs. The case still
# exercises the dynamic getty -> PT_INTERP=/libexec/ld-elf.so.1 -> svcd spawn path through the
# release profile; the vaddr-0 parser input remains the S129 unit/negative test.

name = "release-login"
arch = "x86_64"
profile = "release"
timeout_secs = 420
pre = ["sh tests/release/check-loader.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^loader: RavenBSD loader 0\.1 \(x86_64\)$'

[[expect]]
regex = '^RavenBSD kernel 0\.1 \(x86_64\)'

[[expect]]
regex = '^R A V E N   B S D$'

[[expect]]
regex = '^Welcome to RavenBSD 0\.1 x86_64$'

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?'

[[expect]]
regex = '^/root$'

[[expect]]
regex = '^cat$'

[[expect]]
regex = '^ls$'

[[expect]]
regex = '^uname$'

[[expect]]
regex = '^RavenBSD \S+ 0\.1 RavenBSD 0\.1 \(\S+\) #\d+: .+ x86_64$'

[[expect]]
regex = '^PID PPID UID GID CMD$'

[[expect]]
regex = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'

[[expect]]
regex = '^ping: [1-9][0-9]* packets transmitted, [1-9][0-9]* received, 0% packet loss$'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 300

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 300

[[step]]
send = "cd && pwd\n"
delay_ms = 100

[[step]]
wait = '^/root$'
timeout_secs = 30

[[step]]
send = "cd /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ls -alh /\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ls /bin\n"
delay_ms = 100

[[step]]
wait = '^cat$'
timeout_secs = 30

[[step]]
wait = '^ls$'
timeout_secs = 30

[[step]]
wait = '^uname$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/uname -a\n"
delay_ms = 100

[[step]]
wait = '^RavenBSD \S+ 0\.1 RavenBSD 0\.1 \(\S+\) #\d+: .+ x86_64$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/ps -e\n"
delay_ms = 100

[[step]]
wait = '^PID PPID UID GID CMD$'
timeout_secs = 30

[[step]]
wait = '^[0-9]+ [0-9]+ [0-9]+ [0-9]+ .+$'
timeout_secs = 30

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "ping 10.0.2.2\n"
delay_ms = 100

[[step]]
wait = '^ping: 10\.0\.2\.2 seq=1 rtt=[0-9]+ms$'
timeout_secs = 60

[[step]]
wait = '^ping: [1-9][0-9]* packets transmitted, [1-9][0-9]* received, 0% packet loss$'
timeout_secs = 60

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60

[[forbid]]
regex = '(?i)panic|EXCEPTION|login: .*incorrect|login: .*failed|ping: .*timeout|command not found'

[[forbid]]
regex = '(?i)SegmentOutsideUserRange|bad ELF|getty failed'

# K174: a failed root mount must not leave a dangling /root in the namespace.
[[forbid]]
regex = "cannot access '/root'|d\\?{9}"
