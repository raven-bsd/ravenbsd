# Q4b trace-demo: a fixture scheme server records one span per request into the shared Q4a sink;
# the controller makes a traced call (TRACE_SET) and an untraced one, then runs the trace command,
# which prints the recorded tree. Runs on x86_64 and aarch64.

name = "trace-demo"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/trace-demo/build.sh"]
initfs = "build/fixtures/trace-demo/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^demo: server ready$'

[[expect]]
regex = '^trace: spans=4 gaps=0 traced=2 untraced=2$'

[[expect]]
regex = '^trace: id=0xdeadbeefcafef00d span=0x1 parent=0x0 pid=2 ts=[0-9]+ kind=server op=1$'

[[expect]]
regex = '^trace: id=untraced span=0x3 parent=0x0 pid=2 ts=[0-9]+ kind=server op=1$'

[[expect]]
regex = '^demo: ok$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|demo: failed'
