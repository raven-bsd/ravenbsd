#
# K186: ed reads the consd tty session, not the debug ring. The release login types a normal
# append/write/quit script with no end-of-input marker, so the prompt after `q` proves the
# editor processed commands incrementally. The second session re-opens the written file and
# substitutes a line that was never typed, proving `cat` reads the file rather than the echo.

name = "ed-console"
arch = "x86_64"
profile = "release"
timeout_secs = 180
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '(?i)^.*login: ?root'

[[expect]]
regex = '(?i)^password: ?$'

[[expect]]
regex = '^alpha one$'

[[expect]]
regex = '^beta two$'

[[expect]]
regex = '^ALPHA one$'

[[expect]]
regex = '^gamma three$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|SegmentOutsideUserRange|bad ELF|getty failed|ed: tty:console'

[[step]]
wait = '(?i)^.*login: ?$'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)^password: ?$'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
wait = '^raven# $'
timeout_secs = 30

[[step]]
send = "/bin/ed\n"
delay_ms = 300

[[step]]
send = "a\nalpha one\nbeta two\n.\nw /tmp/ed-console.txt\nq\n"
delay_ms = 300

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "cat /tmp/ed-console.txt\n"
delay_ms = 100

[[step]]
wait = '^alpha one$'
timeout_secs = 15

[[step]]
wait = '^beta two$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "/bin/ed /tmp/ed-console.txt\n"
delay_ms = 300

[[step]]
send = "1s/alpha/ALPHA/\n$a\ngamma three\n.\nw\nq\n"
delay_ms = 300

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "cat /tmp/ed-console.txt\n"
delay_ms = 100

[[step]]
wait = '^ALPHA one$'
timeout_secs = 15

[[step]]
wait = '^beta two$'
timeout_secs = 15

[[step]]
wait = '^gamma three$'
timeout_secs = 15

[[step]]
wait = '^raven# $'
timeout_secs = 15

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 30
