# S76c `smp_user=off` baseline: same eight-thread ring, FP/SIMD and TLB churn, but the kernel keeps
# every user thread on CPU 0. Per-CPU work must collapse onto cpu0.
name = "smp-soak-off-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/fixtures/smp-soak-aarch64/build.sh"]
initfs = "build/fixtures/smp-soak-aarch64/smp-soak-off-aarch64.img"
boot_cmdline = "console=ttyAMA0 test-exit=1 smp_user=off"
qemu_extra = ["-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^smp-soak-aarch64: workers=8 duration_s=60 cpus=4 mode=off$'

[[expect]]
regex = '^smp-soak-aarch64: thread \d tid=\d+ count=[1-9]\d* cpu~0$'

[[expect]]
regex = '^smp-soak-aarch64: per-cpu cpu0=[1-9]\d* cpu1=0 cpu2=0 cpu3=0$'

[[expect]]
regex = '^smp-soak-aarch64: hops=[1-9]\d* total=[1-9]\d* churn=[1-9]\d* ops_per_s=\d+$'

[[expect]]
regex = '^smp-soak-aarch64: latency p50_ns=\d+ p99_ns=\d+ samples=[1-9]\d*$'

[[expect]]
regex = '^smp-soak-aarch64: complete workers=8$'

[[expect]]
regex = '^smp-soak-aarch64: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-soak-aarch64: failed|smp-soak-aarch64: fp_bad|smp-soak-aarch64: map_bad'
