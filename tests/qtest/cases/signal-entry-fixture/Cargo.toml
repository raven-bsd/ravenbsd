[package]
name = "raven-s44-signal"
version = "0.1.0"
description = "S44 fixture: SIG_SETUP entry, kick delivery, SIGRETURN and sticky EINTR fallback."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s44-signal"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
