# L3: a low-priority owner is boosted by a high-priority waiter on a kernel Mutex, wake-one hands
# the mutex off, and the owner's base priority is restored on unlock.

name = "locking"
arch = "x86_64"
profile = "base"
timeout_secs = 60
boot_cmdline = "console=ttyS0 test-exit=1 selftest=locking"
expect_exit = "success"

[[expect]]
regex = '^locking: ok owner_boost=0 handoff=ok restored=ok$'

[[forbid]]
regex = '(?i)locking: fail|panic'
