# S205: DRV1's acceptance case for the virtio-blk function. The image boots the `base` profile
# with the virtio-blk device added by this case; the fixture stages the Rust userland initfs
# (pcid, devd, the virtio-blk driver and the S205 Rust probe). Cycle 1 writes/verifies the
# deterministic partition and data patterns on a small raw disk, the probe reads both back
# through `disk:0` and flushes, and cycle 2 re-reads the persisted data after the driver restarts.

name = "virtio-blk-test"
arch = "x86_64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/fixtures/virtio-blk/build.sh"]
initfs = "build/fixtures/virtio-blk/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-smp", "1",
    "-drive", "if=none,id=d0,format=raw,file=build/fixtures/virtio-blk/disk.img",
]
expect_exit = "success"

[[expect]]
regex = '^pcid: devices=[1-9][0-9]*$'

[[expect]]
regex = '^svcd: pcid up$'

[[expect]]
regex = '^devd: matched [0-9a-f]{2}:[0-9a-f]{2}\.[0-9] vendor=0x1af4 device=0x1042 irq_line=[0-9]+ irq_pin=[0-9]+$'

[[expect]]
regex = '^devd: driver virtio-blk bar=4 size=16384$'

[[expect]]
regex = '^devd: driver virtio-blk dma bus=0x[0-9a-f]+ len=65536$'

[[expect]]
regex = '^devd: driver virtio-blk msix capability table_bar=1 table=0x0 entries=2$'

[[expect]]
regex = '^devd: driver virtio-blk msix vector=[0-9]+ table=0x0 bar=1$'

[[expect]]
regex = '^virtio-blk: id=1af4:1042$'

[[expect]]
regex = '^virtio-blk: capacity=4096 sector_size=512 ro=0$'

[[expect]]
regex = '^virtio-blk: features=0x[0-9a-f]{8} version1=1$'

[[expect]]
regex = '^virtio-blk: queue0 size=8 notify=0x[0-9a-f]+$'

[[expect]]
regex = '^virtio-blk: dma bus=0x[0-9a-f]+ len=65536 irq=[0-9]+$'

[[expect]]
regex = '^virtio-blk: pattern sectors=2048 checksum=0x[0-9a-f]{16}$'

[[expect]]
regex = '^virtio-blk: marker ok$'

[[expect]]
regex = '^virtio-blk: serving$'

[[expect]]
regex = '^svcd: devd up$'
unordered = true

[[expect]]
regex = '^s205: probe info sectors=4096 ro=0$'

[[expect]]
regex = '^s205: probe partition 34\.\.1800$'

[[expect]]
regex = '^s205: probe data sectors=2048$'

[[expect]]
regex = '^s205: probe flush ok$'

[[expect]]
regex = '^virtio-blk: serve done$'

[[expect]]
regex = '^devd: driver virtio-blk cycle 1 exit=0$'

[[expect]]
regex = '^virtio-blk: partition pattern ok sectors=1767$'

[[expect]]
regex = '^virtio-blk: cycle 2 data ok checksum=0x[0-9a-f]{16}$'

[[expect]]
regex = '^virtio-blk: done$'

[[expect]]
regex = '^devd: driver virtio-blk cycle 2 exit=0$'

[[expect]]
regex = '^devd: driver virtio-blk cycles=2$'

[[expect]]
regex = '^s205: probe devd done$'

[[expect]]
regex = '^s205: probe ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|virtio-blk: .*error|virtio-blk: .*timed out|I/O error|s205: probe:'
