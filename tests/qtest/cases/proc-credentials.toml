# P2c credentials: saved uid/gid rules, supplementary groups, privilege-drop rejection and fork
# inheritance of the full credential set.

name = "proc-credentials"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/fixtures/proc-credentials/build.sh"]
initfs = "build/fixtures/proc-credentials/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"

[[expect]]
regex = '^proc-credentials: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|proc-credentials: fail'
