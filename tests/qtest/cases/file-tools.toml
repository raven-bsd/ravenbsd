name = "file-tools"
arch = "x86_64"
profile = "file-tools-test"
timeout_secs = 240
pre = ["sh crates/raven-tool-core/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^tooltest: ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
