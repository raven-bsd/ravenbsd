# K529 global-authority qtest: uid 1000 is denied CLOCK_SET and DTrace control; root succeeds.

name = "capability"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/qtest/cases/capability.d/build.sh"]
initfs = "build/fixtures/capability/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^capability: root clock ok$'

[[expect]]
regex = '^capability: child clock eperm ok$'

[[expect]]
regex = '^capability: child dtrace eperm ok$'

[[expect]]
regex = '^capability: child probe-list ok$'

[[expect]]
regex = '^capability: child ok$'

[[expect]]
regex = '^capability: no record leak ok$'

[[expect]]
regex = '^capability: root dtrace ok$'

[[expect]]
regex = '^capability: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|capability: fail'
