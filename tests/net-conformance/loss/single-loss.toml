name = "single-loss"
runner = "tests/net-conformance/loss/run.sh"
donor = ["FreeBSD sys/netinet/tcp_timer.c: tcp_timer_rexmt", "FreeBSD sys/netinet/tcp_output.c: tcp_output retransmit path"]
rfcs = ["RFC 9293 section 3.8.3 (retransmission timeout)"]

[[expect]]
step = "first data segment is dropped"
packet = "data"
assert = "44-byte segment at server_isn+1 is not acknowledged"

[[expect]]
step = "RTO fires"
packet = "retransmit"
assert = "exactly one retransmission; same seq, same 44 bytes"

[[expect]]
step = "peer ACKs the recovered segment"
packet = "ACK"
assert = "ack=server_isn+45; no further data"
