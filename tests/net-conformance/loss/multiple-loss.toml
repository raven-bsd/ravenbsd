name = "multiple-loss"
runner = "tests/net-conformance/loss/run.sh"
donor = ["FreeBSD sys/netinet/tcp_timer.c: tcp_timer_rexmt backoff", "FreeBSD sys/netinet/tcp_output.c: tcp_output retransmit path"]
rfcs = ["RFC 9293 section 3.8.3 (RTO backoff)"]

[[expect]]
step = "first data segment is dropped"
packet = "data"
assert = "44-byte segment at server_isn+1 is not acknowledged"

[[expect]]
step = "first retransmission is also dropped"
packet = "retransmit"
assert = "same seq and bytes; no ACK"

[[expect]]
step = "the backed-off RTO fires again"
packet = "retransmit"
assert = "a second retransmission of the same seq and bytes; two retries total"
