name = "dup-ack"
runner = "tests/net-conformance/loss/run.sh"
donor = ["FreeBSD sys/netinet/tcp_input.c: duplicate-ACK handling", "FreeBSD sys/netinet/tcp_output.c: fast retransmit path"]
rfcs = ["RFC 9293 section 3.8.4 (fast retransmit)"]

[[expect]]
step = "data segment is withheld"
packet = "data"
assert = "44-byte segment at server_isn+1 is not acknowledged"

[[expect]]
step = "three duplicate ACKs are sent"
packet = "ACK"
assert = "ack=server_isn+1, window=65535, identical sequence"

[[expect]]
step = "sender retransmits the withheld segment"
packet = "retransmit"
assert = "same seq and 44 bytes; at least one retransmit"
