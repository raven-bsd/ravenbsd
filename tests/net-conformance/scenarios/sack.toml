name = "sack"
port = 24008
baseline = "timeout 180 sudo -n python3 tests/net-conformance/baselines/linux/run.py --scenario sack"
donor = [
  "NetBSD sys/netinet/tcp_input.c:tcp_input (SACK permitted option)",
  "NetBSD sys/netinet/tcp_output.c:tcp_output (SACK option emission)",
]
rfcs = ["RFC 2018 (TCP SACK permitted)"]

[[expect]]
step = "peer SYN offers SACK permitted"
packet = "SYN"
assert = "server SYN-ACK echoes SACK permitted"

[[expect]]
step = "peer completes the handshake"
packet = "ACK"
assert = "connection established"
