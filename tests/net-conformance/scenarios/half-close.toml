name = "half-close"
port = 24005
baseline = "timeout 180 sudo -n python3 tests/net-conformance/baselines/linux/run.py --scenario half-close"
donor = [
  "NetBSD sys/netinet/tcp_input.c:tcp_input (FIN -> CloseWait)",
  "NetBSD sys/netinet/tcp_output.c:tcp_output (FIN/ACK emission)",
]
rfcs = ["RFC 9293 section 3.5 (half-close and FIN handshake)"]

[[expect]]
step = "peer completes the handshake"
packet = "SYN/ACK"
assert = "established connection"

[[expect]]
step = "peer sends FIN+ACK"
packet = "FIN"
assert = "server ACKs the FIN"

[[expect]]
step = "server application reads EOF and closes"
packet = "FIN"
assert = "server FIN arrives; peer ACKs it"
