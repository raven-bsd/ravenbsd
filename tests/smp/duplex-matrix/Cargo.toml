[package]
name = "raven-duplex-matrix"
version = "0.1.0"
description = "K496 duplex semantics matrix: ownership, cycles, truncation, partial reads, abandoned transfers and a 10k-op fuzz."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-duplex-matrix-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
