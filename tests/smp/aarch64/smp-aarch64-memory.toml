# K484: aarch64 memory parity. The memory init keeps the K467 PROT_NONE vectors and runs the K475
# frame-exhaustion row: two concurrent children map 1 MiB chunks until three consecutive ENOMEM,
# verify a distinct pattern per page, and release all frames. The parent allocation and the s24
# baseline are checked by run-memory.sh. The timing-sensitive four-way TLB stress stays in
# smp-tlb-aarch64-concurrent, so a TCG host-load shootdown flake cannot mask the memory row.
name = "smp-aarch64-memory"
arch = "aarch64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/smp/aarch64/build-memory.sh"]
initfs = "build/smp-aarch64-memory/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1 smp_user=on smp-user-trace s24-framecheck"
qemu_extra = ["-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^smp-aarch64-memory: start$'

[[expect]]
regex = '^smp-aarch64-copy: ok$'

[[expect]]
regex = '^smp-aarch64-oom: round=1 children=2$'

[[expect]]
regex = '^smp-aarch64-oom: pass refusals=\d+ frames_back=\d+$'

[[expect]]
regex = '^smp-aarch64-oom: pass refusals=\d+ frames_back=\d+$'

[[expect]]
regex = '^smp-aarch64-oom: round=1 done$'

[[expect]]
regex = '^smp-aarch64-oom: parent-ok next=4096$'

[[expect]]
regex = '^smp-aarch64-oom: round=2 children=2$'

[[expect]]
regex = '^smp-aarch64-oom: pass refusals=\d+ frames_back=\d+$'

[[expect]]
regex = '^smp-aarch64-oom: pass refusals=\d+ frames_back=\d+$'

[[expect]]
regex = '^smp-aarch64-oom: round=2 done$'

[[expect]]
regex = '^smp-aarch64-oom: parent-ok next=4096$'

[[expect]]
regex = '^smp-aarch64-memory: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-aarch64-memory: fail|smp-aarch64-copy: fail|smp-aarch64-oom: fail|aarch64-smp: tlb .*(timeout|failed)'
