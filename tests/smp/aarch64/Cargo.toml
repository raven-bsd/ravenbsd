[package]
name = "raven-smp-aarch64"
version = "0.1.0"
description = "S106 aarch64 four-way concurrent unmap/TLB-shootdown regression."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-smp-aarch64-init"
path = "src/main.rs"

[[bin]]
name = "raven-smp-aarch64-memory-init"
path = "src/memory.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
