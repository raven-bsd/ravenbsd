# K527: 128 kernel threads at one priority (twice the historic 64-slot level)
# must all complete; the monitor also requires the 10k-schedule stress bound.

name = "sched-saturation"
arch = "x86_64"
profile = "base"
timeout_secs = 120
boot_cmdline = "console=ttyS0 test-exit=1 selftest=sched-saturation"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^sched-saturation: spawned=128 cap=1024$'

[[expect]]
regex = '^sched-saturation: done=128 lost=0 switches=[0-9]+$'

[[expect]]
regex = '^CONTRACT K527 PASS switches=[0-9]+$'

[[forbid]]
regex = '(?i)fail|panic|EXCEPTION|lost=[1-9]'
