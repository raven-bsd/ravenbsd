name = "ipc-fuzz-kvm2"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/smp/ipc-fuzz/build.sh"]
initfs = "build/ipc-fuzz/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "2"]
expect_exit = "success"

[[expect]]
regex = '^ipc-fuzz: start seed=0x[0-9a-f]+ groups=[0-9]+ packet=536$'

[[expect]]
regex = '^ipc-fuzz: summary rows=[0-9]+ deviations=0 seed=0x[0-9a-f]+ table-hash=0x[0-9a-f]{16}$'

[[expect]]
regex = '^ipc-fuzz: alive$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|setup-failed|ipc-fuzz: failed'
