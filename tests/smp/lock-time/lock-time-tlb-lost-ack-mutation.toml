# S195 mutation: drop one ack and the row must fail. The green case's expectations are kept so
# this run is red exactly when the dropped acknowledgement is reported.
name = "smp-lock-time-tlb-lost-ack-mutation"
arch = "x86_64"
profile = "base"
timeout_secs = 120
boot_cmdline = "console=ttyS0 test-exit=1 selftest=smp selftest-tlb-drop-ack=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^selftest: smp tlb lost-nmi ok elapsed_ms=\d+$'

[[expect]]
regex = '^selftest: smp tlb delayed-ack ok elapsed_ms=\d+$'

[[expect]]
regex = '^selftest: smp ok cpus=4 switches=\d+$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|tlb shootdown timeout|selftest: smp tlb .*failed'
