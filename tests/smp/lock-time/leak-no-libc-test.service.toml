#
# The core base image runs a libc thread stress service. Replace it with the fixture's no-op
# mode so it exits before the frame-window measurement starts.

name = "libc-test"
exec = "/bin/smp-lock-time"
args = ["/bin/smp-lock-time", "noop"]
needs = []
readiness = "none"
restart = "never"
max_restarts = 0
required = false
