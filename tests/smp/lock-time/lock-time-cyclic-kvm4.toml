# Rev 108: per-CPU cyclic attribution under KVM with four vCPUs.
# Each CPU gets a short, long, cancelled and re-armed timer; one load worker per CPU runs
# during the window. Every active timer must fire once on its owner CPU inside 100 ms.

name = "lock-time-cyclic-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 120
boot_cmdline = "console=ttyS0 test-exit=1 selftest=cyclic-smp"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^smp: 4 cpus online$'

[[expect]]
regex = '^cyclic-smp: ok cpus=4 expected=12 fired=12 cancelled=4 wrong=0 lost=0 dup=0 early=0 late=0 min_us=\d+ p50_us=\d+ max_us=\d+ load_workers=4 load_hops=\d+ cpu0=3 cpu1=3 cpu2=3 cpu3=3$'

[[forbid]]
regex = '(?i)cyclic-smp: fail|panic|EXCEPTION'
