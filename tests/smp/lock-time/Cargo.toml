[workspace]

[package]
name = "raven-smp-lock-time"
version = "0.1.0"
description = "S85a SMP lock/time/IPI stress fixture: futex turnstile ring, per-CPU timer cadence, preemption churn."
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.85"

[package.metadata.raven]
target = "none"

[[bin]]
name = "smp-lock-time-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
