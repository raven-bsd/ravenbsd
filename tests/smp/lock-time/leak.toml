name = "smp-lock-time-leak"
arch = "x86_64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/smp/lock-time/build.sh"]
initfs = "build/smp/lock-time/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on s36-lockcheck=1"
qemu_extra = []
expect_exit = "success"

# The kernel's `s36-lockcheck` diagnostic samples `frame::stats().allocated_bytes` when a process
# exits 90 (baseline) and 91 (sample). The fixture spawns two marker children around the lock/time
# churn, so the delta covers only this suite's work.
[[step]]
wait = '^lock-time: ready$'
send = "leak\n"
delay_ms = 50

[[expect]]
regex = '^s36: lockcheck base allocated=[0-9]+$'

[[expect]]
regex = '^lock-time: leak churn wake=5000 timeout=1000$'

[[expect]]
regex = '^s36: lockcheck delta=[0-9]+ allocated=[0-9]+$'

[[expect]]
regex = '^s36: lockcheck ok$'

[[expect]]
regex = '^lock-time: leak done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|lock-time: failed|s36: lockcheck leak'
