#
# The core base image carries the initfs and file schemes but no resolver. This manifest starts
# the same resolvd binary with only the initfs dependency, so the boot-service frame-window case
# measures the resolver's real startup beside the lock/time churn.

name = "resolvd"
exec = "/sbin/resolvd"
needs = ["scheme:initfs"]
provides = ["scheme:resolv"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "never"
max_restarts = 0
required = false
