#
# K530 join-lifetime fixture on 4 CPUs: 64 threads x 8 rounds, all released together and joined.
# The join must wait for the kernel THREAD_EXIT clear word before unmapping the user stack.

name = "smp-stack-join-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 360
pre = ["sh tests/smp/stack/build.sh"]
initfs = "build/smp/stack/join-initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 s69-cleanupcheck s69-stackcheck"
qemu_extra = ["-accel", "kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^stack-selftest: guard-unmapped ok$'

[[expect]]
regex = '^stack-selftest: reuse-zero ok$'

[[expect]]
regex = '^stack-join: start rounds=8 threads=64$'

[[expect]]
regex = '^stack-join: done rounds=8 threads=64$'

[[expect]]
regex = '^s69: exit s69-stack-join .*stack_fresh=[0-9]+ stack_cached=[0-9]+ heap=[0-9]+$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|stack-join: fail|killed by page fault'

[[forbid]]
regex = '^stack-cache: DROPPED '
