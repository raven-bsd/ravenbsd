# K530 kernel stack lifetime on 2 CPUs (the same guest and bounded-steady-state assertions).

name = "smp-stack-kvm2"
arch = "x86_64"
profile = "base"
timeout_secs = 360
pre = ["sh tests/smp/stack/build.sh"]
initfs = "build/smp/stack/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 s69-cleanupcheck s69-stackcheck"
qemu_extra = ["-accel", "kvm", "-cpu", "host", "-smp", "2"]
expect_exit = "success"

[[expect]]
regex = '^stack-selftest: guard-unmapped ok$'

[[expect]]
regex = '^stack-selftest: reuse-zero ok$'

[[expect]]
regex = '^stack: start threads=80 cycles=10$'

[[expect]]
regex = '^stack: cycle=10 done$'

[[expect]]
regex = '^stack: done$'

[[expect]]
regex = '^s69: exit s69-stack .*stack_fresh=[0-9]+ stack_cached=[0-9]+ heap=[0-9]+$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|stack: fail'

[[forbid]]
regex = '^stack-cache: DROPPED '
