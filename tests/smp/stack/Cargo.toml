[workspace]

[package]
name = "raven-smp-stack"
version = "0.1.0"
description = "K530 kernel stack lifetime fixture: thread churn reaches a bounded steady state."
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.85"

[package.metadata.raven]
target = "none"

[[bin]]
name = "smp-stack-init"
path = "src/main.rs"

[[bin]]
name = "smp-stack-join"
path = "src/join.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
