[workspace]

[package]
name = "raven-smp-handles"
version = "0.1.0"
description = "K528 capability lineage race fixture: a completed ancestor revoke binds every descendant."
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.85"

[package.metadata.raven]
target = "none"

[[bin]]
name = "smp-handles-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
