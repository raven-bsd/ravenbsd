[package]
name = "raven-handles-smp"
version = "0.1.0"
description = "K528 capability-lineage SMP fixture: ancestor revoke binds install-before-register, queued SCM_RIGHTS and a closed intermediate."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-handles-smp-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
