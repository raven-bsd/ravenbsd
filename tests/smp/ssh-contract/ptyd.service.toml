# K435 K5: the pty: scheme server for the PTY contract row.
name = "ptyd"
exec = "/sbin/ptyd"
needs = ["logd"]
provides = ["scheme:pty"]
readiness = "scheme"
ready_timeout_ms = 30_000
restart = "never"
max_restarts = 0
