# K440: guest SSH kernel-contract conformance suite (K1-K10). The fixture runs on the
# network-config-test profile with netd and ptyd; the host peer discovers QEMU's per-run
# ephemeral host ports from the monitor and opens two TCP connections for K6 plus the
# EOF, own-shutdown and half-close connections on guest port 23098.  K8 follows the donor
# EOF contract (POLLOUT stays set); K8-shutdown asserts the write after our SHUT_WR is EPIPE.
name = "ssh-contract-tcg4"
arch = "x86_64"
profile = "network-config-test"
# K495 cap arithmetic from the measured run: 691096 ms measured, ceil(691.096 * 1.25) = 864,
# +30 s margin = 894 s. The measured run started at load1=24.18 (functional budget <=40) and
# ended at load1=49.58; the wall time is host-load dominated, so this is a measured cap, not a
# preference. No assertion or row changed.
timeout_secs = 894
pre = [
    "sh tests/smp/ssh-contract/build.sh",
    "SSH_CONTRACT_K6_READY=1 sh tests/smp/ssh-contract/start-host.sh",
]
initfs = "build/fixtures/ssh-contract/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 priority-debug"
qemu_extra = [
    "-smp", "4",
    "-nic", "none",
    "-netdev", "user,id=n0,hostfwd=tcp:127.0.0.1:0-:23096,hostfwd=tcp:127.0.0.1:0-:23097,hostfwd=tcp:127.0.0.1:0-:23098",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-object", "filter-dump,id=f0,netdev=n0,file=build/qtest/ssh-contract-tcg4.pcap",
    "-monitor", "unix:build/fixtures/ssh-contract/monitor.sock,server=on,wait=off",
]
expect_exit = "success"

[[expect]]
regex = '^.*CONTRACT K1 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K2 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K3 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K4 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K5 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K6 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K7 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K8 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K8-shutdown PASS .*$'

[[expect]]
regex = '^.*CONTRACT K9 PASS .*$'

[[expect]]
regex = '^.*CONTRACT K10 PASS .*$'

[[expect]]
regex = '^.*CONTRACT SUMMARY PASS 10/10$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)CONTRACT K([1-9]|10)(-shutdown)? FAIL|CONTRACT SUMMARY FAIL|panic|EXCEPTION'
