# K435: SSH kernel-contract rows 1-3 and the dup readiness half of row 5. The fixture uses a
# real libc socketpair over the kernel duplex endpoint pair. The PTY and fork/exec rows are run
# by tests/smp/ssh-contract/run.sh through libc-forkpty and socketpair-exec/socket-write-exec.
name = "ssh-contract"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/smp/ssh-contract/build.sh"]
initfs = "build/fixtures/ssh-contract/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^ssh-contract: poll ok$'

[[expect]]
regex = '^ssh-contract: read ok$'

[[expect]]
regex = '^ssh-contract: write ok$'

[[expect]]
regex = '^ssh-contract: dup ok$'

[[expect]]
regex = '^ssh-contract: ok$'

[[expect]]
regex = '^svcd: settled$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|ssh-contract: fail'
