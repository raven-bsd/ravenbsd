[package]
name = "raven-syscall-fuzz"
version = "0.1.0"
description = "K456 syscall robustness measurement: every ABI syscall against deterministic garbage vectors."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-syscall-fuzz-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
