# K540: 10,000 fork+exec+exit cycles from two controller processes on KVM with four vCPUs.
name = "smp-memory-churn-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 900
pre = ["sh tests/smp/memory/build.sh"]
initfs = "build/smp-memory/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on smp-user-trace s24-framecheck init=/churn"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^churn: warmup$'

[[expect]]
regex = '^churn: baseline$'

[[expect]]
regex = '^churn: start cycles=10000$'

[[expect]]
regex = '^churn: controller start id=0$'
unordered = true

[[expect]]
regex = '^churn: controller start id=1$'
unordered = true

[[expect]]
regex = '^churn: controller done id=0 cycles=5000$'
unordered = true

[[expect]]
regex = '^churn: controller done id=1 cycles=5000$'
unordered = true

[[expect]]
regex = '^churn: done cycles=10000$'

[[expect]]
regex = '^smp-memory: churn ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|churn: FAIL|smp-memory: failed'
