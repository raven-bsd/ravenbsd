name = "smp-memory-kvm4"
arch = "x86_64"
profile = "base"
timeout_secs = 300
pre = ["sh tests/smp/memory/build.sh"]
initfs = "build/smp-memory/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on smp-user-trace s24-framecheck"
qemu_extra = ["-enable-kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^smp-user: cpu [1-9] first user thread pid=\d+ tid=\d+$'
unordered = true

[[expect]]
regex = '^smp-memory: start workers=3$'

[[expect]]
regex = '^smp-memory: tlb map=0x[0-9a-f]+ alias=0x[0-9a-f]+$'

[[expect]]
regex = '^smp-memory: concurrent-shootdown waiters=4$'

[[expect]]
regex = '^smp-memory: workers ready$'

[[expect]]
regex = '^CONTRACT K1 PASS .*$'

[[expect]]
regex = '^CONTRACT K2 PASS .*$'

[[expect]]
regex = '^CONTRACT K3 PASS .*$'

[[expect]]
regex = '^CONTRACT K4 PASS .*$'

[[expect]]
regex = '^CONTRACT K5 PASS .*$'

[[expect]]
regex = '^CONTRACT K6 PASS .*$'

[[expect]]
regex = '^CONTRACT K7 PASS .*$'

[[expect]]
regex = '^smp-memory: contract PASS 7/7$'

[[expect]]
regex = '^oom: round=[12] children=2$'

[[expect]]
regex = '^oom: round=[12] done$'

[[expect]]
regex = '^oom: pass refusals=\d+ frames_back=\d+$'

[[expect]]
regex = '^oom: parent-ok next=4096$'

[[expect]]
regex = '^smp-memory: summary alloc_ops=\d+ fault_pages=\d+ maps=\d+ forks=4 tlb_rounds=64 tlb_stale=0$'

[[expect]]
regex = '^smp-memory: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-memory: failed|smp-memory: worker .* failed|stale round|tlb shootdown timeout|oom: fail'
