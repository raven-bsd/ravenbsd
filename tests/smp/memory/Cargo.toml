[package]
name = "raven-smp-memory"
version = "0.1.0"
description = "S85b SMP memory/paging/TLB stress fixture: alloc/free, faults, map/unmap, fork/exit, shootdowns."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-smp-memory-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
