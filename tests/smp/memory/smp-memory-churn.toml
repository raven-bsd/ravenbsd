# K540: 10,000 fork+exec+exit cycles from two controller processes. The kernel prints
# `s24: frames free=` on every child exit; the run.sh frame check reads the cycle-0 baseline and
# the 1k/5k/10k checkpoints and fails on any growing delta.
name = "smp-memory-churn"
arch = "x86_64"
profile = "base"
timeout_secs = 900
pre = ["sh tests/smp/memory/build.sh"]
initfs = "build/smp-memory/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on smp-user-trace s24-framecheck init=/churn"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^churn: warmup$'

[[expect]]
regex = '^churn: baseline$'

[[expect]]
regex = '^churn: start cycles=10000$'

[[expect]]
regex = '^churn: controller start id=0$'
unordered = true

[[expect]]
regex = '^churn: controller start id=1$'
unordered = true

[[expect]]
regex = '^churn: controller done id=0 cycles=5000$'
unordered = true

[[expect]]
regex = '^churn: controller done id=1 cycles=5000$'
unordered = true

[[expect]]
regex = '^churn: done cycles=10000$'

[[expect]]
regex = '^smp-memory: churn ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|churn: FAIL|smp-memory: failed'
