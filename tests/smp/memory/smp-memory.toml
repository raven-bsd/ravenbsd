name = "smp-memory"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/smp/memory/build.sh"]
initfs = "build/smp-memory/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on smp-user-trace"
qemu_extra = []
expect_exit = "success"

# The kernel trace proves a user thread ran on an application processor; the user fixture then
# runs the allocator, page-fault, map/unmap, fork/exit and TLB-shootdown loops.
[[expect]]
regex = '^smp-user: cpu [1-9] first user thread pid=\d+ tid=\d+$'
unordered = true

[[expect]]
regex = '^smp-memory: start workers=3$'

[[expect]]
regex = '^smp-memory: tlb map=0x[0-9a-f]+ alias=0x[0-9a-f]+$'

[[expect]]
regex = '^smp-memory: workers ready$'

[[expect]]
regex = '^smp-memory: summary alloc_ops=\d+ fault_pages=\d+ maps=\d+ forks=4 tlb_rounds=64 tlb_stale=0$'

[[expect]]
regex = '^smp-memory: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|smp-memory: failed|smp-memory: worker .* failed|stale round|tlb shootdown timeout'
