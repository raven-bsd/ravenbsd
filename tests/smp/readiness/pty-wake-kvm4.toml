# K495 rev156: pty-master ppoll/SIGCHLD discriminator.
# R1: child exits with an explicit slave close; the master must report HUP/readable without a
#     SIGCHLD handler and ppoll must not return EINTR.
# R2: same child with a caught SIGCHLD handler; the handler must run and ppoll must return
#     EINTR or a ready master/self-pipe.
# R3: child writes and exits without an explicit close; the master must still report HUP.

name = "smp-readiness-pty-wake"
arch = "x86_64"
profile = "network-config-test"
# K495 rev300: the quiet run measured 66.668 s (boot report devd at 60 s). The shared-host
# boot has exceeded 120 s under build load; 240 s is the measured run plus the boot-load margin.
timeout_secs = 240
pre = ["sh tests/smp/readiness/build-pty-wake.sh"]
initfs = "build/smp/readiness/pty-wake/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on"
qemu_extra = ["-accel", "kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^.*PTY-WAKE start$'

[[expect]]
regex = '^.*PTY-WAKE R1 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE R2 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE R3 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE R4 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE R5 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE SUMMARY PASS 5/5$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|PTY-WAKE .* FAIL'
