# K495 rev168: TCG4 twin of pty-wake-kvm4.toml. Same fixture, initfs and rows; QEMU runs with
# `-accel tcg` at `-smp 4` so the pty-wake row has independent KVM4/TCG4 evidence.

name = "smp-readiness-pty-wake-tcg4"
arch = "x86_64"
profile = "network-config-test"
timeout_secs = 240
pre = ["sh tests/smp/readiness/build-pty-wake.sh"]
initfs = "build/smp/readiness/pty-wake/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on"
qemu_extra = ["-accel", "tcg", "-smp", "4", "-nic", "user,model=virtio-net-pci"]
expect_exit = "success"

[[expect]]
regex = 'PTY-WAKE start$'

[[expect]]
regex = 'PTY-WAKE R1 .* ok$'

[[expect]]
regex = 'PTY-WAKE R2 .* ok$'

[[expect]]
regex = 'PTY-WAKE R3 .* ok$'

[[expect]]
regex = 'PTY-WAKE R4 .* ok$'

[[expect]]
regex = 'PTY-WAKE R5 .* ok$'

[[expect]]
regex = 'PTY-WAKE R6 .* ok$'

[[expect]]
regex = 'PTY-WAKE SUMMARY PASS 6/6$'

[[expect]]
regex = '^.*PTY-WAKE R4 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE R5 .* ok$'

[[expect]]
regex = '^.*PTY-WAKE SUMMARY PASS 5/5$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|PTY-WAKE .* FAIL'
