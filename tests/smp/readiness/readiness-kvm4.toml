name = "smp-readiness-kvm4"
arch = "x86_64"
profile = "base"
# K556 measured budget: three warm runs 5804/4749/4503 ms. ceil(5.804 * 1.25) = 8 s,
# + 5 s margin = 13 s; rounded to 15 s. The gate preflight holds load <= 5 and no competing QEMU.
timeout_secs = 15
pre = ["sh tests/smp/readiness/build.sh"]
initfs = "build/smp/readiness/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1 smp_user=on"
qemu_extra = ["-accel", "kvm", "-cpu", "host", "-smp", "4"]
expect_exit = "success"

[[expect]]
regex = '^readiness: start$'

[[expect]]
regex = '^readiness: lost-wake rounds=[1-9][0-9]* timeouts=0 ok$'

[[expect]]
regex = '^readiness: hup-repoll first=0x[0-9a-f]+ second=0x[0-9a-f]+ ok$'

[[expect]]
regex = '^readiness: eintr retries=[1-9][0-9]* result=1 ok$'

[[expect]]
regex = '^readiness: sibling-exit pipe=ok futex=ok event=ok$'

[[expect]]
regex = '^readiness: proc-wait first_pid=[0-9]+ first_status=[0-9]+ second_pid=[0-9]+ second_status=[0-9]+ ok$'

[[expect]]
regex = '^readiness: sshd-shape handler=[1-9][0-9]* eintr=[0-9]+ event=hup waitpid=19712 ok$'

[[expect]]
regex = '^net-child: before net=EACCES file=EACCES$'

[[expect]]
regex = '^net-child: after net=ok file=ok bind=ok listen=ok$'

[[expect]]
regex = '^readiness: net-listen ok$'

[[expect]]
regex = '^readiness: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|readiness: failed'
