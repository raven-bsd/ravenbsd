# K478 VFS path fuzz: one-shot service after vfsd/initfsd are ready.

name = "vfs-fuzz"
exec = "/bin/vfs-fuzz"
needs = ["scheme:file", "consd", "logd"]
readiness = "none"
restart = "never"
max_restarts = 0
