# K26a: brush is the target interactive shell, but its target build is deferred until the C64f
# std runtime is complete. The case is intentionally skipped so `qtest --all` stays honest; it
# will be enabled with the brush profile once the
# nix/mio/rustix/socket2/uzers ravenbsd OS modules and /bin/brush exist.
name = "shell-brush"
arch = "x86_64"
profile = "shell-test"
timeout_secs = 420
skip = "brush target build blocked in dependency OS modules and remaining libc API; see tickets/kevin/reports/K26a.md"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^brush: ready$'

[[expect]]
regex = '^init exited \(0\)$'
