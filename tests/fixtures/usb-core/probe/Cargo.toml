[package]
name = "raven-usb-core-probe"
version = "0.1.0"
description = "S61 guest probe: synthetic USB descriptor parsing, enumeration, address and hub state."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-usb-core-probe"
path = "src/main.rs"

[dependencies]
raven-usb-core = { path = "../../../../crates/raven-usb-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
