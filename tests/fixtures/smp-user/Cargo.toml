[package]
name = "raven-smp-user"
version = "0.1.0"
description = "S75 x86-64 user SMP fixture: user threads on every CPU, cross-CPU wake and fault isolation."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-smp-user-init"
path = "src/bin/init.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
