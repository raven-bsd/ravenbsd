#
# The hw-fs root image: the bootstrap services are resident for the two boots; the probe is a
# one-shot. No restart loop should hide a failure.

logd_restart="never"
initfsd_restart="never"
ramfsd_restart="never"
nulld_restart="never"
zerod_restart="never"
randd_restart="never"
blockd_restart="never"
fsd_ufs_restart="never"
vfsd_restart="never"
pcid_restart="never"
devd_restart="never"
