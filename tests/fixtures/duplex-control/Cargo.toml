[package]
name = "raven-duplex-control-tests"
version = "0.1.0"
description = "K210 duplex control-message fixture."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

# Standalone workspace: the fixture is not a root workspace member.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package.metadata.raven]
target = "none"

[[bin]]
name = "duplex-control-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }
