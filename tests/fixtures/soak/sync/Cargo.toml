#
# Standalone fixture crate (its own workspace): the K228 soak workload uses this static
# binary to exercise the product `file:` Sync call. It is built by scripts/soak.sh and
# staged into the soak initfs at /bin/soak-sync; it is not a root workspace member.

[package]
name = "raven-soak-sync"
version = "0.1.0"
description = "K228 soak sync fixture: flush filesystem state through raven_rt."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[workspace]

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", features = ["alloc"] }
