# One-shot session for the modern-admin qtest: every resident service the shell profile starts is
# pinned to "never" so `exit_when_exits = rsh` can end svcd as soon as the shell leaves.

logd_restart="never"
sysd_restart="never"
randd_restart="never"
zerod_restart="never"
nulld_restart="never"
ramfsd_restart="never"
initfsd_restart="never"
consd_restart="never"
vfsd_restart="never"
