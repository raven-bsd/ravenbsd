# QEMU `virtio-blk-pci,drive=d0,disable-legacy=on`: vendor 0x1af4, device 0x1042. The `test`
# token makes the driver write its deterministic pattern and exit after the probe flushes;
# `cycles = 2` exercises the restart path, and the second launch verifies the persisted data.
[[driver]]
name = "virtio-blk"
vendor = 0x1af4
device = 0x1042
exec = "/sbin/virtio-blk"
args = ["bar=4", "resources=dma+irq", "test"]
cycles = 2
