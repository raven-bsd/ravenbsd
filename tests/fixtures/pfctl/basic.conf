#
# pfctl subset: pass/block, quick, in/out, on, proto, from/to, ports and
# keep state. The default action is block.
set default block
pass quick in on lo0 all
pass in on em0 inet proto tcp from 10.0.0.0/24 to 192.0.2.10 port 80 keep state
pass out on em0 inet proto udp from any to any port 53 keep state
block in quick on em0 inet proto icmp from any to any
