# pfctl subset: flags, port lists, icmp-type and stateful pass rules.
set default block
pass in on em0 inet proto tcp from any to any port { 80, 443 } flags S/SA keep state
pass out on em0 inet proto tcp from any to any flags S/SA keep state
pass in on em0 inet proto udp from any to any port 53 keep state
pass in on em0 inet proto icmp from any to any icmp-type echo request keep state
