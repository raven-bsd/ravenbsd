#
# pfctl subset: source NAT. Translation precedes filtering; the pass rule
# matches the translated source address.
set default block
nat on em0 inet from 10.0.0.0/24 to any -> 203.0.113.5
pass out on em0 inet proto any from 203.0.113.5 to any keep state
