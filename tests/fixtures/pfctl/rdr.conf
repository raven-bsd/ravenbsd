# pfctl subset: port redirect and 1:1 binat translation.
set default block
pass in on em0 inet proto tcp from any to 203.0.113.5 port 80 keep state
rdr on em0 inet proto tcp from any to 203.0.113.5 port 80 -> 10.0.0.80 port 8080
binat on em0 inet from 10.0.0.80 to any -> 203.0.113.5
