# pfctl subset: persistent and inline tables used by block/pass rules.
set default block
table <blocked> persist { 192.0.2.66, 198.51.100.0/24 }
table <allowed> { 10.0.0.0/8 }
block in quick on em0 inet from <blocked> to any
pass in on em0 inet proto tcp from <allowed> to any port 22 keep state
