#
# The P12 fixture maps the P8 GENET node to platd so devd's generic platform
# launch is exercised without a GENET driver. `fake` selects platd's
# deterministic backend; the BAR is created and transferred but not touched.

[[driver]]
name = "platd"
compatible = "brcm,bcm2711-genet-v5"
exec = "/sbin/platd"
args = ["fake"]
cycles = 1
