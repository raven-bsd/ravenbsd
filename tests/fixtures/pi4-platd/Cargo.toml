[package]
name = "raven-pi4-platd"
version = "0.1.0"
description = "P12 platd fixture: devd launches platd and a client queries the plat: scheme."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "pi4-platd-client"
path = "src/bin/client.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-plat = { path = "../../../crates/raven-plat" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
