[package]
name = "raven-service-restart"
version = "0.1.0"
description = "S70 service restart fixture: a restartable scheme server and a reconnecting client."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-service-restart"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-svc = { path = "../../../crates/raven-proto-svc" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-rt = { path = "../../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
