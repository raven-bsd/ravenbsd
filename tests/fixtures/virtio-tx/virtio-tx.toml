#
# K382 TX-ring stress service. Runs after netd publishes the net scheme; the host peer drives
# 32 KiB in and expects 32 echoes back before it sends the final ack.

name = "virtio-tx"
exec = "/bin/virtio-tx"
needs = ["scheme:net"]
readiness = "none"
restart = "never"
max_restarts = 0
