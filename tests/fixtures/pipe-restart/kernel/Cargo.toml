[package]
name = "raven-pipe-restart-tests"
version = "0.1.0"
description = "S781 pipe-restart kernel and libc fixtures."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "pipe-restart-kernel-init"
path = "src/kernel.rs"
test = false

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
