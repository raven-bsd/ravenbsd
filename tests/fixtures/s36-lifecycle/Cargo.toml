[package]
name = "raven-s36-lifecycle"
version = "0.1.0"
description = "S36 process lifecycle fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s36-lifecycle"
path = "src/main.rs"

[features]
s36-churn-only = []

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
# `raven-scheme` links `alloc` unconditionally, so the fixture needs the runtime allocator even
# though it never allocates.  The no-alloc `raven-spawn` path is proven separately by building
# that crate without features (K463).
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
