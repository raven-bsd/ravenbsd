# S36 timeout-retention probe: terminate a process blocked in a timed futex wait.
name = "s36-lifecycle"
exec = "/bin/s36-lifecycle"
args = ["/bin/s36-lifecycle", "timeout-check"]
needs = []
readiness = "none"
restart = "never"
max_restarts = 0
required = false
