[package]
name = "raven-k68-svc"
version = "0.1.0"
description = "K68 service lifecycle fixture: worker, crash and control client."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-k68-svc"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-svc = { path = "../../../crates/raven-proto-svc" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-rt = { path = "../../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
