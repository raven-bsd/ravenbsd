[package]
name = "raven-trace-context"
version = "0.1.0"
description = "Q3 trace-context fixture: codec round-trip and scheme call/reply."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-trace-context-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-trace-context-server"
path = "src/bin/server.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-proto-trace = { path = "../../../crates/raven-proto-trace" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
