[package]
name = "raven-g1-wrapper"
version = "0.1.0"
description = "Guest argv/env wrapper for the G1 target runner."
edition = "2024"
license = "BSD-3-Clause"
publish = false

# The wrapper is a target-only fixture. It stays out of the root workspace so the host
# `make check-fast` never tries to run it; `tests/fixtures/g1/build-guest.sh` builds it with
# `--manifest-path`.
[workspace]

[[bin]]
name = "raven-g1-wrapper"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../../crates/raven-proto-fs" }
raven-proto-svc = { path = "../../../../crates/raven-proto-svc" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }
