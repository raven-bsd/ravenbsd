[package]
name = "raven-trace-demo"
version = "0.1.0"
description = "Q4b trace-demo fixture: a scheme server recording spans into the shared sink."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_trace_demo"
path = "src/lib.rs"

[[bin]]
name = "raven-trace-demo-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-trace-demo-server"
path = "src/bin/server.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-trace-core = { path = "../../../crates/raven-trace-core" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
trace = { path = "../../../userland/bin/trace" }

[lints]
workspace = true
