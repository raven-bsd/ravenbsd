#
# MPTCP2c fixture service: runs after netd publishes the net scheme. The build compiles the
# mode into the binary (negative: single-path unplug control; positive: MPTCP failover). The
# test-only svcd.conf exits init with this service's status.

name = "mptcp-failover"
exec = "/bin/mptcp-failover"
needs = ["scheme:net"]
readiness = "none"
restart = "never"
max_restarts = 0
