#
# MPTCP2c two-tap static address: the primary bridge is 10.77.1.2/24
# (scripts/qtest-net-two-taps.sh). The backup path is 10.77.2.15/24 and is MPTCP2b's second interface;
# it is not configured here because the current netd attaches one nic:.

[network]
hostname = "raven-mptcp"
mode = "static"

[network.static]
address = "10.77.1.15"
prefix = 24
gateway = "10.77.1.2"
dns = ["10.77.1.2"]
