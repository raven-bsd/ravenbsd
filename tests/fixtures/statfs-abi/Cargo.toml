# Standalone probe: the uutils statfs record is compiled here for the host layout test and for
# the target statfs qtest. It is not a member of the product workspace.

[workspace]

[package]
name = "raven-statfs-abi"
version = "0.1.0"
description = "S775: native statfs record layout test and target statfs probe."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[lib]
name = "raven_statfs_abi"
path = "src/lib.rs"

[[bin]]
name = "raven-statfs-abi"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
