[package]
name = "raven-setuid"
version = "0.1.0"
description = "U3b setuid/setgid exec fixture: init and child helper."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_setuid"
path = "src/lib.rs"

[[bin]]
name = "raven-setuid-init"
path = "src/init.rs"

[[bin]]
name = "raven-setuid-child"
path = "src/child.rs"

[[bin]]
name = "raven-setuid-auxv"
path = "src/auxv.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
