[package]
name = "raven-pipe-tests"
version = "0.1.0"
description = "P2j pipe primitive fixtures and raw process helpers."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_pipe_tests"
path = "src/lib.rs"

[[bin]]
name = "pipe-init"
path = "src/bin/pipe.rs"
test = false

[[bin]]
name = "pipe-fork-init"
path = "src/bin/pipe_fork.rs"
test = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
