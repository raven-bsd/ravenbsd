# Standalone package: a throw-away qtest fixture, not part of the product workspace.
[workspace]

[package]
name = "raven-dtrace-user-fixture"
version = "0.1.0"
description = "S58 fixture: userland DTrace consumer, ring wrap and USDT marker evidence."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-dtrace-user-fixture"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-dtrace-user = { path = "../../../crates/raven-dtrace-user" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
