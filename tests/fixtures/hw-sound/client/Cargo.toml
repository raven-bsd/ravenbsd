[package]
name = "hw-sound-client"
version = "0.1.0"
description = "B44a hw-sound qtest client: 440 Hz through WRITE and the SET_BUFFER ring."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-audio-core = { path = "../../../../crates/raven-audio-core" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-proto-audio = { path = "../../../../crates/raven-proto-audio" }
raven-rt = { path = "../../../../userland/rt", features = ["alloc"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }

[lints]
workspace = true
