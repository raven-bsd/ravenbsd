[package]
name = "raven-proc-primitives"
version = "0.1.0"
description = "P2f process/signal primitive fixtures and host status tests."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_proc_primitives"
path = "src/lib.rs"

[[bin]]
name = "proc-signal-init"
path = "src/bin/signal.rs"
test = false

[[bin]]
name = "proc-session-init"
path = "src/bin/session.rs"
test = false

[[bin]]
name = "proc-exec-init"
path = "src/bin/exec.rs"
test = false

[[bin]]
name = "proc-exec-child"
path = "src/bin/exec_child.rs"
test = false

[[bin]]
name = "proc-priority-init"
path = "src/bin/priority.rs"
test = false

[[bin]]
name = "proc-wait-init"
path = "src/bin/wait.rs"
test = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
