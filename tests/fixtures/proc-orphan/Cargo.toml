[package]
name = "raven-proc-orphan"
version = "0.1.0"
description = "K494 orphan reparent and reap contract fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "proc-orphan-init"
path = "src/main.rs"
test = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
