# QEMU `-device qemu-xhci` is a Red Hat xHCI function (1b36:000d). BAR0 is the MMIO window; the
# driver asks devd for a DMA buffer and the legacy IRQ.
[[driver]]
name = "xhci"
vendor = 0x1b36
device = 0x000d
exec = "/sbin/xhci"
args = ["bar=0", "resources=dma+irq"]
cycles = 1
