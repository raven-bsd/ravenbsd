# Standalone package: a throw-away qtest fixture, not part of the product workspace.
[workspace]

[package]
name = "raven-usb-hotplug"
version = "0.1.0"
description = "S68 fixture: USB HID keyboard/mouse removal, stuck-key release and re-enumeration."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-usb-hotplug"
path = "src/main.rs"

[dependencies]
usb-hid = { path = "../../../userland/drivers/usb-hid" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
