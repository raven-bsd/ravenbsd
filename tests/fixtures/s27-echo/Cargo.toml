[package]
name = "raven-s27-echo"
version = "0.1.0"
description = "S27 console-input fixture: read console bytes and echo them upper-cased."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s27-echo"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false }

[lints]
workspace = true
