[package]
name = "raven-proc-times"
version = "0.1.0"
description = "K508 process accounting contract fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "proc-times-init"
path = "src/main.rs"
test = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
