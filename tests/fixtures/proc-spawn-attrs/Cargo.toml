[package]
name = "raven-proc-spawn-attrs"
version = "0.1.0"
description = "Kernel process spawn attributes: fd map, signal mask and pgroup."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-proc-attrs-init"
path = "src/init.rs"

[[bin]]
name = "raven-proc-attrs-child"
path = "src/child.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
