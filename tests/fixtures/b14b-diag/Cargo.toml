[package]
name = "raven-b14b-diag"
version = "0.1.0"
description = "B14b fixture: run ping, route and netstat against the loopback netd."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-b14b-diag-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-net = { path = "../../../crates/raven-proto-net" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
