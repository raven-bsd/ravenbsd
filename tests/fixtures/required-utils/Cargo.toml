[package]
name = "required-utils"
version = "0.1.0"
description = "P4a10 target gate for the seven required POSIX utilities."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "required-utils-init"
path = "src/init.rs"

[[bin]]
name = "required-utils-true"
path = "src/true.rs"

[[bin]]
name = "required-utils-shell"
path = "src/shell.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
