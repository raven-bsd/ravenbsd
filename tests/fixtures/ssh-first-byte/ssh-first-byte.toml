#
# K567 rev 344: the SSH first-byte gate row. The pre-step builds the release
# image at HEAD (stamped `build/qtest/ssh-first-byte.img.head`), then runs the
# timestamped probe (tests/fixtures/ssh-first-byte/run.sh) against that exact
# image; the probe waits for the sshd `svcd: sshd up` readiness marker before its
# first connect and keeps the 8 s per-connection budget. The case boots the same
# image for the console-login smoke, so the smoke's root/`raven` password is the
# one in the repo's `etc/shadow`, not whatever a stale `ssh-login.img` shipped.

name = "ssh-first-byte"
arch = "x86_64"
profile = "release"
image = "build/qtest/ssh-first-byte.img"
timeout_secs = 300
pre = ["sh tests/fixtures/ssh-first-byte/run.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = 'svcd: getty up'
unordered = true

[[expect]]
regex = '(?i)login: ?root'

[[expect]]
regex = '(?i)password:'

[[expect]]
regex = '^init exited \(0\)$'

[[step]]
wait = '(?i)login:'
timeout_secs = 120

[[step]]
send = "root\n"
delay_ms = 100

[[step]]
wait = '(?i)password:'
timeout_secs = 30

[[step]]
send = "raven\n"
delay_ms = 100

[[step]]
send = "exit 0\n"
delay_ms = 100

[[step]]
wait = '^init exited \(0\)$'
timeout_secs = 60

[[forbid]]
regex = '(?i)panic|EXCEPTION|login: .*incorrect|login: .*failed|bad ELF'

[[forbid]]
regex = '(?i)SegmentOutsideUserRange'
