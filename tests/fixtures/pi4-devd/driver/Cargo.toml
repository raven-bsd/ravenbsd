[package]
name = "pi4-devd-fake-driver"
version = "0.1.0"
description = "Qtest fake platform driver for the devd P8 launch path."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "fake-platform"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
