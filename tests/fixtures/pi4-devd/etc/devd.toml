# P8/P10 qtest: devd launches the fake platform driver with its MMIO/DMA/IRQ grants under its
# real service name. `platform-root` is the devd-only platform root capability (the root device
# with ADMIN only); the pcid-only `root` grant is not used here. It is the only grant, so the
# root handle lands at handle 3 as devd's launch path expects.
name = "devd"
exec = "/sbin/devd"
args = ["devd", "dtb", "launch"]
readiness = "exit"
restart = "never"
max_restarts = 0
grants = ["platform-root"]
