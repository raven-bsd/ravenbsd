[package]
name = "raven-s21d-aarch64"
version = "0.1.0"
description = "S21d driver-object fixture: MMIO, DMA, GIC-400 SPI IRQ, PCI ECAM and teardown."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s21d-aarch64"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false }

[lints]
workspace = true
