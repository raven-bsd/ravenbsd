[package]
name = "raven-s33-ipc"
version = "0.1.0"
description = "S33 IPC lifecycle fixture: controller, misbehaving server and clients."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_s33_ipc"
path = "src/lib.rs"

[[bin]]
name = "raven-s33-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-s33-server"
path = "src/bin/server.rs"

[[bin]]
name = "raven-s33-loop"
path = "src/bin/loop.rs"

[[bin]]
name = "raven-s33-exit"
path = "src/bin/exit.rs"

[[bin]]
name = "raven-s33-block"
path = "src/bin/block.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }

[lints]
workspace = true
