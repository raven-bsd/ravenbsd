[package]
name = "rtld-relative-rust"
version = "0.1.0"
description = "C74o regression: a dynamic Rust PIE with PT_INTERP and DT_NEEDED libc.so.1."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

# Standalone workspace: C74o owns this fixture but not the root workspace member list.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "rtld-relative-rust"
path = "src/main.rs"

[dependencies]
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
