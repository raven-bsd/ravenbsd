# One-shot K386 session: no resident service restarts once the login shell exits.
logd_restart = "never"
consd_restart = "never"
vfsd_restart = "never"
ramfsd_restart = "never"
initfsd_restart = "never"
nulld_restart = "never"
zerod_restart = "never"
randd_restart = "never"
