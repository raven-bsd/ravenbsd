# K386 test-only getty manifest. It replaces the shell-test rsh service so the same
# fixture exercises the production getty/login path on both architectures.
name = "getty"
exec = "/sbin/getty"
args = []
needs = ["consd", "vfsd", "ramfsd", "initfsd"]
grants = ["initfs"]
readiness = "exit"
restart = "never"
max_restarts = 0
