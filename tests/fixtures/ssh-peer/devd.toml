#
# K375 guest devd. The server manifest advertises `nic:` as the readiness gate: virtio-net
# registers it before devd finishes its device pass, so netd and sshd do not wait for `dev:`.

name = "devd"
exec = "/sbin/devd"
args = ["devd"]
needs = ["scheme:pci"]
provides = ["scheme:nic", "scheme:dev"]
readiness = "scheme"
ready_timeout_ms = 60_000
restart = "never"
max_restarts = 0
