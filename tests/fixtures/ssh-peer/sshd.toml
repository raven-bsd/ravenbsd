#
# K375 guest sshd. The fixture generates the host key on the host and stages it at
# /etc/ssh/ssh_host_ed25519_key, so this service only starts the listener. rsh redirects sshd's
# stderr (`-e` diagnostics) to stdout, which the service supervisor keeps on the serial console.

name = "sshd"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "/sbin/sshd -D -e -f /etc/ssh/sshd_config 2>&1"]
needs = ["netd", "vfsd", "randd", "consd"]
readiness = "none"
restart = "on-failure"
max_restarts = 3
required = true
