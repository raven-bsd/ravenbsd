[package]
name = "raven-s16-rights"
version = "0.1.0"
description = "S16 rights revocation and namespace fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_s16_rights"
path = "src/lib.rs"

[[bin]]
name = "raven-s16-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-s16-server"
path = "src/bin/server.rs"

[[bin]]
name = "raven-s16-revoke"
path = "src/bin/revoke.rs"

[[bin]]
name = "raven-s16-prefix"
path = "src/bin/prefix.rs"

[[bin]]
name = "raven-s16-clear"
path = "src/bin/clear.rs"

[[bin]]
name = "raven-s16-exact"
path = "src/bin/exact.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
