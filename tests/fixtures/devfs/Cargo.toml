[package]
name = "raven-devfs-nodes"
version = "0.1.0"
description = "K537 devfs node, symlink, no-follow and device-permission fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-devfs-nodes"
path = "src/main.rs"
test = false

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
