# K273 fail-closed fixture: the parser must reject the fourth line and name it.
# Donor: pfctl refuses a rule with an unknown protocol; pf_test_rule() drops on a
# malformed/unsupported packet rather than passing it.

set default block
pass in on eth0 proto tcp from any to any keep state
pass in on eth0 proto quic from any to any
