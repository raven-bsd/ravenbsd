# K273 core fixture: rules, tables and NAT/RDR for the userspace pf core.
# Donor semantics: sys/netpfil/pf/pf.c pf_test_rule()/pf_match_rule(),
# sys/netpfil/pf/pf_lb.c pf_get_transaddr(), pf_table.c pfr_match_addr().

set default block

table <web> { 192.0.2.10, 192.0.2.11, 2001:db8:1::10 }

pass quick in on lo all
block in proto udp from any to any
pass in on eth0 proto tcp from 10.0.0.0/8 to <web> port 443 keep state log
pass out on eth0 proto tcp from any to any port 53 keep state
pass out on eth0 inet6 proto tcp from 2001:db8::/32 to 2001:db8:1::/48 port 443 keep state
pass in inet6 proto icmp6 from 2001:db8::/32 to any keep state
pass in on eth0 proto tcp from any to 10.0.0.80 port 8080 keep state

nat on eth0 from 10.0.0.0/8 to any -> 203.0.113.7
rdr on eth0 proto tcp from any to 203.0.113.7 port 80 -> 10.0.0.80 port 8080
