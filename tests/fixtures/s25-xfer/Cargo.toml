[package]
name = "raven-s25-xfer"
version = "0.1.0"
description = "S25 handle-transfer and scheme-attachment fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s25-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-s25-child"
path = "src/bin/child.rs"

[[bin]]
name = "raven-s25-server"
path = "src/bin/server.rs"

[lib]
name = "raven_s25_xfer"
path = "src/lib.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }

[lints]
workspace = true
