[package]
name = "raven-smp-tlb"
version = "0.1.0"
description = "S76b aarch64 remote TLB shootdown fixture: one CPU remaps a user page while another reads it."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_smp_tlb"
path = "src/lib.rs"

[[bin]]
name = "smp-tlb-init"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", features = ["alloc", "panic-handler"] }

[lints]
workspace = true
