[package]
name = "raven-pi4-net-model"
version = "0.1.0"
description = "Host/qtest model for the Pi 4 release network launch/readiness chain."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-pi4-net-model"
path = "src/main.rs"

[dependencies]
raven-initfs = { path = "../../../../crates/raven-initfs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["panic-handler"] }

[lints]
workspace = true
