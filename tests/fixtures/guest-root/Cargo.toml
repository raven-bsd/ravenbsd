# Standalone package: a throw-away qtest fixture, not part of the product workspace.
[workspace]

[package]
name = "raven-guest-root-fixture"
version = "0.1.0"
description = "S777 fixture: the FreeBSD base /root skeleton in the target guest initfs."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-guest-root-fixture"
path = "src/main.rs"

[dependencies]
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
