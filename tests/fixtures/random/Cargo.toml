# Standalone qtest fixture for K524: AT_RANDOM and GETRANDOM from the boot-seeded pool.
[workspace]

[package]
name = "raven-random"
version = "0.1.0"
description = "K524 fixture: AT_RANDOM and GETRANDOM from the kernel entropy pool."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-random"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
