[package]
name = "raven-b70-probe"
version = "0.1.0"
description = "B70 end-to-end probe: DHCP lease, route, ICMP, resolver and host TCP echo."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-proto-net = { path = "../../../../crates/raven-proto-net" }
raven-rt = { path = "../../../../userland/rt", features = ["alloc"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }
resolvd = { path = "../../../../userland/servers/resolvd" }

[lints]
workspace = true
