[package]
name = "raven-s37-fs"
version = "0.1.0"
description = "S37 kernel filesystem plumbing fixture: K66 server, client and death transfer."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_s37_fs"
path = "src/lib.rs"

[[bin]]
name = "raven-s37-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-s37-server"
path = "src/bin/server.rs"

[[bin]]
name = "raven-s37-client"
path = "src/bin/client.rs"

[[bin]]
name = "raven-s37-death-client"
path = "src/bin/death_client.rs"

[[bin]]
name = "raven-s37-death-reader"
path = "src/bin/death_reader.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }

[lints]
workspace = true
