# S44 C19 kernel-frame fixture. The program exits 0 only when every row passes; svcd propagates
# the status through exit_when_exits so the qtest sees init exited (0) or (1).

name = "signal-frame"
exec = "/bin/signal-frame"
args = ["/bin/signal-frame"]
needs = ["scheme:file", "scheme:tty"]
grants = ["initfs"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
