# S44 poll-interrupt fixture. The program exits 0 only when the blocked poll returns EINTR.

name = "signal-poll"
exec = "/bin/signal-poll"
args = ["/bin/signal-poll"]
needs = ["scheme:tty"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
