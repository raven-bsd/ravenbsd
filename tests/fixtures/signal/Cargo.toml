[package]
name = "raven-s44-action"
version = "0.1.0"
description = "S44 fixture: kernel sigaction table, C19 sigframe, sigcode return and altstack."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s44-action"
path = "src/main.rs"

[[bin]]
name = "raven-s44-exec-probe"
path = "src/exec_probe.rs"

[[bin]]
name = "raven-s44-poll"
path = "src/poll.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
