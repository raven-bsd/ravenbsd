[package]
name = "raven-s21-edu"
version = "0.1.0"
description = "S21a driver-object fixture: ECAM scan, edu BAR0 and the negative matrix."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s21-edu"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-elf = { path = "../../../crates/raven-elf" }
raven-initfs = { path = "../../../crates/raven-initfs" }
# `raven-scheme` links `alloc` unconditionally, so the driver fixture needs the runtime
# allocator even though it never allocates (K463).
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc"] }

[lints]
workspace = true
