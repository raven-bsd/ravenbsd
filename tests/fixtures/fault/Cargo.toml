[package]
name = "raven-fault-reconnect"
version = "0.1.0"
description = "S71 fault-injection fixture: a server that dies during an in-flight request and a client that reconnects."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-fault"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-proto-svc = { path = "../../../crates/raven-proto-svc" }
raven-scheme = { path = "../../../crates/raven-scheme" }
raven-rt = { path = "../../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
