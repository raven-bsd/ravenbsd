[package]
name = "raven-dynamic-exec"
version = "0.1.0"
description = "S81 dynamic-exec fixture: a static /init that execs an ET_DYN + PT_INTERP image."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-dynamic-exec-init"
path = "src/bin/init.rs"

[dependencies]
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints]
workspace = true
