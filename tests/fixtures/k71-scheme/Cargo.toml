[package]
name = "raven-k71-scheme"
version = "0.1.0"
description = "K71 reply-attachment fixture: server, client and tested MemObjects."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_k71_scheme"
path = "src/lib.rs"

[[bin]]
name = "raven-k71-init"
path = "src/bin/init.rs"

[[bin]]
name = "raven-k71-server"
path = "src/bin/server.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
