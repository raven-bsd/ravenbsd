#
# K498 trace overlay: the release sshd service with maximal debug logging.
# The binary and the product configuration are unchanged; only the runtime flags
# and the log path differ, and both live in the test initfs.

name = "sshd"
exec = "/sbin/sshd"
args = ["/sbin/sshd", "-D", "-ddd", "-E", "/dev/console", "-f", "/etc/ssh/sshd_config"]
needs = ["netd", "vfsd", "consd", "ptyd", "ssh-hostkeys"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
