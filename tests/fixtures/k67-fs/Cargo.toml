[package]
name = "raven-k67-fs"
version = "0.1.0"
description = "K67 filesystem server conformance fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[lib]
name = "raven_k67_fs"
path = "src/lib.rs"

[[bin]]
name = "raven-k67-fs"
path = "src/bin/init.rs"

[[bin]]
name = "raven-k67-client"
path = "src/bin/client.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-ipc = { path = "../../../crates/raven-ipc" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
