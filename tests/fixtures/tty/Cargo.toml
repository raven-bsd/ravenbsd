[package]
name = "raven-tty-fixture"
version = "0.1.0"
description = "P3 pty and terminal job-control fixture."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-tty-init"
path = "src/init.rs"

[[bin]]
name = "raven-tty-child"
path = "src/child.rs"

[dependencies]
raven-abi = { path = "../../../crates/raven-abi" }
raven-initfs = { path = "../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../crates/raven-proto-fs" }
raven-proto-proc = { path = "../../../crates/raven-proto-proc" }
raven-rt = { path = "../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../crates/raven-scheme" }

[lints]
workspace = true
