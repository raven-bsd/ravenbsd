# S710 public-libc sigaction boundary fixture. The program runs only the marshal/unmarshal and
# guard-page rows; the raise-dependent acceptance rows stay in the signal-acceptance service and
# keep their separately owned red state.

name = "signal-boundary"
exec = "/bin/signal-acceptance"
args = ["/bin/signal-acceptance", "boundary"]
needs = ["scheme:tty"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
