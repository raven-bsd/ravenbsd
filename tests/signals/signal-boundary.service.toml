# S710 public-libc sigaction boundary fixture. The Rust program runs only the marshal/unmarshal,
# guard-page, canary and sigprocmask rows; the raise-dependent C acceptance rows stay in the
# signal-acceptance service and keep their separately owned red state.

name = "signal-boundary"
exec = "/bin/signal-libc"
args = ["/bin/signal-libc", "boundary"]
needs = ["scheme:tty"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
