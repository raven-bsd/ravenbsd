[workspace]

[package]
name = "raven-usb-hid-fuzz"
version = "0.1.0"
description = "S64 host-only corpus and mutation fuzz harness for the USB HID decoders."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[dependencies]
raven-usb-hid = { path = "../../../crates/raven-usb-hid" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
