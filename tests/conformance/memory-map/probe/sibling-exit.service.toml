#
# S715: the sibling-exit probe owns the image lifetime; init must exit with its status.

name = "libc-test"
exec = "/bin/libc-test"
# The spawn contract takes the full argv; the first element is argv[0].
args = ["/bin/libc-test", "--sibling-exit"]
needs = ["scheme:file", "consd"]
grants = ["initfs"]
readiness = "exit"
restart = "never"
max_restarts = 0
ready_timeout_ms = 60_000
