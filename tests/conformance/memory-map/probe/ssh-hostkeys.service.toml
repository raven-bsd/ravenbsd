#
# S177/S195 test-only ssh-hostkeys service: the product service uses /bin/rsh, which currently
# crashes at rip=0 under the C19 signal model. The helper creates /tmp/ssh and execs /bin/ssh-keygen.

name = "ssh-hostkeys"
exec = "/bin/s177-hostkeys"
args = ["/bin/s177-hostkeys"]
needs = ["vfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
