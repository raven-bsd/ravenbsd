#
# S733: one one-shot filesystem-record conformance probe. It runs the normal rows and both
# controlled mutations; the host runner parses the row contract and owns the final exit mapping.

name = "fs-records"
exec = "/bin/conformance-probe"
args = ["fs-records-conformance", "--all"]
needs = ["scheme:file", "ramfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
