# Standalone package: an S190 conformance probe, not part of the product workspace.
[workspace]

[package]
name = "raven-s190-limits"
version = "0.1.0"
description = "S190 conformance probe: kernel and libc rlimit/rusage rows as a no_std init."
edition = "2024"
license = "BSD-3-Clause"
authors = ["Bo Maryniuk and RavenBSD contributors"]
rust-version = "1.97"

[package.metadata.raven]
target = "none"

[[bin]]
name = "raven-s190-limits"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-libc = { path = "../../../../libc/ravenlibc/crates/raven-libc", default-features = false, features = ["tiny"] }
raven-libc-abi = { path = "../../../../libc/ravenlibc/crates/raven-libc-abi" }
raven-libc-proc = { path = "../../../../libc/ravenlibc/crates/raven-libc-proc" }
raven-libc-sys = { path = "../../../../libc/ravenlibc/crates/raven-libc-sys" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
