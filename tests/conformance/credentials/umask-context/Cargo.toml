# S730 credential conformance fixture. It is deliberately not a member of the product
# workspace: the ticket owns `tests/conformance/credentials/**`, so the fixture carries its own
# workspace root and builds with `--manifest-path`.
[workspace]

[package]
name = "raven-cred-conformance"
version = "0.1.0"
description = "S730 raw-client conformance fixture: kernel umask and authenticated creation context."
edition = "2024"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "raven-cred-conformance"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-ipc = { path = "../../../../crates/raven-ipc" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
