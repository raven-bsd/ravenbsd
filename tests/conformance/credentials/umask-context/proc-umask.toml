# S730 kernel umask and authenticated creation context (x86-64). A raw client proves the atomic
# swap, ALLPERMS normalisation, fork inheritance, exec preservation and concurrent swaps, then a
# scheme server obtains the kernel-recorded client context and rejects a short record, a forged
# handle, a non-creation request and a retired request.

name = "proc-umask"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/conformance/credentials/umask-context/build.sh"]
initfs = "build/conformance/credentials/umask-context/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^proc-umask: start$'

[[expect]]
regex = '^umask-client: inherited=27$'

[[expect]]
regex = '^proc-umask: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|proc-umask: fail|cred-client: fail|umask-client: fail'
