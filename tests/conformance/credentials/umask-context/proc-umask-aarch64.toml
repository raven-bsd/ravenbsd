# S730 kernel umask and authenticated creation context (aarch64). Same fixture and assertions as
# proc-umask.toml, built for the aarch64 target.

name = "proc-umask-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/conformance/credentials/umask-context/build.sh"]
initfs = "build/conformance/credentials/umask-context/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^proc-umask: start$'

[[expect]]
regex = '^umask-client: inherited=27$'

[[expect]]
regex = '^proc-umask: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|proc-umask: fail|cred-client: fail|umask-client: fail'
