# S190 one-shot service: the credential probe's kernel/libc rlimit and rusage rows run as `raven`
# without going through the brush shell.
name = "cred-limits"
exec = "/bin/cred-probe"
args = ["/bin/cred-probe", "limits-service"]
needs = ["scheme:file"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
