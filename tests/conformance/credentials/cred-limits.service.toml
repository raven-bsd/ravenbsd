# S190 limits image definition. The no_std Rust probe is packed as the initfs /init, so it runs
# directly as PID 1 and owns the image lifetime; this manifest records the same probe for a
# service-managed boot of the same image.
name = "cred-limits"
exec = "/init"
args = ["/init"]
needs = []
readiness = "none"
restart = "never"
max_restarts = 0
required = false
