# S179 one-shot service: the credential probe runs the whole gate table as `raven` without going
# through the brush shell. `cred.svcd.conf` makes svcd exit with this service's status.
name = "cred-service"
exec = "/bin/cred-probe"
args = ["/bin/cred-probe", "cred-service"]
needs = ["scheme:file"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
