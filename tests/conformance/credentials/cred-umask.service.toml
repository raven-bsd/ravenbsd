# S189 one-shot service: the credential probe runs the umask create/exec rows as `raven` without
# going through the brush shell. `cred.svcd.conf` makes svcd exit with this service's status.
name = "cred-umask"
exec = "/bin/cred-probe"
args = ["umask-service"]
needs = ["scheme:file"]
readiness = "none"
restart = "never"
max_restarts = 0
required = false
