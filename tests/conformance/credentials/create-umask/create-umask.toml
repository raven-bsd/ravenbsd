# S731 end-to-end create semantics (x86-64). Creates through `file:` (vfsd -> ramfsd) with
# explicit masks and requested modes and asserts the real inode mode/owner at first return:
# masks 027/077, requested 0600, an unchanged existing file, an unprivileged creator and mkdir.

name = "create-umask"
arch = "x86_64"
profile = "base"
timeout_secs = 240
pre = ["sh tests/conformance/credentials/create-umask/build.sh"]
initfs = "build/conformance/credentials/create-umask/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = []
expect_exit = "success"

[[expect]]
regex = '^create-umask: services ok$'

[[expect]]
regex = '^create-umask: mask027 mode=0640 owner=0:0$'

[[expect]]
regex = '^create-umask: mask077 mode=0600 owner=0:0$'

[[expect]]
regex = '^create-umask: requested mode=0600 owner=0:0$'

[[expect]]
regex = '^create-umask: existing unchanged mode=0640 owner=0:0$'

[[expect]]
regex = '^create-umask: uid1000 mode=0640 owner=1000:1000$'

[[expect]]
regex = '^create-umask: mkdir mode=0750 owner=1000:1000$'

[[expect]]
regex = '^create-umask: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION|create-umask: fail'
