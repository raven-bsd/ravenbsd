# S731 create-semantics conformance fixture. It is deliberately not a member of the product
# workspace: the ticket owns `tests/conformance/credentials/**`, so the fixture carries its own
# workspace root and builds with `--manifest-path`.

[workspace]

[package]
name = "raven-create-conformance"
version = "0.1.0"
description = "S731 end-to-end create semantics: mode, mask and caller ownership through vfsd/ramfsd."
edition = "2024"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "raven-create-conformance"
path = "src/main.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-initfs = { path = "../../../../crates/raven-initfs" }
raven-proto-fs = { path = "../../../../crates/raven-proto-fs" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }
raven-scheme = { path = "../../../../crates/raven-scheme" }
raven-libc-sys = { path = "../../../../libc/ravenlibc/crates/raven-libc-sys", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
