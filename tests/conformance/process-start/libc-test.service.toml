#
# S714: the process-start conformance probe is the one-shot libc-test service. It forks, spawns
# and execs its own image; no row needs a login shell.

name = "libc-test"
exec = "/bin/libc-test"
# The spawn contract takes the full argv; the first element is argv[0].
args = ["/bin/libc-test", "probe"]
needs = ["scheme:file", "consd"]
grants = ["initfs"]
readiness = "exit"
restart = "never"
max_restarts = 0
ready_timeout_ms = 60_000
