# S173: EINTR single-row isolation (no timerfd/socket rows, no SSH).
name = "eintr-case"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/conformance/polling/eintr/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"
[[expect]]
regex = '^eintr-case: ok$'
[[forbid]]
regex = '(?i)eintr-case: fail|panic|EXCEPTION'
