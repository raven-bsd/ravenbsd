# S173: timerfd single-row isolation (no signal rows, no SSH). The markers pin the hang.
name = "timerfd-case"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/conformance/polling/timerfd/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"
[[expect]]
regex = '^timerfd-case: ok$'
[[forbid]]
regex = '(?i)timerfd-case: fail|panic|EXCEPTION'
