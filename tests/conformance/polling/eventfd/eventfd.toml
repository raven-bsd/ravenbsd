# S173: eventfd single-row readiness (no signals, no sockets).
name = "eventfd-case"
arch = "x86_64"
profile = "libc-test"
timeout_secs = 120
pre = ["sh tests/conformance/polling/eventfd/build.sh"]
boot_cmdline = "console=ttyS0 test-exit=1"
expect_exit = "success"
[[expect]]
regex = '^eventfd-case: ok$'
[[forbid]]
regex = '(?i)eventfd-case: fail|panic|EXCEPTION'
