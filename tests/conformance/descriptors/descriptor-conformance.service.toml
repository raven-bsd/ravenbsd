#
# S172: one one-shot descriptor conformance probe.  It runs the normal rows and both controlled
# mutations; the host runner parses the row contract and owns the final exit mapping.

name = "descriptor-conformance"
exec = "/bin/conformance-probe"
args = ["descriptor-conformance", "--all"]
needs = ["scheme:file", "ramfsd", "ptyd", "devd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
