#
# S742 test-only service: run the terminal conformance probe once at boot and print the rows to
# the serial console. Signal rows run for real (`--signals`); the deliberate termios mutation
# proves the termios row is not vacuous. `readiness = "exit"` and `required = false` keep a red
# row from stopping the boot; the runner reads the rows from the serial log.

name = "terminal-conformance"
exec = "/bin/rsh"
args = ["/bin/rsh", "-c", "/bin/terminal-conformance --signals; echo S175-TERM-MUTATION-BEGIN; /bin/terminal-conformance --mutation-termios --signals"]
needs = ["vfsd", "tmpfs", "ptyd", "devd", "consd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
