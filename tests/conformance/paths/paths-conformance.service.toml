#
# S732: one one-shot pathname conformance probe. It runs the normal rows and three controlled
# mutations; the host runner parses the row contract and owns the final exit mapping.

name = "paths-conformance"
exec = "/bin/conformance-probe"
args = ["paths-conformance", "--all"]
needs = ["scheme:file", "ramfsd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
