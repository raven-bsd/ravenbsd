name = "clocks-conformance"
arch = "x86_64"
profile = "base"
timeout_secs = 180
pre = ["sh tests/conformance/clocks/build.sh"]
initfs = "build/conformance/clocks/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    "-nic", "none",
    "-netdev", "user,id=n0",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
]
expect_exit = "success"

[[expect]]
regex = '^clocks: ids ok$'

[[expect]]
regex = '^clocks: getres ok$'

[[expect]]
regex = '^clocks: monotonic ok$'

[[expect]]
regex = '^clocks: sleep ok elapsed_ns=[0-9]+$'

[[expect]]
regex = '^clocks: eintr ok remaining_ns=[0-9]+$'

[[expect]]
regex = '^clocks: gettimeofday ok delta_ns=[0-9]+$'

[[expect]]
regex = '^clocks: rates ok real_ns=[0-9]+ mono_ns=[0-9]+$'

[[expect]]
regex = '^clocks: ok$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|clocks: fail'
