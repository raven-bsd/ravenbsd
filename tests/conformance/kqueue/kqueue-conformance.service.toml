#
# S743: one one-shot kqueue conformance probe. It runs the normal rows and the controlled
# mutations; the host runner parses the row contract and owns the final exit mapping.

name = "kqueue-conformance"
exec = "/bin/conformance-probe"
args = ["kqueue-conformance", "--all"]
needs = ["scheme:file"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
