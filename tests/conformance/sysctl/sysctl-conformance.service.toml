#
# S744: one one-shot sysctl conformance probe. It runs the normal rows and the three controlled
# mutations; the probe exits zero only when every normal row passes and every mutation is caught.

name = "sysctl-conformance"
exec = "/bin/conformance-probe"
args = ["sysctl-conformance", "--all"]
needs = ["sysd"]
readiness = "exit"
restart = "never"
max_restarts = 0
required = false
