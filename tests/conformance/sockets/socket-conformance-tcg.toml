# S174 socket conformance, TCG control. The guest runs the one-shot probe on the
# network-config-test profile; the host peer drives accept/getpeername, SO_ERROR,
# shutdown(FIN then read), half-close, SHUT_RD, SHUT_RDWR, and close/rebind.
name = "socket-conformance-tcg"
arch = "x86_64"
profile = "network-config-test"
timeout_secs = 180
pre = [
    "sh tests/conformance/sockets/build.sh",
    "sh tests/conformance/sockets/start-host.sh",
]
initfs = "build/fixtures/socket-conformance/initfs.img"
boot_cmdline = "console=ttyS0 test-exit=1"
qemu_extra = [
    # One vCPU: the 4-vCPU post-summary teardown hang (K574 open gap, process/fd) prevents
    # `init exited`; the socket rows themselves are identical. K574 owns the TCG4 gate row.
    "-accel", "tcg", "-smp", "1",
    "-nic", "none",
    "-netdev", "user,id=n0,hostfwd=tcp:127.0.0.1:0-:23100",
    "-device", "virtio-net-pci,netdev=n0,disable-legacy=on",
    "-monitor", "unix:build/fixtures/socket-conformance/monitor.sock,server=on,wait=off",
    "-object", "filter-dump,id=f0,netdev=n0,file=build/fixtures/socket-conformance/qemu.pcap",
]
expect_exit = "success"

[[expect]]
regex = '^.*CONFORM layout PASS .*$'

[[expect]]
regex = '^.*CONFORM reuseaddr PASS .*$'

[[expect]]
regex = '^.*CONFORM accept PASS .*$'

[[expect]]
regex = '^.*CONFORM soerror PASS .*$'

[[expect]]
regex = '^.*CONFORM shutdown PASS .*$'

[[expect]]
regex = '^.*CONFORM half PASS .*$'

[[expect]]
regex = '^.*CONFORM shutrd PASS .*$'

[[expect]]
regex = '^.*CONFORM shutrdwr PASS .*$'

[[expect]]
regex = '^.*CONFORM rebound PASS .*$'

[[expect]]
regex = '^.*CONFORM SUMMARY PASS 10/10$'

[[expect]]
regex = '^init exited \(0\)$'

# S186 stops a case at the first forbidden line. A row-level FAIL must not abort the run before
# the remaining rows print; the expects above already require every row PASS and SUMMARY 10/10.
# Only a crash is forbidden here.
[[forbid]]
regex = '(?i)panic|EXCEPTION'
