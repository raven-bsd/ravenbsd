[package]
name = "signal-exec-aarch64"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.raven]
target = "none"

[[bin]]
name = "signal-init"
path = "src/init.rs"

[[bin]]
name = "signal-exec-child"
path = "src/exec_child.rs"

[dependencies]
raven-abi = { path = "../../../../crates/raven-abi" }
raven-rt = { path = "../../../../userland/rt", default-features = false, features = ["alloc", "panic-handler"] }

[workspace]
