# S755: the B47a scheme IPC transport contract on two CPUs. The shipped
# tests/qtest/cases/scheme-aarch64.toml boots one CPU, so the cross-CPU wake and the
# client-death path are never exercised together with a sibling process on the other
# CPU. This row runs the same fixture with -smp 2 and requires the same rows.
name = "scheme-smp2-aarch64"
arch = "aarch64"
profile = "base"
timeout_secs = 120
pre = ["sh tests/fixtures/b47a-ipc/build.sh"]
initfs = "build/fixtures/b47a-ipc/initfs.img"
boot_cmdline = "console=ttyAMA0 test-exit=1 s32-capturecheck"
qemu_extra = ["-smp", "2"]
expect_exit = "success"

[[expect]]
regex = '^smp: 2 cpus online$'

[[expect]]
regex = '^b47a: svcd svc: ok$'

[[expect]]
regex = '^b47a: server ready$'

[[expect]]
regex = '^b47a: roundtrip ok$'

[[expect]]
regex = '^b47a: client held$'

[[expect]]
regex = '^s32: capture frames=[1-9][0-9]* free_bytes=[0-9]+$'

[[expect]]
regex = '^b47a: client death EIO$'

[[expect]]
regex = '^b47a: release ok$'

[[expect]]
regex = '^s32: capture frames=0 free_bytes=[0-9]+$'

[[expect]]
regex = '^b47a: done$'

[[expect]]
regex = '^init exited \(0\)$'

[[forbid]]
regex = '(?i)panic|EXCEPTION'
