[package]
name = "raven-auth"
version = "0.1.0"
description = "Password hashing and the shadow-record store for the RavenBSD login."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
sha-crypt = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }

[build-dependencies]
sha-crypt = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }

[lints]
workspace = true
