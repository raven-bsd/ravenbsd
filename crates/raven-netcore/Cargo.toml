[package]
name = "raven-netcore"
version = "0.1.0"
description = "OS-independent nonblocking socket layer over the native raven-tcpip stack: nonblocking TCP/UDP sockets, readiness events and interface configuration."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Builds the in-memory PairDevice used by integration tests and host harnesses.
testutil = []

[[test]]
name = "core"
required-features = ["testutil"]

[[test]]
name = "tcp"
required-features = ["testutil"]

[[test]]
name = "scenarios"
required-features = ["testutil"]

[[test]]
name = "udp"
required-features = ["testutil"]

[[test]]
name = "observability"
required-features = ["testutil"]

[dependencies]
raven-abi = { path = "../raven-abi" }
raven-tcpip = { path = "../raven-tcpip" }
