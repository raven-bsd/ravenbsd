[package]
name = "raven-tcpip"
version = "0.1.0"
description = "OS-independent RavenBSD TCP/IP stack skeleton: device boundary, time, buffers and poll loop."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Builds the in-memory loopback/null devices used by host tests and simulators.
testutil = []
# TCP MD5/AO plumbing; digest backend requires reviewer approval.
tcp-md5 = ["dep:md-5"]
tcp-ao = ["dep:sha1", "dep:sha2", "dep:hmac"]

[dev-dependencies]
raven-tcpip-wire = { path = "../raven-tcpip-wire" }
raven-tcpip-sim = { path = "../../tests/tcpip" }

[dependencies]
raven-tcpip-wire = { path = "../raven-tcpip-wire" }
raven-abi = { path = "../raven-abi" }
raven-prng = { path = "../raven-prng" }
md-5 = { version = "0.10", default-features = false, optional = true }
sha1 = { version = "0.10", default-features = false, features = ["force-soft"], optional = true }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"], optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
