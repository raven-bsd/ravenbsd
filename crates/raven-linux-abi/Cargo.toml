[package]
name = "raven-linux-abi"
version = "0.1.0"
description = "Linux UAPI syscall numbers, errno values, flags and ABI struct layouts for the RavenBSD Linux personality."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# No runtime dependencies: the tables and layouts are plain data.
[dependencies]

[dev-dependencies]
# Verification is done against the same generated data the tables were derived from.
linux-raw-sys = { version = "0.12", default-features = false, features = [
    "std",
    "auxvec",
    "general",
    "errno",
    "net",
    "system",
] }
raven-abi = { path = "../raven-abi" }
