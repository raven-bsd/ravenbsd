[package]
name = "raven-theme"
version = "0.1.0"
description = "The RavenBSD semantic palette and ANSI renderer."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["config"]
std = []
config = ["std", "dep:serde", "dep:toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "1.2", optional = true }

[lints]
workspace = true
