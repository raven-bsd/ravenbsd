[package]
name = "raven-http-net"
version = "0.1.0"
description = "Socket and resolvd adapter for the RavenBSD HTTP/1.1 core."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-http = { path = "../raven-http" }

[[bin]]
name = "http-fetch"
path = "src/bin/http-fetch.rs"

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../raven-abi" }
raven-proto-net = { path = "../raven-proto-net" }
raven-scheme = { path = "../raven-scheme" }
raven-rt = { path = "../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
