[package]
name = "raven-cli"
version = "0.1.0"
description = "The `raven` command metadata, parser and host-side command modules."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
lexopt = "0.3"
raven-config = { path = "../raven-config" }
raven-output = { path = "../raven-output" }
raven-theme = { path = "../raven-theme", features = ["config"] }

[target.'cfg(target_os = "ravenbsd")'.dependencies]
raven-abi = { path = "../raven-abi" }
raven-proto-fs = { path = "../raven-proto-fs" }
raven-proto-net = { path = "../raven-proto-net" }
raven-scheme = { path = "../raven-scheme" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
