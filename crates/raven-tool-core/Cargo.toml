[package]
name = "raven-tool-core"
version = "0.1.0"
description = "Pure option, path, mode and size helpers for the RavenBSD file tools."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "raven_tool_core"
path = "src/lib.rs"

[[bin]]
name = "raven-tool-core"
path = "src/bin/tooltest.rs"

[dependencies]
raven-abi = { path = "../../crates/raven-abi" }
raven-proto-fs = { path = "../../crates/raven-proto-fs" }

[target.'cfg(target_os = "none")'.dependencies]
raven-abi = { path = "../../crates/raven-abi" }
raven-initfs = { path = "../../crates/raven-initfs" }
raven-rt = { path = "../../userland/rt", features = ["alloc"] }

[lints]
workspace = true
