[package]
name = "raven-kmem"
version = "0.1.0"
description = "Object caches and a size-class allocator over raven-vmem."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
raven-vmem = { path = "../raven-vmem" }

[features]
default = []
# Opt-in debug allocator: redzones, freed-pattern poison and an allocation audit ring.
# The default build carries no per-allocation debug cost.
debug = []

[lints]
workspace = true
