[package]
name = "xtask"
version = "0.1.0"
description = "RavenBSD build orchestration: the Rust backend of the top-level Makefile."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
raven-initfs = { path = "../crates/raven-initfs", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"

[lints]
workspace = true
