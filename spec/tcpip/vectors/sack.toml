# SACK scoreboard vectors: loss marks, Pipe and NextSeg.
# RFCs encoded: 6675 sections 2-5 (scoreboard, IsLost, SetPipe, NextSeg),
# 2018 section 3 (SACK blocks), 2883 (DSACK). Offsets are bytes relative to
# snd_una; see sack.md for the exact definitions and worked cases.

[[case]]
name = "empty-scoreboard"
mss = 1000
dup_ack_threshold = 3
snd_una = 0
high_data = 10000
high_rxt = 0
unsent_available = true
receiver_window = 20000
range_cap = 16
sacked = []
expect = { sacked_after = [], dsack_detected = false, reneging = false, dropped = 0, pipe = 10000, lost = [], next_seg = { start = 10000, len = 1000, kind = "new", rule = 2 }, high_rxt_after = 0, rescue_rxt_after = -1 }

