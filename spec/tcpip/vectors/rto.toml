# RTT sample and timeout sequences -> SRTT, RTTVAR, RTO.
# RFC 6298 sections 2.2, 2.3, 2.4, 2.5 and 5; RFC 1122 section 4.2.3.1.
# Fixed point: SRTT/RTTVAR in eighths of a millisecond (q8).
# See rto.md for the exact arithmetic and rounding.

[[sequence]]
name = "single-100"
rto_min_ms = 1
rto_max_ms = 60000
clock_granularity_ms = 1
timeline = [
  { kind = "sample", rtt_ms = 100 },
]
expected = [
  { kind = "sample", rtt_ms = 100, srtt_q8 = 800, rttvar_q8 = 400, rto_computed_ms = 300, rto_ms = 300 },
]

