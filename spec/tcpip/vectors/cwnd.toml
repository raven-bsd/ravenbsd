#
# ACK/loss sequences -> cwnd and ssthresh, in bytes.
# RFCs encoded: 5681 sections 3.1-3.2 and 4.1 (Reno baseline, fast recovery,
# idle restart), 6582 section 3.2 (NewReno partial ACK), 6928 (initial
# window), 8312 sections 4.1-4.8 and 5.8 (CUBIC), 6937 (PRR, described in the
# sibling markdown). NewReno and CUBIC arithmetic is defined in cwnd.md;
# each step names its event.

[[sequence]]
name = "newreno-slow-start"
algorithm = "newreno"
mss = 1460
cwnd_max = 16777216
initial_cwnd = 14600
initial_ssthresh = 1000000
rule = "RFC 5681 s3.1 slow start; RFC 3465 ABC"
steps = [
  { event = "rtt", acks = 10, expected_cwnd = 29200, expected_ssthresh = 1000000 },
  { event = "rtt", acks = 20, expected_cwnd = 58400, expected_ssthresh = 1000000 },
]

